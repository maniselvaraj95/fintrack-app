    const Trash2 = ({c}) => <Icon c={c}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/></Icon>;
    const SettingsIcon = ({c}) => <Icon c={c}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></Icon>;
    const TagIcon = ({c}) => <Icon c={c}><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82zM7 7h.01"/></Icon>;
    const LockIcon = ({c}) => <Icon c={c}><rect x="5" y="11" width="14" height="10" rx="2" ry="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></Icon>;
    const DeleteIcon = ({c}) => <Icon c={c}><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zM18 9l-6 6M12 9l6 6"/></Icon>;
    const Sun = ({c}) => <Icon c={c}><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></Icon>;
    const Moon = ({c}) => <Icon c={c}><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></Icon>;
    const Eye = ({c}) => <Icon c={c}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></Icon>;
    const EyeOff = ({c}) => <Icon c={c}><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24M1 1l22 22"/></Icon>;

    const MONTH_NAMES = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    const MONTH_NAMES_FULL = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const parseDateLocal = (s) => { if (!s) return new Date(); const p=String(s).split('-'); return p.length===3 ? new Date(p[0],p[1]-1,p[2]) : new Date(s); };
    const formatDateStr = (s) => { const d=parseDateLocal(s); return isNaN(d)?'':`${String(d.getDate()).padStart(2,'0')}-${MONTH_NAMES[d.getMonth()]}-${String(d.getFullYear()).slice(-2)}`; };
    const formatDateShort = (s) => { const d=parseDateLocal(s); return isNaN(d)?'':`${String(d.getDate()).padStart(2,'0')} ${MONTH_NAMES[d.getMonth()]}`; };
    const parseAmt = (v) => { const n=parseFloat(String(v).replace(/[^\d.-]/g, '')); return isNaN(n)?0:n; };
    const formatINR = (v, p) => p ? '₹ ......' : new Intl.NumberFormat('en-IN', { style:'currency',currency:'INR',maximumFractionDigits:0 }).format(v);
    const formatCompact = (v, p) => p ? '......' : (Math.abs(v)>=100000 ? `₹${(v/100000).toFixed(2)}L` : Math.abs(v)>=1000 ? `₹${(v/1000).toFixed(2)}k` : `₹${Math.round(v)}`);
    const extractTags = (s) => String(s||'').split(/[\s,;]+/).map(t=>t.trim().toLowerCase()).filter(t=>t.length>0&&t!=='#').map(t=>t.startsWith('#')?t:`#${t}`);

    const normalizeCategory = (cat) => {
        if (!cat) return '';
        const upper = String(cat).toUpperCase().trim();
        if (upper === 'TRANSFER') return 'TRANSFER';
        return String(cat).trim().toLowerCase().split(/\s+/).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
    };

    function getHeatmapCellStyles(val, maxVal, isDark) {
      if (!val || val === 0 || !maxVal) return { style: { backgroundColor: isDark ? '#292524' : '#f8fafc' }, className: isDark ? 'text-slate-500 font-normal' : 'text-slate-400 font-normal' };
      const intensity = val / maxVal;
      if (intensity <= 0.25) return { style: { backgroundColor: isDark ? '#431407' : '#ffedd5' }, className: isDark ? 'text-orange-200 font-bold' : 'text-orange-800 font-bold' };
      if (intensity <= 0.55) return { style: { backgroundColor: isDark ? '#9a3412' : '#fdba74' }, className: isDark ? 'text-white font-extrabold' : 'text-orange-900 font-extrabold' };
      if (intensity <= 0.80) return { style: { backgroundColor: isDark ? '#c2410c' : '#f97316' }, className: 'text-white font-extrabold' };
      return { style: { backgroundColor: '#e06c53' }, className: 'text-white font-black' };
    }

    function SearchableSelect({ options, value, onChange, placeholder, compact = false, excludedList = [], disabled = false }) {
      const [isOpen, setIsOpen] = useState(false);
      const [search, setSearch] = useState('');
      const [hlIdx, setHlIdx] = useState(-1);
      const wrapperRef = useRef(null); const inputRef = useRef(null); const listRef = useRef(null);

      useEffect(() => { 
        function h(e) { if (wrapperRef.current && !wrapperRef.current.contains(e.target)) { setIsOpen(false); setSearch(''); if (inputRef.current) inputRef.current.blur(); } } 
        document.addEventListener("mousedown", h); document.addEventListener("touchstart", h);
        return () => { document.removeEventListener("mousedown", h); document.removeEventListener("touchstart", h); } 
      }, []);

      const filtered = (options||[]).filter(o => String(o).toLowerCase().includes(String(search).toLowerCase()));
      useEffect(() => { setHlIdx(-1); }, [search]);
      
      useEffect(() => {
          if (isOpen && hlIdx >= 0 && listRef.current) {
              const el = listRef.current.children[hlIdx + (compact ? 1 : 0)]; 
              if (el) el.scrollIntoView({ block: 'nearest' });
          }
      }, [hlIdx, isOpen, compact]);

      const handleKeyDown = (e) => {
          if (disabled) return;
          if (!isOpen && (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown')) { e.preventDefault(); setIsOpen(true); return; }
          if (!isOpen) return;
          if (e.key === 'ArrowDown') { e.preventDefault(); setHlIdx(p => Math.min(p + 1, filtered.length - 1)); }
          else if (e.key === 'ArrowUp') { e.preventDefault(); setHlIdx(p => Math.max(p - 1, 0)); }
          else if (e.key === 'Enter') {
              e.preventDefault();
              if (hlIdx >= 0 && hlIdx < filtered.length) { onChange(filtered[hlIdx]); setIsOpen(false); setSearch(''); }
              else if (filtered.length > 0) { onChange(filtered[0]); setIsOpen(false); setSearch(''); }
          }
          else if (e.key === 'Escape') { setIsOpen(false); }
      };

      const autoStr = useMemo(() => "nope_" + Math.random().toString(36).substring(7), []);

      return (
        <div className="relative w-full" ref={wrapperRef}>
          <div tabIndex={disabled ? -1 : 0} onFocus={() => { if (!disabled && !isOpen) { setIsOpen(true); setSearch(''); setTimeout(() => { if (wrapperRef.current) wrapperRef.current.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 300); } }} onKeyDown={handleKeyDown} onClick={() => { if(!disabled && !isOpen) setIsOpen(true); }} className={`relative flex items-center w-full bg-white dark:bg-brand-bgDark border ${isOpen ? 'border-brand-teal ring-1 ring-brand-teal' : 'border-slate-200 dark:border-slate-700'} font-bold transition-all outline-none ${compact ? 'rounded-full px-4 py-2.5 text-xs shadow-sm' : 'rounded-full px-4 py-3.5 text-sm shadow-sm'} ${disabled ? 'opacity-50 cursor-not-allowed bg-slate-50 dark:bg-slate-800' : 'cursor-pointer'}`}>
             <input ref={inputRef} type="text" enterKeyHint="next" autoComplete={autoStr} autoCapitalize="none" spellCheck="false" autoCorrect="off" data-lpignore="true" data-form-type="other" role="presentation" readOnly={!isOpen || disabled} value={isOpen ? search : (value || '')} placeholder={placeholder} onChange={e => { if(isOpen && !disabled) setSearch(e.target.value); }} className={`w-full bg-transparent outline-none text-slate-900 dark:text-white ${disabled ? 'cursor-not-allowed pointer-events-none' : 'cursor-pointer'}`} /> 
             <ChevronDown c={`w-4 h-4 shrink-0 transition-transform text-slate-400 ${isOpen ? 'rotate-180 text-brand-teal' : ''}`} />
          </div>
          {isOpen && !disabled && (
            <div ref={listRef} className="absolute z-[150] w-full top-full mt-2 bg-white dark:bg-brand-cardDark border border-slate-200 dark:border-slate-700 rounded-2xl shadow-xl max-h-48 overflow-y-auto hide-scrollbar">
              {compact && <div className="sticky top-0 bg-white dark:bg-brand-cardDark border-b border-slate-100 dark:border-slate-800 p-2 z-10"><input type="text" autoComplete={autoStr} autoCapitalize="none" spellCheck="false" autoCorrect="off" data-lpignore="true" data-form-type="other" role="presentation" enterKeyHint="next" onKeyDown={handleKeyDown} value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search..." className="w-full bg-slate-50 dark:bg-brand-bgDark border border-slate-200 dark:border-slate-700 rounded-full px-3 py-2 text-xs font-semibold outline-none text-slate-900 dark:text-white" /></div>}
              {filtered.length > 0 ? filtered.map((o, i) => {
                  const isEx = (excludedList || []).includes(o);
                  return ( <div key={o} onClick={(e) => { e.stopPropagation(); onChange(o); setIsOpen(false); setSearch(''); }} className={`px-4 py-3 border-b border-slate-50 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer text-sm font-bold transition-colors flex justify-between items-center last:border-0 ${i === hlIdx ? 'bg-slate-50 dark:bg-slate-800 text-brand-teal' : (isEx ? 'text-slate-400 dark:text-slate-500' : 'text-slate-700 dark:text-slate-300')}`}><span>{o}</span> {isEx && <EyeOff c="w-3.5 h-3.5 opacity-50" />}</div> )
              }) : <div className="px-4 py-3 text-sm text-slate-400 font-medium text-center">No matches found</div>}
            </div>
          )}
        </div>
      );
    }

    function TagAutocomplete({ value, onChange, availableTags }) {
        const [isOpen, setIsOpen] = useState(false); const [hlIdx, setHlIdx] = useState(-1); const listRef = useRef(null);
        const words = String(value || '').split(','); const currentWord = words[words.length - 1].trim(); const search = currentWord.startsWith('#') ? currentWord.slice(1) : currentWord;
        const filtered = search.length > 0 ? (availableTags || []).filter(t => t.toLowerCase().includes(search.toLowerCase()) && t !== `#${search}`) : [];

        useEffect(() => { if (filtered.length > 0) setIsOpen(true); else setIsOpen(false); setHlIdx(-1); }, [currentWord, availableTags]);
        useEffect(() => { if (isOpen && hlIdx >= 0 && listRef.current) { const el = listRef.current.children[hlIdx]; if (el) el.scrollIntoView({ block: 'nearest' }); } }, [hlIdx, isOpen]);

        const handleKeyDown = (e) => {
            if (e.key === 'Enter') e.preventDefault(); 
            if (!isOpen) return;
            if (e.key === 'ArrowDown') { e.preventDefault(); setHlIdx(p => Math.min(p + 1, filtered.length - 1)); }
            else if (e.key === 'ArrowUp') { e.preventDefault(); setHlIdx(p => Math.max(p - 1, 0)); }
            else if (e.key === 'Enter') { if (hlIdx >= 0 && hlIdx < filtered.length) selectTag(filtered[hlIdx]); }
            else if (e.key === 'Escape') { setIsOpen(false); }
        };

        const selectTag = (tag) => {
            const cleanTag = tag.replace(/^#/, ''); const newWords = [...words];
            newWords[newWords.length - 1] = (newWords.length===1 ? '' : ' ') + cleanTag;
            onChange(newWords.join(',') + ', '); setIsOpen(false);
        };
        const autoStr = useMemo(() => "nope_" + Math.random().toString(36).substring(7), []);

        return (
            <div className="relative w-full">

    function SetupScreen({ onSave }) {
        const [u, setU] = useState(''); const [k, setK] = useState(''); const [loading, setLoading] = useState(false); const [errMsg, setErrMsg] = useState('');
        const handle = async (e) => {
            e.preventDefault(); if (!u.trim() || !k.trim()) return;
            setLoading(true); setErrMsg('');
            try {
                const res = await fetch(u.trim(), { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'GET_DATA', apiKey: k.trim() }) });
                const result = await res.json();
                if (result.status === 'error') throw new Error(result.message);
                onSave(u.trim(), k.trim(), result.data);
            } catch(error) { setErrMsg("Connection Failed: Incorrect URL or Secret Key."); setLoading(false); }
        };
        return (
            <div className="fixed inset-0 z-[300] flex items-center justify-center bg-brand-bgLight dark:bg-brand-bgDark p-4 transition-colors duration-300">

    function LockScreen({ correctPin, onUnlock }) {
      const [input, setInput] = useState(''); const [error, setError] = useState(false); const pinStr = String(correctPin || '');
      const handlePress = (n) => { 
          setInput(prev => { 
              if (error || prev.length >= pinStr.length) return prev; 
              const newVal = prev + n; 
              if (newVal === pinStr) setTimeout(() => onUnlock(), 150); 
              else if (newVal.length === pinStr.length) { setError(true); setTimeout(() => { setInput(''); setError(false); }, 400); } 
              return newVal; 
          }); 
      };
      const handleBackspace = () => setInput(p => error || p.length===0 ? p : p.slice(0, -1));
      useEffect(() => { const hk = (e) => { if (error) return; if(e.key>='0'&&e.key<='9') handlePress(e.key); else if(e.key==='Backspace'||e.key==='Delete') handleBackspace(); }; window.addEventListener('keydown', hk); return () => window.removeEventListener('keydown', hk); }, [error, pinStr]);
      return (
          <div className="fixed inset-0 z-[200] flex flex-col items-center justify-center bg-brand-bgLight dark:bg-brand-bgDark transition-colors duration-300">
              <div className="flex flex-col items-center mb-12 animate-slide-up"><div className="w-16 h-16 bg-brand-teal rounded-2xl flex items-center justify-center text-white mb-6 shadow-md"><LockIcon c="w-8 h-8"/></div><h2 className="text-xl font-black text-slate-800 dark:text-white mb-2">App Locked</h2><p className="text-sm font-bold text-slate-500 dark:text-slate-400">Enter your PIN to continue</p></div>
              <div className="flex gap-4 mb-12 min-h-[1.5rem]">{Array.from({ length: pinStr.length || 0 }).map((_, i) => (<div key={i} className={`w-4 h-4 rounded-full transition-all ${i < input.length ? 'bg-brand-teal scale-110' : 'bg-slate-200 dark:bg-slate-800'} ${error ? 'animate-pulse bg-brand-expense' : ''}`} />))}</div>

          </div>
      );
    }

      if(max === 0 && min === 0) max = 1000; max = max > 0 ? max * 1.1 : max; min = min < 0 ? min * 1.1 : min;
      const range = max - min;
      const getX = (i) => pad.l + (i * (gW / Math.max(plotData.length, 1))) + (gW / Math.max(plotData.length, 1))/2;

                       <text x={getX(i)} y={d.net >= 0 ? y - 6 : y + h + 12} textAnchor="middle" fill={fill} className="text-[9px] md:text-[8px] font-black blur-money">{formatCompact(d.net, isPrivacy)}</text>
                    </g>

    function DonutChart({ data = [], total, selectedCategory, onSelectCategory, isPrivacy }) {
      const activeSlice = selectedCategory !== 'All Categories' ? data.find(d => d.name === selectedCategory) : null;
      const size = 180; const radius = 75; const hole = 50; const center = size / 2; let curA = 0;
      const slices = data.map(item => {
        const a = total > 0 ? (item.value / total) * 360 : 0; const sA = curA; curA += a; const eA = curA; const sR = (sA - 90) * (Math.PI / 180); const eR = (eA - 90) * (Math.PI / 180); const lA = a > 180 ? 1 : 0;
        const x1 = center + radius * Math.cos(sR); const y1 = center + radius * Math.sin(sR); const x2 = center + radius * Math.cos(eR); const y2 = center + radius * Math.sin(eR);
        const x1_in = center + hole * Math.cos(sR); const y1_in = center + hole * Math.sin(sR); const x2_in = center + hole * Math.cos(eR); const y2_in = center + hole * Math.sin(eR);
        const d = a >= 359.9 ? ` M ${center - radius} ${center} A ${radius} ${radius} 0 1 0 ${center + radius} ${center} A ${radius} ${radius} 0 1 0 ${center - radius} ${center} M ${center - hole} ${center} A ${hole} ${hole} 0 1 1 ${center + hole} ${center} A ${hole} ${hole} 0 1 1 ${center - hole} ${center} Z ` : ` M ${x1} ${y1} A ${radius} ${radius} 0 ${lA} 1 ${x2} ${y2} L ${x2_in} ${y2_in} A ${hole} ${hole} 0 ${lA} 0 ${x1_in} ${y1_in} Z `;
        return { ...item, d };
      });
      return (
        <div className="relative w-[180px] h-[180px] shrink-0 mx-auto">
          <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
            {slices.map((s, i) => ( <path key={i} d={s.d} fill={s.color} opacity={activeSlice?(activeSlice.name===s.name?1:0.2):1} style={{ transform: activeSlice&&activeSlice.name===s.name ? 'scale(1.05)' : 'scale(1)', transformOrigin: `${center}px ${center}px`, transition: 'all 0.3s' }} className="cursor-pointer hover:opacity-80" onClick={() => onSelectCategory && onSelectCategory(selectedCategory === s.name ? 'All Categories' : s.name)} /> ))}
          </svg>
          <div className="absolute inset-0 flex flex-col items-center justify-center text-center pointer-events-none p-2">
            {activeSlice ? ( <><span className="text-[10px] font-bold uppercase tracking-widest text-slate-400 truncate max-w-[90px]">{activeSlice.name}</span><span className="text-xs font-black text-slate-800 dark:text-slate-100 mt-1 blur-money">{formatINR(activeSlice.value, isPrivacy)}</span></> ) : ( <><span className="text-[10px] font-bold uppercase tracking-widest text-slate-400">Total</span><span className="text-sm font-black text-slate-800 dark:text-slate-100 mt-1 blur-money">{formatINR(total, isPrivacy)}</span></> )}
          </div>
        </div>
      );

        <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in sm:pb-4 pb-24">

              <div className="w-14 h-14 bg-rose-50 dark:bg-rose-500/10 text-brand-expense rounded-full flex items-center justify-center mx-auto mb-4"><Trash2 c="w-7 h-7"/></div>
              <h2 className="text-lg font-black text-slate-800 dark:text-white mb-2">{title}</h2>

              <div className="flex gap-3"><button onClick={onCancel} className="flex-1 py-3 rounded-full font-bold text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">Cancel</button><button onClick={onConfirm} className="flex-1 py-3 rounded-full font-bold text-white bg-brand-expense hover:bg-rose-700 transition-colors shadow-sm">Delete</button></div>
           </div>
        </div>
      );
    }

    function MetricCard({ title, value, icon: IconComp, type, isDark }) {
        let borderClass = "border-t-slate-800 dark:border-t-slate-200";
        let bgClass = "modern-card p-4 sm:p-5 flex flex-col justify-center bg-brand-cardLight dark:bg-brand-cardDark border-t-4 ";
        let textClass = "text-slate-800 dark:text-white";
        
        if (type === 'balance') borderClass = "border-t-blue-600 dark:border-t-blue-500"; 
        else if (type === 'income') borderClass = "border-t-brand-income"; 
        else if (type === 'expense') borderClass = "border-t-brand-expense";
        else if (type === 'invested') borderClass = "border-t-[#f59e0b]"; 
        else if (type === 'savings') borderClass = "border-t-brand-transfer";
        
        return (
            <div className={`${bgClass} ${borderClass}`}>
                <div className="flex justify-between items-start mb-2"><p className="text-[10px] font-bold uppercase tracking-widest text-slate-400">{title}</p>{IconComp && <IconComp c="w-4 h-4 text-slate-300 dark:text-slate-600" />}</div>
                <p className={`text-lg sm:text-xl font-black tracking-tight blur-money ${textClass}`}>{value}</p>
            </div>
        );
    }

    function InsightsView({ analyticsFiltered = [], allUniqueCategories = [], isPrivacy, isDarkMode, chartData = [] }) {
        const [insightsCategoryFilter, setInsightsCategoryFilter] = useState('All Categories');
        
        const insightsData = useMemo(() => {
            if (insightsCategoryFilter === 'All Categories') return analyticsFiltered;
            return analyticsFiltered.filter(r => r.category === insightsCategoryFilter);
        }, [analyticsFiltered, insightsCategoryFilter]);

        const expenseTxns = useMemo(() => insightsData.filter(r => r.rawType === 'EXPENSE'), [insightsData]);
        const totalExpense = useMemo(() => expenseTxns.reduce((a, b) => a + b.amount, 0), [expenseTxns]);
        const avgExpense = useMemo(() => expenseTxns.length > 0 ? totalExpense / expenseTxns.length : 0, [expenseTxns, totalExpense]);
        const totalIncome = useMemo(() => insightsData.filter(r => r.rawType === 'INCOME').reduce((a, b) => a + b.amount, 0), [insightsData]);

        const topTags = useMemo(() => { 
            const map = {}; 
            insightsData.forEach(r => { 
                if (r.rawType !== 'EXPENSE') return; 
                extractTags(r.tags).forEach(t => { map[t] = (map[t] || 0) + r.amount; }); 
            }); 
            return Object.entries(map).map(([name, total]) => ({name, total})).sort((a,b) => b.total - a.total).slice(0, 10); 
        }, [insightsData]);

        const largestTxns = useMemo(() => {
            return [...expenseTxns].sort((a,b) => b.amount - a.amount).slice(0, 5);
        }, [expenseTxns]);

        const frequentPayees = useMemo(() => { 
            const map = {}; 
            expenseTxns.forEach(r => { 
                const desc = String(r.description || 'Unknown'); 
                if (!map[desc]) map[desc] = { name: desc, count: 0, total: 0 }; 
                map[desc].count += 1; 
                map[desc].total += r.amount; 
            }); 
            return Object.values(map).sort((a,b) => b.count - a.count).slice(0, 5); 
        }, [expenseTxns]);

        const incomeSplitData = useMemo(() => { 
            const map = {}; 
            insightsData.filter(r => r.rawType === 'INCOME').forEach(r => { 
                const cat = String(r.category || 'Uncategorized'); 
                map[cat] = (map[cat] || 0) + r.amount; 
            }); 
            const colors = ['#1d8b4e', '#e06c53', '#047857', '#059669', '#10b981']; 
            return Object.entries(map).map(([name, value], idx) => ({ name, value, color: colors[idx % colors.length] })).sort((a,b) => b.value - a.value); 
        }, [insightsData]);

        const categoryTagMatrix = useMemo(() => {
            const expenses = insightsData.filter(r => r.rawType === 'EXPENSE' && (!r.category || String(r.category).toLowerCase() !== 'investment'));
            if (!expenses.length) return null;
            const tagMap = {}; 
            expenses.forEach(r => { 
                extractTags(r.tags).forEach(t => { tagMap[t] = (tagMap[t] || 0) + r.amount; }); 
            });
            const top5Tags = Object.entries(tagMap).sort((a,b) => b[1] - a[1]).slice(0,5).map(x => x[0]);
            if (top5Tags.length === 0) return null;
            const catMap = {};
            expenses.forEach(r => {
                const c = String(r.category || 'Uncategorized');
                if (!catMap[c]) catMap[c] = { total: 0, tags: {} };
                catMap[c].total += r.amount;
                extractTags(r.tags).forEach(t => { 
                    if (top5Tags.includes(t)) {
                        catMap[c].tags[t] = (catMap[c].tags[t] || 0) + r.amount; 
                    }
                });
            });
            const sortedCats = Object.entries(catMap).sort((a,b) => b[1].total - a[1].total).slice(0,8);
            return { tags: top5Tags, cats: sortedCats };
        }, [insightsData]);

        return (
            <div className="animate-fade-in space-y-4 sm:space-y-6 max-w-4xl mx-auto pb-8">
                
                <div className="modern-card p-3 flex flex-col sm:flex-row items-center justify-between gap-3 border border-slate-200 dark:border-slate-800">
                    <span className="text-xs font-extrabold text-slate-800 dark:text-slate-200 pl-3 uppercase tracking-widest">Filter Insights</span>
                    <div className="w-full sm:w-64">
                        <SearchableSelect 
                            options={['All Categories', ...allUniqueCategories]} 
                            value={insightsCategoryFilter} 
                            onChange={(val) => setInsightsCategoryFilter(val)} 
                            placeholder="Search category..." 
                            compact={true} 
                        />
                    </div>
                </div>
                
                <div className="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4">
                    <MetricCard title="Transactions" value={isPrivacy ? '......' : insightsData.length} icon={List} type="default" />
                    <MetricCard title="Avg. Expense" value={formatINR(avgExpense, isPrivacy)} icon={Activity} type="expense" />
                    <MetricCard title="Total Income" value={formatINR(totalIncome, isPrivacy)} type="income" />
                    <MetricCard title="Net Change" value={formatINR(totalIncome - totalExpense, isPrivacy)} type="default" />
                </div>
                
                {chartData && chartData.length > 0 && (
                   <div className="modern-card p-5 sm:p-8">
                      <div className="mb-6"><h3 className="text-sm font-extrabold tracking-wide">Net Wealth Growth (Savings)</h3></div>
                      <SavingsBarChart data={chartData} isDark={isDarkMode} isPrivacy={isPrivacy} />
                   </div>
                )}

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
                    
                    <div className="modern-card p-6 sm:p-8">
                        <h3 className="text-sm font-black text-slate-800 dark:text-white flex items-center gap-2 mb-6"><TagIcon c="w-5 h-5 text-brand-teal" /> Spending by Tags</h3>
                        {topTags.length === 0 ? <p className="text-xs text-slate-500 font-medium">No tags used.</p> : (
                            <div className="space-y-5">
                                {topTags.map((tag) => { 
                                    const pct = totalExpense > 0 ? (tag.total / totalExpense) * 100 : 0; 
                                    const maxTagTotal = topTags[0]?.total || 1;
                                    return (
                                        <div key={tag.name}>
                                            <div className="flex justify-between items-center mb-1.5">
                                                <span className="text-xs font-extrabold text-brand-teal dark:text-teal-300 bg-teal-50 dark:bg-teal-900/30 border border-teal-100 dark:border-teal-800 px-2 py-0.5 rounded-md">{tag.name}</span>
                                                <div className="text-right">
                                                    <span className="text-xs font-black text-slate-900 dark:text-white blur-money">{formatINR(tag.total, isPrivacy)}</span> 
                                                    <span className="text-[10px] font-bold text-slate-400 blur-money ml-1">({isPrivacy ? '...' : pct.toFixed(1)}%)</span>
                                                </div>
                                            </div>
                                            <div className="w-full h-1.5 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
                                                <div className="h-full bg-brand-teal rounded-full" style={{width: `${(tag.total / maxTagTotal) * 100}%`}}></div>
                                            </div>
                                        </div>
                                    ) 
                                })}
                            </div>
                        )}
                    </div>
                    
                    <div className="modern-card p-6 sm:p-8">
                        <h3 className="text-sm font-black text-slate-800 dark:text-white flex items-center gap-2 mb-6"><Repeat c="w-5 h-5 text-[#f59e0b]" /> Most Frequent Payees</h3>
                        <div className="divide-y divide-slate-50 dark:divide-slate-800">
                            {frequentPayees.length === 0 ? <p className="text-xs text-slate-500 font-medium">No payees found.</p> : (
                                frequentPayees.map((t, idx) => (
                                    <div key={idx} className="py-3.5 flex justify-between items-center">
                                        <div className="min-w-0 pr-4">
                                            <p className="text-sm font-extrabold text-slate-800 dark:text-slate-100 truncate">{t.name}</p>
                                        </div>
                                        <div className="text-right shrink-0">
                                            <p className="text-xs font-black text-slate-800 dark:text-slate-200 blur-money">{isPrivacy ? '......' : `${t.count}x`}</p>
                                            <p className="text-[10px] font-bold text-slate-400 blur-money mt-0.5">{formatINR(t.total, isPrivacy)} <span className="ml-1">({isPrivacy ? '...' : ((t.total/totalExpense)*100).toFixed(1)}%)</span></p>
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>
                    
                    <div className="modern-card p-6 sm:p-8">
                        <h3 className="text-sm font-black text-slate-800 dark:text-white flex items-center gap-2 mb-6"><ArrowUpRight c="w-5 h-5 text-brand-expense"/> Largest Single Expenses</h3>
                        <div className="divide-y divide-slate-50 dark:divide-slate-800">
                            {largestTxns.length === 0 ? <p className="text-xs text-slate-500 font-medium">No expenses found.</p> : (
                                largestTxns.map((t, idx) => { 
                                    const pct = totalExpense > 0 ? (t.amount / totalExpense) * 100 : 0; 
                                    return (
                                        <div key={idx} className="py-3.5 flex justify-between items-center">
                                            <div className="min-w-0 pr-4">
                                                <p className="text-sm font-extrabold text-slate-800 dark:text-slate-100 truncate mb-1">{t.description}</p>
                                                <div className="flex items-center gap-2 text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                                                    <span>{formatDateStr(t.date)}</span>
                                                </div>
                                            </div>
                                            <div className="text-right shrink-0">
                                                <p className="text-sm font-black text-brand-expense blur-money">-{formatINR(t.amount, isPrivacy)}</p>
                                                <p className="text-[10px] font-bold text-slate-400 blur-money mt-0.5">({isPrivacy ? '...' : pct.toFixed(1)}%)</p>
                                            </div>
                                        </div>
                                    ) 
                                })
                            )}
                        </div>
                    </div>
                    
                    <div className="modern-card p-6 sm:p-8">
                        <h3 className="text-sm font-black text-slate-800 dark:text-white flex items-center gap-2 mb-6"><ArrowDownRight c="w-5 h-5 text-brand-income"/> Income Sources</h3>
                        {incomeSplitData.length === 0 ? <p className="text-xs text-slate-500 font-medium">No income found.</p> : (
                            <div className="space-y-5">
                                {incomeSplitData.map((inc) => { 
                                    const pct = totalIncome > 0 ? (inc.value / totalIncome) * 100 : 0; 
                                    return (
                                        <div key={inc.name}>
                                            <div className="flex justify-between items-center mb-1.5">
                                                <div className="flex items-center gap-2">
                                                    <div className="w-2.5 h-2.5 rounded-sm" style={{backgroundColor: inc.color}}></div>
                                                    <span className="text-xs font-bold text-slate-700 dark:text-slate-300">{inc.name}</span>
                                                </div>
                                                <div className="text-right">
                                                    <span className="text-xs font-black text-slate-900 dark:text-white blur-money">{formatINR(inc.value, isPrivacy)}</span> 
                                                    <span className="text-[10px] font-bold text-slate-400 blur-money ml-1">({isPrivacy ? '...' : pct.toFixed(1)}%)</span>
                                                </div>
                                            </div>
                                            <div className="w-full h-1.5 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
                                                <div className="h-full bg-brand-income rounded-full" style={{width: `${pct}%`, backgroundColor: inc.color}}></div>
                                            </div>
                                        </div>
                                    ) 
                                })}
                            </div>
                        )}
                    </div>
                    
                </div>

                {categoryTagMatrix && (
                   <div className="modern-card flex flex-col overflow-hidden border border-slate-200 dark:border-slate-800 mt-4 sm:mt-6">
                      <div className="p-5 border-b border-slate-100 dark:border-slate-800"><h3 className="text-sm font-extrabold tracking-wide">Top Tags by Category Matrix</h3></div>
                      <div className="w-full overflow-x-auto hide-scrollbar pb-2">
                         <table className="w-full text-left whitespace-nowrap min-w-max">
                            <thead>
                               <tr>
                                   <th className="py-4 px-5 text-[10px] font-bold text-slate-400 uppercase tracking-widest border-b border-slate-100 dark:border-slate-800">Category</th>
                                   {(categoryTagMatrix.tags||[]).map(t => <th key={t} className="py-4 px-3 text-[10px] font-bold text-slate-400 uppercase tracking-widest text-center border-b border-slate-100 dark:border-slate-800">{t}</th>)}
                               </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-50 dark:divide-slate-800/50">
                               {(categoryTagMatrix.cats||[]).map(([catName, catData]) => (
                                  <tr key={catName} className="hover:bg-slate-50/50 dark:hover:bg-slate-800/30 transition-colors">
                                     <td className="py-3 px-5 text-xs font-bold truncate max-w-[140px] sm:max-w-[200px]">{catName}</td>
                                     {(categoryTagMatrix.tags||[]).map(t => {
                                        const val = catData.tags[t] || 0;
                                        return (
                                           <td key={t} className="p-1.5 text-center">
                                              {val > 0 ? <div className="bg-brand-teal/10 text-brand-teal text-[11px] font-black py-2 px-3 rounded-xl blur-money">{formatCompact(val, isPrivacy)}</div> : <span className="text-slate-300 dark:text-slate-700">-</span>}
                                           </td>
                                        )
                                     })}
                                  </tr>
                               ))}
                            </tbody>
                         </table>
                      </div>
                   </div>
                )}
            </div>
        );
    }
