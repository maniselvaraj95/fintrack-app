  <script>
    try {
      if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        var metaDark = document.getElementById('theme-color-meta');
        if (metaDark) metaDark.setAttribute("content", "#0d1718");
      } else {
        document.documentElement.classList.remove('dark');
        var metaLight = document.getElementById('theme-color-meta');
        if (metaLight) metaLight.setAttribute("content", "#f4f7f9");
      }
    } catch (e) {}

    const MONTH_NAMES = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    const MONTH_NAMES_FULL = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    
    const parseDateLocal = (dateStr) => {
        if (!dateStr) return new Date();
        const str = String(dateStr);
        const parts = str.split('-');
        if(parts.length === 3) return new Date(parts[0], parts[1]-1, parts[2]);
        const fallback = new Date(str);
        return isNaN(fallback.getTime()) ? new Date() : fallback;
    };

    const formatDateStr = (dateStr) => {
        if (!dateStr) return '';
        const d = parseDateLocal(dateStr);
        if (isNaN(d.getTime())) return '';
        const day = String(d.getDate()).padStart(2, '0');
        const month = MONTH_NAMES[d.getMonth()];
        const year = String(d.getFullYear()).slice(-2);
        return `${day}-${month}-${year}`;
    };

    const parseAmt = (val) => {
      if (!val) return 0;
      const clean = String(val).replace(/[^\d.-]/g, '');
      const num = parseFloat(clean);
      return isNaN(num) ? 0 : num;
    };

    const formatINR = (val, isPrivacy) => {
      if (isPrivacy) return '₹ ......';
      return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(val);
    };
    
    const formatCompact = (val, isPrivacy) => {
      if (isPrivacy) return '......';
      if (!val && val !== 0) return '₹0';
      if (Math.abs(val) >= 100000) return `₹${(val / 100000).toFixed(2)}L`;
      if (Math.abs(val) >= 1000) return `₹${(val / 1000).toFixed(2)}k`;
      return `₹${Math.round(val)}`;
    };

    const extractTags = (tagString) => {
       if (!tagString) return [];
       return String(tagString).split(/[\s,;]+/).map(t => String(t).trim().toLowerCase()).filter(t => t.length > 0 && t !== '#').map(t => t.startsWith('#') ? t : `#${t}`);
    };

    function getHeatmapCellStyles(val, maxVal, isDark) {
      if (!val || val === 0 || !maxVal) return { style: { backgroundColor: isDark ? '#121e1f' : '#f8fafc' }, className: isDark ? 'text-slate-500 font-normal' : 'text-slate-400 font-normal' };
      const intensity = val / maxVal;
      if (intensity <= 0.25) return { style: { backgroundColor: isDark ? '#1a3d3e' : '#ccfbf1' }, className: isDark ? 'text-teal-200 font-bold' : 'text-teal-800 font-bold' };
      if (intensity <= 0.55) return { style: { backgroundColor: isDark ? '#115e59' : '#5eead4' }, className: isDark ? 'text-white font-extrabold' : 'text-teal-900 font-extrabold' };
      if (intensity <= 0.80) return { style: { backgroundColor: isDark ? '#0f766e' : '#14b8a6' }, className: 'text-white font-extrabold' };
      return { style: { backgroundColor: '#15806c' }, className: 'text-white font-black' };
    }

    function LockScreen({ correctPin, onUnlock }) {
      const [input, setInput] = useState('');
      const [error, setError] = useState(false);

      const handlePress = (n) => {
          setInput(prev => {
              if (error || prev.length >= correctPin.length) return prev;
              const newVal = prev + n;
              if (newVal === correctPin) {
                  setTimeout(() => onUnlock(), 150);
              } else if (newVal.length === correctPin.length) {
                  setError(true);
                  setTimeout(() => { setInput(''); setError(false); }, 400);
              }
              return newVal;
          });
      };
      
      const handleBackspace = () => {
          setInput(prev => {
              if (error || prev.length === 0) return prev;
              return prev.slice(0, -1);
          });
      };

      useEffect(() => {
          const handleKeyDown = (e) => {
              if (error) return;
              if (e.key >= '0' && e.key <= '9') {
                  handlePress(e.key);
              } else if (e.key === 'Backspace' || e.key === 'Delete') {
                  handleBackspace();
              }
          };
          window.addEventListener('keydown', handleKeyDown);
          return () => window.removeEventListener('keydown', handleKeyDown);
      }, [error, correctPin]);

      return (
          <div className="fixed inset-0 z-[200] flex flex-col items-center justify-center bg-brand-bgLight dark:bg-brand-bgDark transition-colors duration-300">
              <div className="flex flex-col items-center mb-12 animate-slide-up">

              </div>

                  {Array.from({ length: correctPin.length }).map((_, i) => (
                      <div key={i} className={`w-4 h-4 rounded-full transition-all ${i < input.length ? 'bg-brand-teal scale-110' : 'bg-slate-200 dark:bg-slate-800'} ${error ? 'animate-pulse bg-brand-expense' : ''}`} />
                  ))}
              </div>

              <div className="grid grid-cols-3 gap-4 sm:gap-6 max-w-[320px] w-full px-4">
                  {[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => (
                      <button key={n} onClick={() => handlePress(String(n))} className="w-[84px] h-[84px] sm:w-[90px] sm:h-[90px] flex items-center justify-center text-3xl font-black text-slate-800 dark:text-white bg-white dark:bg-brand-cardDark rounded-full shadow-sm border border-slate-100 dark:border-slate-800 active:scale-90 transition-transform mx-auto">
                          {n}
                      </button>
                  ))}
                  <div className="w-[84px] h-[84px] sm:w-[90px] sm:h-[90px]"></div>
                  <button onClick={() => handlePress('0')} className="w-[84px] h-[84px] sm:w-[90px] sm:h-[90px] flex items-center justify-center text-3xl font-black text-slate-800 dark:text-white bg-white dark:bg-brand-cardDark rounded-full shadow-sm border border-slate-100 dark:border-slate-800 active:scale-90 transition-transform mx-auto">
                      0
                  </button>
                  <button onClick={handleBackspace} className="w-[84px] h-[84px] sm:w-[90px] sm:h-[90px] flex items-center justify-center text-slate-500 dark:text-slate-400 bg-white dark:bg-brand-cardDark rounded-full shadow-sm border border-slate-100 dark:border-slate-800 active:scale-90 transition-transform mx-auto">
                      <DeleteIcon c="w-8 h-8"/>
                  </button>
              </div>
          </div>
      );
    }

    function SearchableSelect({ options, value, onChange, placeholder, compact = false }) {
      const [isOpen, setIsOpen] = useState(false);
      const [search, setSearch] = useState('');
      const wrapperRef = useRef(null);

      useEffect(() => {
        function handleClickOutside(event) {
          if (wrapperRef.current && !wrapperRef.current.contains(event.target)) {
             setIsOpen(false);
             setSearch('');
          }
        }
        document.addEventListener("mousedown", handleClickOutside);
        return () => document.removeEventListener("mousedown", handleClickOutside);
      }, []);

      const safeOptions = options ? options : [];
      const filtered = safeOptions.filter(o => String(o).toLowerCase().includes(String(search).toLowerCase()));

      return (
        <div className="relative" ref={wrapperRef}>
          <div 
             className={`relative flex items-center w-full bg-white dark:bg-brand-bgDark border ${isOpen ? 'border-brand-teal ring-1 ring-brand-teal' : 'border-slate-200 dark:border-slate-700'} ${compact ? 'rounded-xl px-4 py-2.5 text-xs shadow-sm cursor-pointer' : 'rounded-xl px-4 py-3.5 text-sm shadow-sm cursor-text'} font-bold transition-all`}
             onClick={() => setIsOpen(true)}
          >
             {isOpen && !compact ? (
                 <input
                    autoFocus
                    type="text"
                    value={search}
                    onChange={e => setSearch(e.target.value)}
                    placeholder="Type to search..."
                    className="w-full bg-transparent outline-none text-slate-900 dark:text-white"
                 />
             ) : (
                 <div className={`w-full flex items-center justify-between ${value ? 'text-slate-900 dark:text-white' : 'text-slate-400 dark:text-slate-500'}`}>
                    <span className="truncate pr-3">{value || placeholder}</span>
                    <ChevronDown c={`w-4 h-4 shrink-0 transition-transform ${isOpen ? 'rotate-180 text-brand-teal' : 'text-slate-400'}`} />
                 </div>
             )}

    function AreaChart({ data, width = 600, height = 240, isDark, isPrivacy }) {
      const [hoverIndex, setHoverIndex] = useState(null);
      const pad = { t: 20, r: 20, b: 30, l: 50 };
      const gW = width - pad.l - pad.r;
      const gH = height - pad.t - pad.b;
      
      let min = 0, max = 0;
      data.forEach(d => { if (d.in > max) max = d.in; if (d.out > max) max = d.out; if (d.avail > max) max = d.avail; if (d.inv > max) max = d.inv; if (d.avail < min) min = d.avail; if (d.inv < min) min = d.inv; });
      if (max === 0) max = 10000;
      const range = max - min;
      
      const getX = (i) => pad.l + (i / Math.max(data.length - 1, 1)) * gW;
      const getY = (val) => pad.t + gH - ((val - min) / range) * gH;
      const makePath = (key) => data.map((d, i) => (i === 0 ? 'M' : 'L') + ' ' + getX(i) + ' ' + getY(d[key])).join(' ');
      const makeArea = (key) => makePath(key) + ' L ' + getX(data.length - 1) + ' ' + getY(0) + ' L ' + getX(0) + ' ' + getY(0) + ' Z';

      let toolX = 0;
      if (hoverIndex !== null) {
         toolX = getX(hoverIndex);
      }

      return (
        <div className="w-full overflow-x-auto hide-scrollbar">
          <div className="flex justify-end gap-3 sm:gap-5 text-[9px] sm:text-[10px] font-extrabold tracking-widest mb-4 uppercase">
            <span className="text-slate-500 dark:text-slate-400 flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-brand-income"></span> Income</span>
            <span className="text-slate-500 dark:text-slate-400 flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-brand-expense"></span> Spend</span>
            <span className="text-slate-500 dark:text-slate-400 flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-[#f59e0b]"></span> Invested</span>
            <span className="text-slate-500 dark:text-slate-400 flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-[#0d9488]"></span> Availability</span>
          </div>
          <svg viewBox={`0 0 ${width} ${height}`} className="w-full min-w-[500px] h-auto font-sans relative">
            <defs>
              <linearGradient id="gradIN" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#10b981" stopOpacity="0.1"/><stop offset="100%" stopColor="#10b981" stopOpacity="0"/></linearGradient>
              <linearGradient id="gradOUT" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#f43f5e" stopOpacity="0.1"/><stop offset="100%" stopColor="#f43f5e" stopOpacity="0"/></linearGradient>
            </defs>
            {[0, 0.5, 1].map(pct => {
              const y = pad.t + gH * (1 - pct); const val = min + range * pct;
              return ( <g key={pct}><line x1={pad.l} y1={y} x2={width - pad.r} y2={y} stroke={isDark ? '#27272a' : '#e2e8f0'} strokeDasharray="5 5" /><text x={pad.l - 10} y={y + 4} textAnchor="end" className="text-[10px] fill-slate-400 font-bold blur-money">{formatCompact(val, isPrivacy)}</text></g> );
            })}
            
            {min < 0 && <line x1={pad.l} y1={getY(0)} x2={width - pad.r} y2={getY(0)} stroke={isDark ? '#3f3f46' : '#cbd5e1'} strokeDasharray="5 5" strokeWidth="1" />}
            
            <path d={makeArea('in')} fill="url(#gradIN)" pointerEvents="none" />
            <path d={makePath('in')} fill="none" stroke="#10b981" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" pointerEvents="none" />
            
            <path d={makeArea('out')} fill="url(#gradOUT)" pointerEvents="none" />
            <path d={makePath('out')} fill="none" stroke="#f43f5e" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" pointerEvents="none" />
            
            <path d={makePath('inv')} fill="none" stroke="#f59e0b" strokeWidth="2.5" strokeLinecap="round" pointerEvents="none" />
            
            <path d={makePath('avail')} fill="none" stroke="#0d9488" strokeWidth="2.5" strokeDasharray="6 4" strokeLinecap="round" pointerEvents="none" />
            
            {data.map((d, i) => (
              <g key={i} pointerEvents="none">
                <text x={getX(i)} y={height - 5} textAnchor="middle" className="text-[10px] fill-slate-500 font-extrabold tracking-wide">{d.label}</text>
                <circle cx={getX(i)} cy={getY(d.in)} r="5" fill={isDark ? '#121e1f' : '#fff'} stroke="#10b981" strokeWidth="2.5" />
                <circle cx={getX(i)} cy={getY(d.out)} r="5" fill={isDark ? '#121e1f' : '#fff'} stroke="#f43f5e" strokeWidth="2.5" />
                <circle cx={getX(i)} cy={getY(d.inv)} r="5" fill={isDark ? '#121e1f' : '#fff'} stroke="#f59e0b" strokeWidth="2.5" />
                <circle cx={getX(i)} cy={getY(d.avail)} r="5" fill={isDark ? '#121e1f' : '#fff'} stroke="#0d9488" strokeWidth="2.5" />
              </g>
            ))}

            {hoverIndex !== null && (
               <line x1={getX(hoverIndex)} y1={pad.t} x2={getX(hoverIndex)} y2={height - pad.b} stroke={isDark ? '#3f3f46' : '#94a3b8'} strokeWidth="1.5" strokeDasharray="4 4" pointerEvents="none" />
            )}

            {data.map((d, i) => {
               const rectWidth = gW / Math.max(data.length - 1, 1);
               return (
                 <rect key={`hit-${i}`} x={getX(i) - rectWidth/2} y={0} width={rectWidth} height={height} fill="transparent" 
                       onMouseEnter={() => setHoverIndex(i)} onMouseLeave={() => setHoverIndex(null)} onTouchStart={() => setHoverIndex(i)}
                       className="cursor-crosshair outline-none" />
               );
            })}

            {hoverIndex !== null && (() => {
               const boxX = toolX > width / 2 ? -160 : 10;
               const midX = boxX + 75;
               const leftX = boxX + 15;
               const rightX = boxX + 135;
               
               return (
                   <g transform={`translate(${toolX}, 25)`} pointerEvents="none" className="animate-fade-in z-50">
                      <rect x={boxX} y="0" width="150" height="100" rx="16" fill={isDark ? '#1a2e2f' : '#122b2c'} opacity="0.98" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.15))" />
                      <text x={midX} y="22" textAnchor="middle" fill="#ffffff" fontSize="12" fontWeight="800" tracking="wider">{data[hoverIndex].label}</text>
                      <line x1={leftX} y1="30" x2={rightX} y2="30" stroke={isDark ? '#274041' : '#1a3d3e'} strokeWidth="1" />
                      
                      <text x={leftX} y="48" fill="#94a3b8" fontSize="10" fontWeight="700">Inc:</text>
                      <text x={rightX} y="48" textAnchor="end" fill="#10b981" fontSize="11" fontWeight="900" className="blur-money">{formatCompact(data[hoverIndex].in, isPrivacy)}</text>
                      
                      <text x={leftX} y="64" fill="#94a3b8" fontSize="10" fontWeight="700">Exp:</text>
                      <text x={rightX} y="64" textAnchor="end" fill="#f43f5e" fontSize="11" fontWeight="900" className="blur-money">{formatCompact(data[hoverIndex].out, isPrivacy)}</text>
                      
                      <text x={leftX} y="80" fill="#94a3b8" fontSize="10" fontWeight="700">Inv:</text>
                      <text x={rightX} y="80" textAnchor="end" fill="#fbbf24" fontSize="11" fontWeight="900" className="blur-money">{formatCompact(data[hoverIndex].inv, isPrivacy)}</text>
                      
                      <text x={leftX} y="96" fill="#94a3b8" fontSize="10" fontWeight="700">Avail:</text>
                      <text x={rightX} y="96" textAnchor="end" fill="#0d9488" fontSize="11" fontWeight="900" className="blur-money">{formatCompact(data[hoverIndex].avail, isPrivacy)}</text>
                   </g>
               );
            })()}
          </svg>
        </div>
      );
    }

    function TopExpensesList({ data, totalExpense, isPrivacy }) {

    function DonutChart({ data, total, selectedCategory, onSelectCategory, isPrivacy }) {
      const activeSlice = selectedCategory !== 'All Categories' ? data.find(d => d.name === selectedCategory) : null;
      const size = 180; const radius = 75; const hole = 50; const center = size / 2;
      let cumulativeAngle = 0;

      const slices = data.map(item => {
        const angle = total > 0 ? (item.value / total) * 360 : 0;
        const startAngle = cumulativeAngle; cumulativeAngle += angle; const endAngle = cumulativeAngle;
        const startRad = (startAngle - 90) * (Math.PI / 180); const endRad = (endAngle - 90) * (Math.PI / 180);
        const x1 = center + radius * Math.cos(startRad); const y1 = center + radius * Math.sin(startRad);
        const x2 = center + radius * Math.cos(endRad); const y2 = center + radius * Math.sin(endRad);
        const x1_in = center + hole * Math.cos(startRad); const y1_in = center + hole * Math.sin(startRad);
        const x2_in = center + hole * Math.cos(endRad); const y2_in = center + hole * Math.sin(endRad);
        const largeArc = angle > 180 ? 1 : 0;
        const d = angle >= 359.9 ? ` M ${center - radius} ${center} A ${radius} ${radius} 0 1 0 ${center + radius} ${center} A ${radius} ${radius} 0 1 0 ${center - radius} ${center} M ${center - hole} ${center} A ${hole} ${hole} 0 1 1 ${center + hole} ${center} A ${hole} ${hole} 0 1 1 ${center - hole} ${center} Z ` : ` M ${x1} ${y1} A ${radius} ${radius} 0 ${largeArc} 1 ${x2} ${y2} L ${x2_in} ${y2_in} A ${hole} ${hole} 0 ${largeArc} 0 ${x1_in} ${y1_in} Z `;
        return { ...item, d };
      });

      return (
        <div className="relative w-[180px] h-[180px] shrink-0 mx-auto">
          <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
            {slices.map((slice, i) => {
              const isSelected = activeSlice && activeSlice.name === slice.name;
              return ( <path key={i} d={slice.d} fill={slice.color} opacity={activeSlice ? (isSelected ? 1 : 0.2) : 1} style={{ transform: isSelected ? 'scale(1.05)' : 'scale(1)', transformOrigin: `${center}px ${center}px`, transition: 'all 0.3s cubic-bezier(0.16, 1, 0.3, 1)' }} className="cursor-pointer hover:opacity-80" onClick={() => onSelectCategory && onSelectCategory(selectedCategory === slice.name ? 'All Categories' : slice.name)}> <title>{`${slice.name}: ${isPrivacy ? '......' : formatINR(slice.value, false)}`}</title> </path> );
            })}
          </svg>
          <div className="absolute inset-0 flex flex-col items-center justify-center text-center pointer-events-none p-2">
            {activeSlice ? ( <><span className="text-[10px] font-bold uppercase tracking-widest text-slate-400 truncate max-w-[90px]">{activeSlice.name}</span><span className="text-xs font-black text-slate-800 dark:text-slate-100 mt-1 blur-money">{formatINR(activeSlice.value, isPrivacy)}</span><span className="text-[11px] font-black text-brand-teal mt-0.5 blur-money">{isPrivacy ? '......' : Math.round((activeSlice.value / (total || 1)) * 100) + '%'}</span></> ) : ( <><span className="text-[10px] font-bold uppercase tracking-widest text-slate-400">Total</span><span className="text-sm font-black text-slate-800 dark:text-slate-100 mt-1 blur-money">{formatINR(total, isPrivacy)}</span></> )}
          </div>
        </div>
      );
    }

    function InsightsView({ analyticsFiltered, allUniqueCategories, isPrivacy }) {
        const [insightsCategoryFilter, setInsightsCategoryFilter] = useState('All');

        const insightsData = useMemo(() => {
            if (insightsCategoryFilter === 'All') return analyticsFiltered;
            return analyticsFiltered.filter(r => r.category === insightsCategoryFilter);
        }, [analyticsFiltered, insightsCategoryFilter]);

        const topTags = useMemo(() => {
            const map = {};
            insightsData.forEach(r => {
                if (r.rawType !== 'EXPENSE') return;
                const tags = extractTags(r.tags);
                tags.forEach(t => {
                    if (!map[t]) map[t] = 0;
                    map[t] += r.amount;
                });
            });
            return Object.entries(map).map(([name, total]) => ({name, total})).sort((a,b) => b.total - a.total).slice(0, 10);
        }, [insightsData]);

        const largestTxns = useMemo(() => {
            return [...insightsData].filter(r => r.rawType === 'EXPENSE').sort((a,b) => b.amount - a.amount).slice(0, 5);
        }, [insightsData]);

        const frequentPayees = useMemo(() => {
            const map = {};
            insightsData.filter(r => r.rawType === 'EXPENSE').forEach(r => {
                const desc = String(r.description || 'Unknown');
                if (!map[desc]) map[desc] = { name: desc, count: 0, total: 0 };
                map[desc].count += 1;
                map[desc].total += r.amount;
            });
            return Object.values(map).sort((a,b) => b.count - a.count).slice(0, 5);
        }, [insightsData]);

        const incomeSplitData = useMemo(() => {
            const map = {};
            insightsData.filter(r => r.rawType === 'INCOME').forEach(r => {
                const cat = String(r.category || 'Uncategorized');
                if (!map[cat]) map[cat] = 0; map[cat] += r.amount;
            });
            const colors = ['#1d8b4e', '#15806c', '#047857', '#059669', '#10b981'];
            return Object.entries(map).map(([name, value], idx) => ({ name, value, color: colors[idx % colors.length] })).sort((a,b) => b.value - a.value);
        }, [insightsData]);

        const expenseTxns = insightsData.filter(r => r.rawType === 'EXPENSE');
        const totalExpense = expenseTxns.reduce((a,b) => a + b.amount, 0);
        const avgExpense = expenseTxns.length > 0 ? totalExpense / expenseTxns.length : 0;
        const totalIncome = insightsData.filter(r => r.rawType === 'INCOME').reduce((a,b) => a + b.amount, 0);

        return (
            <div className="animate-fade-in space-y-4 sm:space-y-6 max-w-4xl mx-auto pb-8">
                
                <div className="modern-card p-3 flex flex-col sm:flex-row items-center justify-between gap-3 border border-slate-200 dark:border-slate-800">

                    <div className="w-full sm:w-64">
                       <SearchableSelect 
                          options={['All Categories', ...allUniqueCategories]} 
                          value={insightsCategoryFilter === 'All' ? 'All Categories' : insightsCategoryFilter} 
                          onChange={(val) => setInsightsCategoryFilter(val === 'All Categories' ? 'All' : val)} 
                          placeholder="Search category..." 
                          compact={true} 
                       />
                    </div>
                </div>

                <div className="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4">
                    <MetricCard title="Transactions" value={isPrivacy ? '......' : insightsData.length} icon={List} type="default" />
                    <MetricCard title="Avg. Expense" value={formatINR(avgExpense, isPrivacy)} icon={Activity} type="expense" />
                    <MetricCard title="Total Income" value={formatINR(totalIncome, isPrivacy)} color="text-brand-income" type="income" />
                    <MetricCard title="Net Change" value={formatINR(totalIncome - totalExpense, isPrivacy)} color={totalIncome - totalExpense >= 0 ? "text-brand-transfer" : "text-brand-expense"} type="default" />
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
                    
                    <div className="modern-card p-6 sm:p-8">
                        <h3 className="text-sm font-black text-slate-800 dark:text-white flex items-center gap-2 mb-6"><TagIcon c="w-5 h-5 text-brand-teal" /> Spending by Tags</h3>
                        {topTags.length === 0 ? <p className="text-xs text-slate-500 font-medium">No tags used.</p> : (
                            <div className="space-y-5">
                                {topTags.map((tag, idx) => {
                                    const pct = (tag.total / totalExpense) * 100;
                                    return (
                                        <div key={tag.name}>
                                            <div className="flex justify-between items-center mb-1.5">
                                                <span className="text-xs font-extrabold text-brand-teal dark:text-teal-300 bg-teal-50 dark:bg-teal-900/30 border border-teal-100 dark:border-teal-800 px-2 py-0.5 rounded-md">{tag.name}</span>
                                                <div className="text-right">
                                                   <span className="text-xs font-black text-slate-900 dark:text-white blur-money">{formatINR(tag.total, isPrivacy)}</span>
                                                   <span className="text-[10px] font-bold text-slate-400 ml-1 blur-money">({isPrivacy ? '......' : pct.toFixed(1) + '%'})</span>
                                                </div>
                                            </div>
                                            <div className="w-full h-1.5 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
                                                <div className="h-full bg-brand-teal rounded-full" style={{width: `${(tag.total / topTags[0].total) * 100}%`}}></div>
                                            </div>
                                        </div>
                                    )
                                })}
                            </div>
                        )}
                    </div>

                    <div className="modern-card p-6 sm:p-8">
                        <h3 className="text-sm font-black text-slate-800 dark:text-white flex items-center gap-2 mb-6"><Repeat c="w-5 h-5 text-[#f59e0b]" /> Most Frequent Payees</h3>
                        <div className="divide-y divide-slate-50 dark:divide-slate-800">
                            {frequentPayees.length === 0 ? <p className="text-xs text-slate-500 font-medium">No payees found.</p> : (
                                frequentPayees.map((t, idx) => {
                                    const pct = (t.total / totalExpense) * 100;
                                    return(
                                    <div key={idx} className="py-3.5 flex justify-between items-center">

                                        </div>

                        <div className="divide-y divide-slate-50 dark:divide-slate-800">

                                                <span>{formatDateStr(t.date)}</span>

                                        <div className="text-right shrink-0">
                                            <p className="text-sm font-black text-brand-expense blur-money">-{formatINR(t.amount, isPrivacy)}</p>
                                            <p className="text-[10px] font-bold text-slate-400 blur-money">({isPrivacy ? '......' : pct.toFixed(1) + '%'})</p>
                                        </div>
                                    </div>

                    <div className="modern-card p-6 sm:p-8">
                        <h3 className="text-sm font-black text-slate-800 dark:text-white flex items-center gap-2 mb-6"><ArrowDownRight c="w-5 h-5 text-brand-income"/> Income Sources</h3>
                        {incomeSplitData.length === 0 ? <p className="text-xs text-slate-500 font-medium">No income found.</p> : (
                            <div className="space-y-5">
                                {incomeSplitData.map((inc, idx) => {
                                    const pct = (inc.value / totalIncome) * 100;
                                    return (
                                        <div key={inc.name}>
                                            <div className="flex justify-between items-center mb-1.5">
                                                <div className="flex items-center gap-2">
                                                    <div className="w-2.5 h-2.5 rounded-sm" style={{backgroundColor: inc.color}}></div>
                                                    <span className="text-xs font-bold text-slate-700 dark:text-slate-300">{inc.name}</span>
                                                </div>
                                                <div className="text-right">
                                                    <span className="text-xs font-black text-slate-900 dark:text-white blur-money">{formatINR(inc.value, isPrivacy)}</span>
                                                    <span className="text-[10px] font-bold text-slate-400 ml-1 blur-money">({isPrivacy ? '......' : pct.toFixed(1) + '%'})</span>
                                                </div>
                                            </div>
                                            <div className="w-full h-1.5 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
                                                <div className="h-full bg-brand-income rounded-full" style={{width: `${pct}%`, backgroundColor: inc.color}}></div>
                                            </div>

                        )}
                    </div>

                </div>

        );
    }

    function BulkActionModal({ isOpen, action, count, onClose, onConfirm, allCategories }) {
      if (!isOpen) return null;
      const [val, setVal] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (action === 'CATEGORY' && !val) return alert("Please select a valid Category.");
        let updates = {};
        if (action === 'CATEGORY') updates.category = val;
        if (action === 'TAGS') updates.tags = val;
        if (action === 'DESC') updates.description = val;
        onConfirm(updates);
      };

      let title = "", label = "", inputEl = null;
      if (action === 'CATEGORY') {
        title = "Recategorise"; label = "Select a new category for the selected transactions:";
        inputEl = <SearchableSelect options={allCategories} value={val} onChange={setVal} placeholder="Select or search category..." />;
      } else if (action === 'TAGS') {
        title = "Overwrite Tags"; label = "Enter new tags to apply to all selected items:";
        inputEl = <input type="text" required placeholder="#vacation, #utilities" value={val} onChange={e=>setVal(e.target.value)} className="w-full bg-white dark:bg-brand-bgDark border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm font-bold focus:ring-1 focus:border-brand-teal outline-none transition-all shadow-sm dark:text-white"/>
      } else if (action === 'DESC') {
        title = "Redescribe"; label = "Enter a new description for all selected items:";
        inputEl = <input type="text" required placeholder="e.g. Swiggy..." value={val} onChange={e=>setVal(e.target.value)} className="w-full bg-white dark:bg-brand-bgDark border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm font-bold focus:ring-1 focus:border-brand-teal outline-none transition-all shadow-sm dark:text-white"/>
      }

      return (
        <div className="fixed inset-0 z-[80] flex items-end sm:items-center justify-center p-0 sm:p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">
           <div className="bg-white dark:bg-brand-cardDark rounded-t-[2rem] sm:rounded-2xl w-full max-w-sm overflow-hidden shadow-xl animate-slide-up pb-6 sm:pb-0 border border-slate-100 dark:border-slate-800">
              <div className="p-5 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-white dark:bg-brand-cardDark"><h2 className="text-base font-black text-slate-800 dark:text-white">{title}</h2><button onClick={onClose} className="p-1.5 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"><X c="w-5 h-5 text-slate-500"/></button></div>
              <form onSubmit={handleSubmit} className="p-6 bg-slate-50 dark:bg-brand-bgDark">
                 <p className="text-[11px] text-slate-500 font-bold mb-4 uppercase tracking-widest">{label}</p>
                 {inputEl}
                 <div className="mt-8 flex gap-3">
                    <button type="button" onClick={onClose} className="flex-1 py-3 rounded-xl font-bold text-slate-600 dark:text-slate-300 bg-white dark:bg-brand-cardDark border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors shadow-sm text-xs uppercase tracking-wider">Cancel</button>
                    <button type="submit" className={`flex-1 py-3 rounded-xl font-black text-white transition-colors bg-brand-teal hover:bg-brand-tealHover shadow-sm text-xs uppercase tracking-wider`}>Apply</button>
                 </div>
              </form>
           </div>
        </div>
      );
    }

    function App() {
      const [appData, setAppData] = useState({ transactions: [], settings: { incomeCats: [], expenseCats: [], accounts: [] }, balances: [], excludedCats: [], appPin: '', autoLockTime: '0' });
      const [isLoading, setIsLoading] = useState(true);
      const [isBackgroundSyncing, setIsBackgroundSyncing] = useState(false);
      const [activeTab, setActiveTab] = useState('overview'); 
      const [period, setPeriod] = useState('This Month');
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editTxn, setEditTxn] = useState(null); 
      
      const [searchQ, setSearchQ] = useState('');
      const [ledgerCategoryFilter, setLedgerCategoryFilter] = useState('All');
      const [ledgerTagFilter, setLedgerTagFilter] = useState(null); 
      const [ledgerTypeFilter, setLedgerTypeFilter] = useState('ALL'); 

      const [analyticsCategory, setAnalyticsCategory] = useState('All Categories');
      
      const [selectedRows, setSelectedRows] = useState([]);
      const [bulkModal, setBulkModal] = useState({ isOpen: false, action: null });
      const [deleteModalId, setDeleteModalId] = useState(null); 
      const [balancesExpanded, setBalancesExpanded] = useState(false);
      const [customFrom, setCustomFrom] = useState('');
      const [customTo, setCustomTo] = useState('');
      const [expandedGroups, setExpandedGroups] = useState({});
      const [isActionsMenuOpen, setIsActionsMenuOpen] = useState(false);
      
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [sortConfig, setSortConfig] = useState({ key: 'date', direction: 'desc' });
      
      const handleManualRefresh = () => {
        setIsBackgroundSyncing(true);
        apiCall('GET_DATA').then(res => {
            setAppData(res);
            try { localStorage.setItem('finTrackerCache', JSON.stringify(res)); } catch(e) {}
            setIsBackgroundSyncing(false);
        }).catch(e => {
            console.error("Refresh failed:", e);
            setTimeout(() => setIsBackgroundSyncing(false), 800);
        });
      };

      const handleSort = (key) => {
          setSortConfig(prev => ({
              key: key,
              direction: prev.key === key && prev.direction === 'desc' ? 'asc' : 'desc'
          }));
      };

      const SortIcon = ({ colKey }) => {
          if (sortConfig.key !== colKey) return <div className="w-3 h-3 opacity-0"></div>;
          return sortConfig.direction === 'asc' ? <ChevronUp c="w-3 h-3 text-brand-teal" /> : <ChevronDown c="w-3 h-3 text-brand-teal" />;
      };
      
      const [isDarkMode, setIsDarkMode] = useState(() => {
          try { return localStorage.getItem('theme') === 'dark'; } catch(e) { return false; }
      });
      
      const [isPrivacyMode, setIsPrivacyMode] = useState(() => {
          try {
              const saved = localStorage.getItem('privacyMode');
              return saved !== null ? saved === 'true' : true; 
          } catch(e) { return true; }
      });

      // AUTO LOCK TIMER LOGIC
      useEffect(() => {
          let activityTimeout;
          const resetTimeout = () => {
              if (activityTimeout) clearTimeout(activityTimeout);
              if (appData.autoLockTime && appData.autoLockTime !== '0' && isAuthenticated) {
                  const timeMs = parseInt(appData.autoLockTime) * 60000;
                  activityTimeout = setTimeout(() => {
                      setIsAuthenticated(false);
                  }, timeMs);
              }
          };
          const handleActivity = () => resetTimeout();
          const events = ['mousemove', 'keydown', 'touchstart', 'scroll', 'click'];
          events.forEach(e => window.addEventListener(e, handleActivity));
          resetTimeout();
          return () => {
              events.forEach(e => window.removeEventListener(e, handleActivity));
              if (activityTimeout) clearTimeout(activityTimeout);
          };
      }, [appData.autoLockTime, isAuthenticated]);

      useEffect(() => {
        let cached = null;
        try { cached = localStorage.getItem('finTrackerCache'); } catch(e) {}
        
        if (cached) {
          try {
             const parsedCache = JSON.parse(cached);
             setAppData({
                 transactions: parsedCache.transactions || [],
                 settings: parsedCache.settings || { incomeCats: [], expenseCats: [], accounts: [] },
                 balances: parsedCache.balances || [],
                 excludedCats: parsedCache.excludedCats || [],
                 appPin: parsedCache.appPin || '',
                 autoLockTime: parsedCache.autoLockTime || '0'
             });
             setIsLoading(false); 
             setIsBackgroundSyncing(true); 
          } catch(e) {}
        }

        apiCall('GET_DATA').then(res => {
            setAppData(res);
            try { localStorage.setItem('finTrackerCache', JSON.stringify(res)); } catch(e) {}
            setIsLoading(false);
            setIsBackgroundSyncing(false);
        }).catch(e => {
            console.error("Initial load failed:", e);
            setIsLoading(false);
            setIsBackgroundSyncing(false);
        });
      }, []);

      useEffect(() => {
        if (appData.transactions.length > 0 || (appData.settings && appData.settings.accounts && appData.settings.accounts.length > 0)) {
           try { localStorage.setItem('finTrackerCache', JSON.stringify(appData)); } catch(e) {}
        }
      }, [appData]);

      useEffect(() => {
         const metaThemeColor = document.getElementById("theme-color-meta");
         if (isDarkMode) {
             document.documentElement.classList.add('dark');
             try { localStorage.setItem('theme', 'dark'); } catch(e) {}
             if (metaThemeColor) metaThemeColor.setAttribute("content", "#0d1718");
         } else {
             document.documentElement.classList.remove('dark');
             try { localStorage.setItem('theme', 'light'); } catch(e) {}
             if (metaThemeColor) metaThemeColor.setAttribute("content", "#f4f7f9");
         }
      }, [isDarkMode]);

      useEffect(() => {
         if (isPrivacyMode) {
             document.body.classList.add('privacy-active');
             try { localStorage.setItem('privacyMode', 'true'); } catch(e) {}
         } else {
             document.body.classList.remove('privacy-active');
             try { localStorage.setItem('privacyMode', 'false'); } catch(e) {}
         }
      }, [isPrivacyMode]);

      const parsedData = useMemo(() => {
        return appData.transactions.map((r, i) => {
          const amt = parseAmt(r.amount); const d = new Date(r.date); const monthIdx = isNaN(d.getMonth()) ? -1 : d.getMonth();
          return { ...r, id: i, amount: amt, monthIdx, year: isNaN(d.getFullYear()) ? -1 : d.getFullYear(), rawType: (r.type || '').toUpperCase() };
        }).filter(r => r.amount > 0 && r.year !== -1).sort((a,b) => new Date(b.date) - new Date(a.date));
      }, [appData.transactions]);

      const activeData = useMemo(() => {
         const excluded = appData.excludedCats || [];
         return parsedData.filter(t => !excluded.includes(t.category));
      }, [parsedData, appData.excludedCats]);

      const allAvailableTags = useMemo(() => {
         const tagsSet = new Set();
         parsedData.forEach(t => {
            extractTags(t.tags).forEach(tag => tagsSet.add(tag));
         });
         return Array.from(tagsSet).sort();
      }, [parsedData]);

      const allUniqueCategories = useMemo(() => Array.from(new Set(parsedData.map(d => d.category))).filter(Boolean).sort(), [parsedData]);

      const latestInfo = useMemo(() => {
        if (!activeData.length) return { year: new Date().getFullYear(), monthIdx: new Date().getMonth() };
        return { year: activeData[0].year, monthIdx: activeData[0].monthIdx };
      }, [activeData]);

      const monthlyAggsForAllTime = useMemo(() => {
          const aggs = {};
          activeData.forEach(r => {
             const k = `${r.year}-${String(r.monthIdx).padStart(2,'0')}`;
             if (!aggs[k]) aggs[k] = { year: r.year, monthIdx: r.monthIdx, label: MONTH_NAMES[r.monthIdx], in: 0, out: 0, inv: 0 };
             
             if (r.rawType === 'INCOME') aggs[k].in += r.amount;
             else if (r.category && String(r.category).toLowerCase() === 'investment') aggs[k].inv += r.amount;
             else if (r.rawType === 'EXPENSE') aggs[k].out += r.amount;
          });

          const sortedKeys = Object.keys(aggs).sort();
          let runningBalance = 0; 

          const completeAggs = sortedKeys.map(k => {
             const monthData = aggs[k];
             const avail = runningBalance + monthData.in;
             runningBalance += (monthData.in - monthData.out - monthData.inv); 
             return { ...monthData, avail, key: k };
          });
          return completeAggs;
      }, [activeData]);

      const analyticsFiltered = useMemo(() => {
        let f = activeData; const { year, monthIdx } = latestInfo;
        f = f.filter(r => {
          const d = parseDateLocal(r.date);
          if (period === 'This Month') return r.year === year && r.monthIdx === monthIdx;
          if (period === 'Last Month') {
            const m = monthIdx === 0 ? 11 : monthIdx - 1; const y = monthIdx === 0 ? year - 1 : year;
            return r.year === y && r.monthIdx === m;
          }
          if (period === '3M') {
             const start = new Date(year, monthIdx - 2, 1);
             return d >= start && d <= new Date(year, monthIdx + 1, 0);
          }
          if (period === '6M') {
             const start = new Date(year, monthIdx - 5, 1);
             return d >= start && d <= new Date(year, monthIdx + 1, 0);
          }
          if (period === 'YTD') return r.year === year && r.monthIdx <= monthIdx;
          if (period === '12M') {
             const start = new Date(year, monthIdx - 11, 1);
             return d >= start && d <= new Date(year, monthIdx + 1, 0);
          }
          if (period === 'Custom') {
             if (customFrom && d < new Date(customFrom.substring(0,7)+"-01")) return false;
             if (customTo && d > new Date(customTo.substring(0,7)+"-31")) return false;
             return true;
          }
          return true; 
        });
        return f;
      }, [activeData, period, latestInfo, customFrom, customTo]);

      const ledgerFiltered = useMemo(() => {
        let f = parsedData; 
        
        if (ledgerTypeFilter !== 'ALL') {
            f = f.filter(r => r.rawType === ledgerTypeFilter);
        }
        if (ledgerCategoryFilter !== 'All') {
            f = f.filter(r => r.category === ledgerCategoryFilter);
        }
        if (ledgerTagFilter) {
            f = f.filter(r => extractTags(r.tags).includes(ledgerTagFilter));
        }
        if (searchQ) {
          const q = searchQ.toLowerCase();
          f = f.filter(r => `${String(r.description || '')} ${String(r.category || '')} ${String(r.tags || '')} ${String(r.notes || '')} ${String(r.account || '')} ${String(r.transfer_to || '')}`.toLowerCase().includes(q));
        }
        return f;
      }, [parsedData, searchQ, ledgerCategoryFilter, ledgerTagFilter, ledgerTypeFilter]);

      const selectedSum = useMemo(() => {
        return ledgerFiltered.filter(t => selectedRows.includes(t.row_index)).reduce((sum, t) => sum + (t.rawType === 'INCOME' ? t.amount : -t.amount), 0);
      }, [selectedRows, ledgerFiltered]);

      const groupedLedger = useMemo(() => {
          const groups = {};
          const now = new Date();
          const currentMonthKey = now.getFullYear() * 100 + now.getMonth();

          ledgerFiltered.forEach(t => {
            const d = parseDateLocal(t.date);
            const isInvalid = isNaN(d.getTime());
            const mName = isInvalid ? 'Unknown' : MONTH_NAMES_FULL[d.getMonth()];
            const y = isInvalid ? '' : d.getFullYear();
            const label = isInvalid ? 'Unknown' : `${mName} ${y}`;
            const sortKey = isInvalid ? 0 : y * 100 + d.getMonth();
            
            if (!groups[label]) {
              groups[label] = { label, sortKey, isCurrentMonth: sortKey === currentMonthKey, entries: [], count: 0, spent: 0, invested: 0 };
            }
            
            groups[label].entries.push(t);
            groups[label].count++;
            
            if (t.rawType === 'EXPENSE') {
              if (t.category && String(t.category).toLowerCase() === 'investment') {
                groups[label].invested += t.amount;
              } else {
                groups[label].spent += t.amount;
              }
            }
          });
          
          let groupsArray = Object.values(groups).sort((a, b) => b.sortKey - a.sortKey);
          
          groupsArray.forEach(g => {
              g.entries.sort((a, b) => {
                  let valA = a[sortConfig.key];
                  let valB = b[sortConfig.key];
                  
                  if (sortConfig.key === 'amount') {
                      valA = parseFloat(valA) || 0;
                      valB = parseFloat(valB) || 0;
                  } else if (sortConfig.key === 'date') {
                      valA = new Date(valA).getTime();
                      valB = new Date(valB).getTime();
                  } else {
                      valA = String(valA || '').toLowerCase();
                      valB = String(valB || '').toLowerCase();
                  }
                  
                  if (valA < valB) return sortConfig.direction === 'asc' ? -1 : 1;
                  if (valA > valB) return sortConfig.direction === 'asc' ? 1 : -1;
                  return 0;
              });
          });
          
          return groupsArray;
      }, [ledgerFiltered, sortConfig]);

      useEffect(() => {
          if (groupedLedger.length > 0 && Object.keys(expandedGroups).length === 0) {
              setExpandedGroups({ [groupedLedger[0].label]: true });
          }
      }, [groupedLedger]);

      const toggleGroup = (label) => {
          setExpandedGroups(prev => ({...prev, [label]: !prev[label]}));
      };

      const mIN = analyticsFiltered.filter(r => r.rawType === 'INCOME').reduce((a,b) => a + b.amount, 0);
      const mINV = analyticsFiltered.filter(r => r.category && String(r.category).toLowerCase() === 'investment').reduce((a,b) => a + b.amount, 0);
      const mOUT = analyticsFiltered.filter(r => r.rawType === 'EXPENSE' && (!r.category || String(r.category).toLowerCase() !== 'investment')).reduce((a,b) => a + b.amount, 0);
      const savRate = mIN > 0 ? (((mIN - mOUT) / mIN) * 100).toFixed(1) : 0;

      const accountBalances = useMemo(() => {
        const bals = {};
        let globalStartDate = new Date('1970-01-01');
        const safeBalances = appData.balances || [];
        if (safeBalances.length > 0 && safeBalances[0] && safeBalances[0].date) {
             globalStartDate = parseDateLocal(safeBalances[0].date);
        }

        const safeAccounts = (appData && appData.settings && appData.settings.accounts) ? appData.settings.accounts : [];
        safeAccounts.forEach(acc => {
          const conf = safeBalances.find(b => b.account === acc);
          bals[acc] = { current: conf ? parseFloat(conf.balance) : 0, startDate: globalStartDate };
        });

        activeData.forEach(t => {
          const tDate = parseDateLocal(t.date);
          if (t.rawType === 'INCOME' && bals[t.account] && tDate >= bals[t.account].startDate) {
            bals[t.account].current += t.amount;
          } else if (t.rawType === 'EXPENSE' && bals[t.account] && tDate >= bals[t.account].startDate) {
            bals[t.account].current -= t.amount;
          } else if (t.rawType === 'TRANSFER') {
            if (bals[t.account] && tDate >= bals[t.account].startDate) bals[t.account].current -= t.amount;
            if (bals[t.transfer_to] && tDate >= bals[t.transfer_to].startDate) bals[t.transfer_to].current += t.amount;
          }
        });
        return bals;
      }, [activeData, appData.balances, appData.settings]);

      const totalBalance = Object.values(accountBalances).reduce((sum, acc) => sum + acc.current, 0);

      const chartData = useMemo(() => {
        const { year, monthIdx } = latestInfo;
        return monthlyAggsForAllTime.filter(r => {
          const d = new Date(r.year, r.monthIdx, 1);
          if (period === 'This Month') return r.year === year && r.monthIdx === monthIdx;
          if (period === 'Last Month') {
            const m = monthIdx === 0 ? 11 : monthIdx - 1; const y = monthIdx === 0 ? year - 1 : year;
            return r.year === y && r.monthIdx === m;
          }
          if (period === '3M') return d >= new Date(year, monthIdx - 2, 1) && d <= new Date(year, monthIdx + 1, 0);
          if (period === '6M') return d >= new Date(year, monthIdx - 5, 1) && d <= new Date(year, monthIdx + 1, 0);
          if (period === 'YTD') return r.year === year && r.monthIdx <= monthIdx;
          if (period === '12M') return d >= new Date(year, monthIdx - 11, 1) && d <= new Date(year, monthIdx + 1, 0);
          if (period === 'Custom') {
             if (customFrom && d < new Date(customFrom.substring(0,7)+"-01")) return false;
             if (customTo && d > new Date(customTo.substring(0,7)+"-31")) return false;
             return true;
          }
          return true; 
        });
      }, [monthlyAggsForAllTime, period, latestInfo, customFrom, customTo]);

      const topMerchants = useMemo(() => {
        const map = {};
        analyticsFiltered.filter(r => r.rawType === 'EXPENSE' && (!r.category || String(r.category).toLowerCase() !== 'investment')).forEach(r => {
          const desc = String(r.description || 'Unknown');
          if (!map[desc]) map[desc] = { name: desc, cat: r.category, total: 0 }; 
          map[desc].total += r.amount;
        });
        return Object.values(map).sort((a,b) => b.total - a.total).slice(0, 8);
      }, [analyticsFiltered]);

      const categorySplitData = useMemo(() => {
        const map = {};
        analyticsFiltered.filter(r => r.rawType === 'EXPENSE' && (!r.category || String(r.category).toLowerCase() !== 'investment')).forEach(r => { 
            const cat = String(r.category || 'Uncategorized'); if (!map[cat]) map[cat] = 0; map[cat] += r.amount; 
        });
        const colors = ['#15806c', '#cb5a42', '#1d8b4e', '#f59e0b', '#2563eb', '#ec4899', '#8b5cf6', '#14b8a6'];

                                  <thead>
                                     <tr>
                                        <th className="py-4 px-5 text-[10px] font-bold text-slate-400 uppercase tracking-widest text-left border-b border-slate-100 dark:border-slate-800">Category</th>
                                        {heatmapData.monthCols.map(m => (<th key={m.key} className="py-4 px-3 text-[10px] font-bold text-slate-400 uppercase tracking-widest text-center border-b border-slate-100 dark:border-slate-800">{m.label}</th>))}
                                     </tr>
                                  </thead>
                                  <tbody className="divide-y divide-slate-50 dark:divide-slate-800/50">
                                     {heatmapData.topCategories.map(cat => (
                                         <tr key={cat} className="hover:bg-slate-50/50 dark:hover:bg-slate-800/30 transition-colors">
                                            <td className="py-3 px-5 text-xs font-bold text-slate-700 dark:text-slate-300 truncate max-w-[140px] sm:max-w-[200px]">{cat}</td>
                                            {heatmapData.monthCols.map(m => {
                                                const val = heatmapData.matrix[cat]?.[m.key] || 0; const styles = getHeatmapCellStyles(val, heatmapData.maxVal, isDarkMode);
                                                return ( 
                                                    <td key={m.key} className="p-1.5 text-center">
                                                        <div className={`w-full py-2.5 px-2 min-w-[4.5rem] rounded-xl text-[11px] transition-all flex items-center justify-center blur-money ${styles.className}`} style={styles.style} title={val > 0 && !isPrivacyMode ? formatINR(val) : ''}>
                                                            {val > 0 ? formatCompact(val, isPrivacyMode) : <span className="text-slate-300 dark:text-slate-700 font-normal">-</span>}
                                                        </div>
                                                    </td> 
                                                )
                                            })}
                                         </tr>
                                     ))}
                                  </tbody>
                              </table>
                          )}
                      </div>
                   </div>
                </div>
              )}

              {activeTab === 'ledger' && (
                <div className="animate-fade-in space-y-4">
                  
                  <div className="flex items-center gap-2 overflow-x-auto hide-scrollbar pb-1">
                      {['ALL', 'EXPENSE', 'INCOME', 'TRANSFER'].map(tab => (
                          <button 
                            key={tab} 
                            onClick={() => setLedgerTypeFilter(tab)}
                            className={`px-5 py-2 rounded-xl text-xs font-black uppercase tracking-widest whitespace-nowrap transition-colors border shadow-sm ${ledgerTypeFilter === tab ? 'bg-brand-sidebar text-white border-brand-sidebar' : 'bg-white dark:bg-brand-cardDark text-slate-600 dark:text-slate-400 border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800'}`}
                          >
                            {tab}
                          </button>
                      ))}
                  </div>

                  <div className="modern-card p-3 flex flex-col sm:flex-row items-center justify-between gap-3 border border-slate-200 dark:border-slate-800">
                    <div className="relative w-full flex items-center bg-brand-bgLight dark:bg-brand-bgDark rounded-xl px-3 flex-1 border border-slate-100 dark:border-slate-800">
                      <SearchIcon c="w-5 h-5 text-slate-400 shrink-0" />
                      <input type="text" placeholder="Search transactions..." value={searchQ} onChange={e => setSearchQ(e.target.value)} 
                        className="w-full bg-transparent border-none outline-none py-3 pl-3 text-sm font-bold text-slate-800 dark:text-white placeholder-slate-400" />
                    </div>
                    <div className="w-full sm:w-64 shrink-0 z-20">
                       <SearchableSelect 
                          options={['All Categories', ...allUniqueCategories]} 
                          value={ledgerCategoryFilter === 'All' ? 'All Categories' : ledgerCategoryFilter} 
                          onChange={(val) => setLedgerCategoryFilter(val === 'All Categories' ? 'All' : val)} 
                          placeholder="Filter Category..." 
                          compact={true} 
                       />
                    </div>
                  </div>

                  <div className="flex flex-wrap items-center gap-2 pb-1 px-1">
                     <button onClick={() => setLedgerTagFilter(null)} className={`px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-colors border shadow-sm ${!ledgerTagFilter ? 'bg-slate-800 dark:bg-slate-700 text-white border-slate-800 dark:border-slate-700' : 'bg-white dark:bg-brand-cardDark text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800'}`}>All Tags</button>
                     {allAvailableTags.map(tag => (
                         <button key={tag} onClick={() => setLedgerTagFilter(tag === ledgerTagFilter ? null : tag)} className={`px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-colors border shadow-sm ${tag === ledgerTagFilter ? 'bg-brand-teal text-white border-brand-teal' : 'bg-white dark:bg-brand-cardDark text-brand-teal border-brand-teal/30 hover:bg-brand-teal/10'}`}>{tag}</button>
                     ))}
                  </div>

                  {ledgerFiltered.length > 0 && (
                    <div className="bg-brand-teal/10 border border-brand-teal/30 px-5 py-3 rounded-2xl flex items-center justify-between shadow-sm animate-fade-in">
                       <div className="flex items-center gap-3">
                         <input type="checkbox" checked={selectedRows.length > 0 && selectedRows.length === ledgerFiltered.length} onChange={handleSelectAll} className="custom-check shrink-0 border-brand-teal/50 dark:border-brand-teal/30" />
                         <span className="text-[11px] font-bold text-brand-teal uppercase tracking-widest">Select All ({ledgerFiltered.length})</span>
                       </div>
                       {selectedRows.length > 0 && <span className="text-[11px] font-black text-brand-teal bg-white dark:bg-brand-cardDark px-2.5 py-1 rounded-lg shadow-sm">{selectedRows.length} selected</span>}
                    </div>
                  )}

                  {/* DESKTOP GLOBAL HEADER FOR SORTING */}
                  {groupedLedger.length > 0 && (
                    <div className="hidden lg:grid grid-cols-[2.5rem_6rem_12rem_8rem_1fr_10rem_5rem] gap-4 px-6 py-3 mt-6 items-center text-[10px] font-extrabold text-slate-400 dark:text-slate-500 uppercase tracking-widest border-b border-slate-200 dark:border-slate-800">
                       <div className="shrink-0"></div>
                       <div className="shrink-0 cursor-pointer hover:text-brand-teal transition-colors flex items-center gap-1 select-none" onClick={() => handleSort('date')}>Date <SortIcon colKey="date"/></div>
                       <div className="shrink-0 cursor-pointer hover:text-brand-teal transition-colors flex items-center gap-1 select-none" onClick={() => handleSort('category')}>Category <SortIcon colKey="category"/></div>
                       <div className="shrink-0 cursor-pointer hover:text-brand-teal transition-colors flex items-center justify-end gap-1 select-none" onClick={() => handleSort('amount')}><SortIcon colKey="amount"/> Amount</div>
                       <div className="min-w-0 px-4 cursor-pointer hover:text-brand-teal transition-colors flex items-center gap-1 select-none" onClick={() => handleSort('description')}>Description <SortIcon colKey="description"/></div>
                       <div className="shrink-0 cursor-pointer hover:text-brand-teal transition-colors flex items-center gap-1 select-none" onClick={() => handleSort('account')}>Account <SortIcon colKey="account"/></div>
                       <div className="shrink-0 text-center"></div>
                    </div>
                  )}

                  {groupedLedger.length === 0 ? <div className="modern-card p-12 text-center text-slate-400 font-bold text-sm mt-4 border border-slate-200 dark:border-slate-800">No transactions found.</div> : (
                    <div className="space-y-4 pb-12">
                      {groupedLedger.map(g => {
                         const isExpanded = !!expandedGroups[g.label];
                         return (
                           <div key={g.label} className="modern-card overflow-hidden border border-slate-200 dark:border-slate-800 shadow-sm">
                              
                              <div className="flex flex-col sm:flex-row sm:items-center justify-between bg-white dark:bg-brand-cardDark px-4 py-4 sm:px-6 sm:py-5 cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors gap-3 sm:gap-4 border-b border-slate-100 dark:border-slate-800 last:border-0" onClick={() => toggleGroup(g.label)}>
                                 <div className="flex items-center gap-3 min-w-0">
                                     <ChevronDown c={`w-5 h-5 text-slate-400 transition-transform shrink-0 ${isExpanded ? 'rotate-180' : ''}`} />
                                     <span className="font-extrabold text-slate-800 dark:text-white text-base sm:text-lg tracking-tight truncate">{g.label}</span>
                                     {g.isCurrentMonth && <span className="bg-brand-teal/20 text-brand-teal text-[10px] font-black px-2 py-1 rounded-lg uppercase tracking-wider shrink-0 hidden sm:inline-block">This Month</span>}
                                 </div>
                                 <div className="flex items-center gap-3 shrink-0 pl-8 sm:pl-0">
                                     <div className="flex items-center text-[11px] sm:text-xs font-bold text-slate-500 dark:text-slate-400 bg-brand-bgLight dark:bg-brand-bgDark px-3 py-1.5 rounded-xl whitespace-nowrap shadow-sm border border-slate-100 dark:border-slate-800">
                                         {g.count} entries <span className="mx-2 text-slate-300 dark:text-slate-600">|</span> <span className="text-slate-800 dark:text-slate-200 font-black blur-money">-{formatCompact(g.spent, isPrivacyMode)}</span>
                                     </div>
                                     {g.invested > 0 && <span className="flex items-center text-[11px] sm:text-xs font-bold text-amber-600 dark:text-amber-500 bg-amber-50 dark:bg-amber-500/10 px-3 py-1.5 rounded-xl whitespace-nowrap blur-money">+Inv {formatCompact(g.invested, isPrivacyMode)}</span>}
                                 </div>
                              </div>
                              
                              {isExpanded && (
                                 <div className="divide-y divide-slate-100 dark:divide-slate-800/50 bg-white dark:bg-brand-cardDark">
                                   {g.entries.map(t => {
                                      const isExcluded = (appData.excludedCats || []).includes(t.category);
                                      const isIN = t.rawType === 'INCOME'; const isTRF = t.rawType === 'TRANSFER';
                                      const IconComp = isIN ? ArrowDownRight : isTRF ? Repeat : ArrowUpRight;
                                      
                                      const colorClass = isIN 
                                          ? 'text-brand-income bg-emerald-50 dark:bg-emerald-500/10 border-emerald-100 dark:border-emerald-500/20' 
                                          : isTRF ? 'text-slate-500 bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700' 
                                          : 'text-brand-expense bg-rose-50 dark:bg-rose-500/10 border-rose-100 dark:border-rose-500/20';
                                          
                                      const badgeClass = isIN 
                                          ? 'text-brand-income bg-emerald-50 dark:bg-emerald-500/10 border border-emerald-100 dark:border-emerald-500/20' 
                                          : isTRF ? 'text-brand-transfer bg-blue-50 dark:bg-blue-900/20 border border-blue-100 dark:border-blue-800/30' 
                                          : 'text-brand-expense bg-rose-50 dark:bg-rose-500/10 border border-rose-100 dark:border-rose-500/20';
                                          
                                      const amtColor = isIN ? 'text-brand-income' : isTRF ? 'text-slate-600 dark:text-slate-400' : 'text-slate-900 dark:text-white';
                                      const sign = isIN ? '+' : isTRF ? '' : '-';
                                      
                                      const txTags = extractTags(t.tags);

                                      return (
                                        <div key={t.id} className={`group ${isExcluded ? 'opacity-40 grayscale' : ''}`}>
                                           
                                           {/* MOBILE ROW */}
                                           <div className="flex lg:hidden px-4 py-3 sm:px-6 sm:py-4 items-center gap-3 sm:gap-4 hover:bg-slate-50 dark:hover:bg-slate-800/30 transition-colors">
                                              <input type="checkbox" checked={selectedRows.includes(t.row_index)} onChange={() => handleSelectRow(t.row_index)} className="custom-check shrink-0" />
                                              
                                              <div className={`hidden sm:flex w-[40px] h-[40px] rounded-xl items-center justify-center shrink-0 shadow-sm border ${colorClass}`}>
                                                 <IconComp c="w-5 h-5"/>
                                              </div>
                                              
                                              <div className="flex-1 min-w-0 flex flex-col justify-center">
                                                 <div className="flex justify-between items-start sm:mb-1">
                                                    <p className={`text-sm sm:text-base font-extrabold text-slate-800 dark:text-slate-100 truncate pr-2 ${isExcluded ? 'line-through text-slate-400' : ''}`}>{t.description}</p>
                                                 </div>
                                                 {t.notes && <p className="text-[10px] text-slate-500 dark:text-slate-400 font-medium truncate mt-0.5 pr-2">{t.notes}</p>}
                                                 
                                                 <div className="flex items-center gap-2 min-w-0 text-[10px] sm:text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wide mt-1.5">
                                                    <span className="shrink-0 text-slate-500 dark:text-slate-400">{formatDateStr(t.date)}</span>
                                                    <span className="w-1 h-1 rounded-full bg-slate-300 dark:bg-slate-600 shrink-0"></span>
                                                    <span className="truncate text-slate-500 dark:text-slate-400">{isTRF ? `${t.account} ➔ ${t.transfer_to}` : t.account}</span>
                                                    {t.category && <span className={`sm:hidden px-2 py-0.5 rounded-md ml-1 truncate max-w-[80px] ${badgeClass}`}>{t.category}</span>}
                                                 </div>
                                              </div>
                                              
                                              <div className="flex flex-col items-end shrink-0 gap-1.5">
                                                 <p className={`text-base font-black blur-money ${amtColor} shrink-0`}>{sign}{formatINR(t.amount, isPrivacyMode)}</p>
                                                 <div className="flex items-center gap-1">
                                                     <button onClick={() => handleOpenEditTxn(t)} className="p-1.5 text-slate-400 hover:text-brand-teal bg-slate-100 dark:bg-slate-800 rounded-lg transition-colors"><EditPencil c="w-3.5 h-3.5" /></button>
                                                     <button onClick={() => setDeleteModalId(t.row_index)} className="p-1.5 text-slate-400 hover:text-brand-expense bg-slate-100 dark:bg-slate-800 rounded-lg transition-colors"><Trash2 c="w-3.5 h-3.5" /></button>
                                                 </div>
                                              </div>
                                           </div>
                                           
                                           {/* DESKTOP ROW */}
                                           <div className="hidden lg:grid grid-cols-[2.5rem_6rem_12rem_8rem_1fr_10rem_5rem] gap-4 px-6 py-4 items-center hover:bg-slate-50 dark:hover:bg-slate-800/30 transition-colors">
                                              <div className="flex items-center justify-center"><input type="checkbox" checked={selectedRows.includes(t.row_index)} onChange={() => handleSelectRow(t.row_index)} className="custom-check shrink-0" /></div>
                                              <div className="text-xs font-bold text-slate-500 dark:text-slate-400">{formatDateStr(t.date)}</div>
                                              <div className="flex flex-col items-start justify-center min-w-0 pr-2">
                                                  {t.category && <span className={`text-[10px] font-bold px-2 py-1 rounded-lg truncate max-w-full ${badgeClass}`}>{t.category}</span>}
                                              </div>
                                              <div className={`text-right text-sm font-black blur-money ${amtColor}`}>{sign}{formatINR(t.amount, isPrivacyMode)}</div>
                                              <div className="flex flex-col min-w-0 px-4">
                                                  <span className="text-sm font-extrabold text-slate-800 dark:text-slate-100 truncate">{t.description}</span>
                                                  {t.notes && <span className="text-[10px] text-slate-500 dark:text-slate-400 font-medium truncate mt-0.5">{t.notes}</span>}
                                                  {txTags.length > 0 && <span className="text-[10px] text-brand-teal font-bold truncate mt-0.5">{txTags.join(' ')}</span>}
                                              </div>
                                              <div className="text-xs font-bold text-slate-600 dark:text-slate-400 truncate flex items-center gap-1.5">
                                                  {isTRF ? <Repeat c="w-3 h-3 text-slate-400 shrink-0"/> : <Wallet c="w-3 h-3 text-slate-400 shrink-0"/>}
                                                  <span className="truncate">{isTRF ? `${t.account} ➔ ${t.transfer_to}` : t.account}</span>
                                              </div>
                                              <div className="flex items-center justify-end gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                                  <button onClick={() => handleOpenEditTxn(t)} className="p-1.5 text-slate-400 hover:text-brand-teal bg-white dark:bg-brand-bgDark border border-slate-200 dark:border-slate-700 shadow-sm hover:bg-slate-50 dark:hover:bg-slate-800 rounded-lg transition-all"><EditPencil c="w-3.5 h-3.5" /></button>
                                                  <button onClick={() => setDeleteModalId(t.row_index)} className="p-1.5 text-slate-400 hover:text-brand-expense bg-white dark:bg-brand-bgDark border border-slate-200 dark:border-slate-700 shadow-sm hover:bg-rose-50 dark:hover:bg-rose-500/10 rounded-lg transition-all"><Trash2 c="w-3.5 h-3.5" /></button>
                                              </div>
                                           </div>
                                           
                                        </div>
                                      );
                                   })}
                                 </div>
                              )}
                           </div>
                         );
                      })}
                    </div>
                  )}
                </div>
              )}

              {activeTab === 'settings' && <SettingsView appData={appData} onSave={setAppData} appPin={appData.appPin} autoLockTime={appData.autoLockTime} />}

            </div>
          </main>

          {/* REDESIGNED FLOATING BULK ACTION BAR */}
          {selectedRows.length > 0 && activeTab === 'ledger' && (
             <div className="fixed bottom-[88px] md:bottom-8 left-4 right-4 md:left-1/2 md:right-auto md:-translate-x-1/2 z-50 animate-slide-up max-w-full md:max-w-max mx-auto">
                <div className="bg-white dark:bg-brand-sidebar shadow-[0_8px_30px_rgba(0,0,0,0.2)] dark:shadow-[0_20px_40px_rgba(0,0,0,0.5)] rounded-2xl border border-slate-200 dark:border-slate-700/50 flex flex-row items-center p-2 relative">
                   <div className="flex items-center gap-3 px-3 py-1.5 md:py-2 border-r border-slate-200 dark:border-slate-700/50">
                      <span className="text-xs font-bold text-slate-700 dark:text-slate-300 whitespace-nowrap">{selectedRows.length} selected</span>
                      <span className="text-slate-900 dark:text-white font-black text-sm blur-money">{formatINR(Math.abs(selectedSum), isPrivacyMode)}</span>
                   </div>
                   
                   {/* Mobile View */}
                   <div className="flex md:hidden items-center gap-1 pl-2">
                       <button onClick={() => setIsActionsMenuOpen(!isActionsMenuOpen)} className="px-3 py-2 text-xs font-bold text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg flex items-center gap-1.5">
                           <span className="text-[10px]">•••</span> Actions
                       </button>
                       <button onClick={() => setBulkModal({isOpen: true, action: 'DELETE'})} className="p-2 text-brand-expense hover:bg-rose-50 dark:hover:bg-rose-500/10 rounded-lg"><Trash2 c="w-4 h-4"/></button>
                   </div>

                   {/* Desktop View */}
                   <div className="hidden md:flex items-center gap-1 pl-2 pr-2">
                      <button onClick={() => setBulkModal({isOpen: true, action: 'CATEGORY'})} className="px-3 py-2 text-xs font-bold text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors flex items-center gap-1.5"><TagIcon c="w-3.5 h-3.5"/> Re-categorize</button>
                      <button onClick={() => setBulkModal({isOpen: true, action: 'TAGS'})} className="px-3 py-2 text-xs font-bold text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors flex items-center gap-1.5"><TagIcon c="w-3.5 h-3.5"/> Add Tags</button>
                      <button onClick={() => setBulkModal({isOpen: true, action: 'DESC'})} className="px-3 py-2 text-xs font-bold text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors flex items-center gap-1.5"><EditPencil c="w-3.5 h-3.5"/> Description</button>
                      <button onClick={() => setBulkModal({isOpen: true, action: 'DELETE'})} className="px-3 py-2 text-xs font-bold text-brand-expense hover:bg-rose-50 dark:hover:bg-rose-500/10 rounded-lg transition-colors flex items-center gap-1.5"><Trash2 c="w-3.5 h-3.5"/> Delete</button>
                   </div>
                   
                   <button onClick={() => setSelectedRows([])} className="ml-auto md:ml-2 p-1.5 text-slate-400 hover:text-slate-700 dark:hover:text-white transition-colors rounded-full shrink-0"><X c="w-4 h-4"/></button>

                   {/* Mobile Dropdown */}
                   {isActionsMenuOpen && (
                       <div className="absolute bottom-[110%] right-10 w-48 bg-white dark:bg-brand-sidebar border border-slate-200 dark:border-slate-700 rounded-xl shadow-2xl overflow-hidden py-1 z-50 animate-fade-in md:hidden">
                           <button onClick={() => { setIsActionsMenuOpen(false); setBulkModal({isOpen: true, action: 'CATEGORY'}); }} className="w-full text-left px-4 py-3 text-xs font-bold text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 flex items-center gap-2"><TagIcon c="w-4 h-4"/> Re-categorize</button>
                           <button onClick={() => { setIsActionsMenuOpen(false); setBulkModal({isOpen: true, action: 'TAGS'}); }} className="w-full text-left px-4 py-3 text-xs font-bold text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 flex items-center gap-2"><TagIcon c="w-4 h-4"/> Add Tags</button>
                           <button onClick={() => { setIsActionsMenuOpen(false); setBulkModal({isOpen: true, action: 'DESC'}); }} className="w-full text-left px-4 py-3 text-xs font-bold text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 flex items-center gap-2"><EditPencil c="w-4 h-4"/> Description</button>
                       </div>
                   )}
                </div>
             </div>
          )}

          <ConfirmDialog 
             isOpen={deleteModalId !== null} 
             onCancel={() => setDeleteModalId(null)} 
             onConfirm={executeDeleteSingle} 
             title="Delete Transaction" 
             message="Are you sure you want to delete this transaction permanently? This cannot be undone."
          />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
