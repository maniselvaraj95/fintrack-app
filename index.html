<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FinTrack">
  <meta name="theme-color" content="#e06c53" id="theme-color-meta">
  <link rel="manifest" href="manifest.json">
  <title>FinTrack</title>
  
  <link rel="icon" type="image/png" href="Icon-192.png">
  <link rel="apple-touch-icon" href="Icon-192.png">

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        try { navigator.serviceWorker.register('./sw.js').catch(e => console.warn('SW:', e)); } catch(e) {}
      });
    }
  </script>

  <style>#crash-log{display:none;padding:20px;color:#ef4444;background:#fee2e2;font-family:monospace;font-size:12px;font-weight:bold;height:100vh;width:100vw;overflow:auto;}</style>
  <script>window.onerror=function(m,s,l,c,e){console.error("Caught:", m, l);};</script>
  <script>try{if(localStorage.getItem('theme')==='dark'||(!('theme' in localStorage)&&window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.classList.add('dark');let m=document.getElementById('theme-color-meta');if(m)m.setAttribute("content","#1c1917");}else{document.documentElement.classList.remove('dark');let m=document.getElementById('theme-color-meta');if(m)m.setAttribute("content","#e06c53");}}catch(e){}</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class',theme:{extend:{colors:{brand:{bgLight:'#faf6f3',bgDark:'#1c1917',sidebar:'#292524',sidebarHover:'#44403c',cardLight:'#ffffff',cardDark:'#292524',teal:'#e06c53',tealHover:'#c2553d',expense:'#ef4444',income:'#22c55e',transfer:'#f59e0b'}}}}}</script>

  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
    body{font-family:'Plus Jakarta Sans',sans-serif;-webkit-font-smoothing:antialiased;transition:background-color .3s,color .3s;}
    .modern-card{background:#ffffff;border-radius:1.25rem;box-shadow:0 4px 6px -1px rgba(0,0,0,0.05);border:1px solid #e2e8f0;transition:all .3s;}
    .dark .modern-card{background:#292524;box-shadow:0 10px 25px -5px rgba(0,0,0,0.3);border:1px solid #3f3f46;}
    .hide-scrollbar::-webkit-scrollbar{display:none;}
    .hide-scrollbar{-ms-overflow-style:none;scrollbar-width:none;}
    .animate-fade-in{animation:fadeIn .3s forwards;}
    .animate-slide-up{animation:slideUp .4s forwards;}
    .privacy-active .blur-money{user-select:none;pointer-events:none;}
    
    /* Chrome Password Autofill Defeat Trick */
    .pin-input { -webkit-text-security: disc; }

    /* NAV ITEMS - Disable Mobile Tap Flash */
    .nav-item {
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    /* FAST NATIVE CHECKBOX - PERFECTLY ROUNDED AND STRICT FIXED SIZE */
    .custom-check {
      appearance: none;
      background-color: #f1f5f9;
      width: 18px !important;
      height: 18px !important;
      min-width: 18px !important;
      min-height: 18px !important;
      border-radius: 50%;
      display: grid;
      place-content: center;
      cursor: pointer;
      border: 1px solid #cbd5e1;
      transition: all 0.2s ease;
      flex-shrink: 0;
      margin: 0;
    }
    .dark .custom-check{background-color:#44403c;border-color:#57534e;}
    .custom-check::before {
      content: "";
      width: 10px;
      height: 10px;
      transform: scale(0);
      transition: 120ms transform ease-in-out;
      box-shadow: inset 1em 1em white;
      background-color: white;
      clip-path: polygon(14% 44%,0 65%,50% 100%,100% 16%,80% 0%,43% 62%);
    }
    .custom-check:checked{background-color:#e06c53;border-color:#e06c53;}
    .dark .custom-check:checked{background-color:#e06c53;border-color:#e06c53;}
    .custom-check:checked::before{transform:scale(1);}
    .dark input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.8;cursor:pointer;}

    /* Desktop Tooltip Hover System */
    .nav-tooltip, .nav-tooltip-bottom, .nav-tooltip-bottom-right {
      position: absolute;
      padding: 6px 12px;
      background-color: #334155;
      color: white;
      font-size: 11px;
      font-weight: 700;
      border-radius: 8px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: all .2s;
      z-index: 50;
      text-transform: uppercase;
    }
    .dark .nav-tooltip, .dark .nav-tooltip-bottom, .dark .nav-tooltip-bottom-right {
      background-color: #1e293b;
      border: 1px solid #334155;
    }
    @media (min-width: 768px) {
      .nav-tooltip { left: calc(100% + 12px); top: 50%; transform: translateY(-50%); }
      .nav-tooltip-bottom { top: calc(100% + 12px); left: 50%; transform: translateX(-50%); }
      .nav-tooltip-bottom-right { top: calc(100% + 12px); right: 0; left: auto; transform: none; }
      .nav-item:hover .nav-tooltip { opacity: 1; left: calc(100% + 16px); }
      .nav-item:hover .nav-tooltip-bottom { opacity: 1; top: calc(100% + 16px); }
      .nav-item:hover .nav-tooltip-bottom-right { opacity: 1; top: calc(100% + 16px); }
    }
    @media (max-width: 767px) {
      .nav-tooltip, .nav-tooltip-bottom, .nav-tooltip-bottom-right { display: none; }
    }
  </style>
</head>
<body class="bg-brand-bgLight dark:bg-brand-bgDark text-slate-900 dark:text-slate-100 transition-colors duration-300">
  <div id="crash-log"></div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef } = React;

    let GLOBAL_API_URL = "";
    let GLOBAL_API_KEY = "";
    try {
        GLOBAL_API_URL = localStorage.getItem('API_URL') || "";
        GLOBAL_API_KEY = localStorage.getItem('API_KEY') || "";
    } catch(e) {}

    const apiCall = async (action, data = {}) => {
        if (!GLOBAL_API_URL || !GLOBAL_API_KEY) throw new Error("Missing Credentials.");
        const response = await fetch(GLOBAL_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action, apiKey: GLOBAL_API_KEY, ...data })
        });
        const result = await response.json();
        if (result.status === 'error') throw new Error(result.message);
        return result.data;
    };

    const Icon = ({ children, c }) => <svg className={c} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">{children}</svg>;
    const IndianRupee = ({c}) => <Icon c={c}><path d="M6 3h12M6 8h12m-12 5 8.5 8M6 13h3M9 13c6.667 0 6.667-10 0-10"/></Icon>;
    const RefreshCw = ({c}) => <Icon c={c}><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></Icon>;
    const Plus = ({c}) => <Icon c={c}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Icon>;
    const Activity = ({c}) => <Icon c={c}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></Icon>;
    const PieChart = ({c}) => <Icon c={c}><path d="M21.2 15.9A10 10 0 1 1 8 2.8M22 12A10 10 0 0 0 12 2v10z"/></Icon>;
    const List = ({c}) => <Icon c={c}><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></Icon>;
    const Sparkles = ({c}) => <Icon c={c}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></Icon>;
    const ArrowUpRight = ({c}) => <Icon c={c}><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></Icon>;
    const ArrowDownRight = ({c}) => <Icon c={c}><line x1="7" y1="7" x2="17" y2="17"/><polyline points="17 7 17 7 17 17"/></Icon>;
    const Repeat = ({c}) => <Icon c={c}><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></Icon>;
    const SearchIcon = ({c}) => <Icon c={c}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></Icon>;
    const ChevronDown = ({c}) => <Icon c={c}><path d="m6 9 6 6 6-6"/></Icon>;
    const ChevronUp = ({c}) => <Icon c={c}><path d="m18 15-6-6-6 6"/></Icon>;
    const ChevronsUpDown = ({c}) => <Icon c={c}><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></Icon>;
    const X = ({c}) => <Icon c={c}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></Icon>;
    const Wallet = ({c}) => <Icon c={c}><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4M3 5v14a2 2 0 0 0 2 2h16v-5M18 12a2 2 0 0 0 0 4h4v-4Z"/></Icon>;
    const EditPencil = ({c}) => <Icon c={c}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></Icon>;
    const Trash2 = ({c}) => <Icon c={c}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/></Icon>;
    const SettingsIcon = ({c}) => <Icon c={c}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></Icon>;
    const TagIcon = ({c}) => <Icon c={c}><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82zM7 7h.01"/></Icon>;
    const LockIcon = ({c}) => <Icon c={c}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></Icon>;
    const Shield = ({c}) => <Icon c={c}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></Icon>;
    const DeleteIcon = ({c}) => <Icon c={c}><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zM18 9l-6 6M12 9l6 6"/></Icon>;
    const Sun = ({c}) => <Icon c={c}><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></Icon>;
    const Moon = ({c}) => <Icon c={c}><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></Icon>;
    const Eye = ({c}) => <Icon c={c}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></Icon>;
    const EyeOff = ({c}) => <Icon c={c}><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24M1 1l22 22"/></Icon>;

    const MONTH_NAMES = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    const MONTH_NAMES_FULL = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const parseDateLocal = (s) => { if (!s) return new Date(); const p=String(s).split('-'); return p.length===3 ? new Date(p[0],p[1]-1,p[2]) : new Date(s); };
    const formatDateStr = (s) => { const d=parseDateLocal(s); return isNaN(d)?'':`${String(d.getDate()).padStart(2,'0')}-${MONTH_NAMES[d.getMonth()]}-${String(d.getFullYear()).slice(-2)}`; };
    const formatDateShort = (s) => { const d=parseDateLocal(s); return isNaN(d)?'':`${String(d.getDate()).padStart(2,'0')} ${MONTH_NAMES[d.getMonth()]}`; };
    const parseAmt = (v) => { const n=parseFloat(String(v).replace(/[^\d.-]/g, '')); return isNaN(n)?0:n; };
    const formatINR = (v, p) => p ? '₹ ......' : new Intl.NumberFormat('en-IN', { style:'currency',currency:'INR',maximumFractionDigits:0 }).format(v);
    const formatCompact = (v, p) => p ? '......' : (Math.abs(v)>=100000 ? `₹${(v/100000).toFixed(2)}L` : Math.abs(v)>=1000 ? `₹${(v/1000).toFixed(2)}k` : `₹${Math.round(v)}`);
    const extractTags = (s) => String(s||'').split(/[\s,;]+/).map(t=>t.trim().toLowerCase()).filter(t=>t.length>0&&t!=='#').map(t=>t.startsWith('#')?t:`#${t}`);

    function getHeatmapCellStyles(val, maxVal, isDark) {
      if (!val || val === 0 || !maxVal) return { style: { backgroundColor: isDark ? '#292524' : '#f8fafc' }, className: isDark ? 'text-slate-500 font-normal' : 'text-slate-400 font-normal' };
      const intensity = val / maxVal;
      if (intensity <= 0.25) return { style: { backgroundColor: isDark ? '#431407' : '#ffedd5' }, className: isDark ? 'text-orange-200 font-bold' : 'text-orange-800 font-bold' };
      if (intensity <= 0.55) return { style: { backgroundColor: isDark ? '#9a3412' : '#fdba74' }, className: isDark ? 'text-white font-extrabold' : 'text-orange-900 font-extrabold' };
      if (intensity <= 0.80) return { style: { backgroundColor: isDark ? '#c2410c' : '#f97316' }, className: 'text-white font-extrabold' };
      return { style: { backgroundColor: '#e06c53' }, className: 'text-white font-black' };
    }

    function SetupScreen({ onSave }) {
        const [u, setU] = useState('');
        const [k, setK] = useState('');
        const [loading, setLoading] = useState(false);
        const [errMsg, setErrMsg] = useState('');
        
        const handle = async (e) => {
            e.preventDefault();
            if (!u.trim() || !k.trim()) return;
            setLoading(true);
            setErrMsg('');
            try {
                const res = await fetch(u.trim(), {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'GET_DATA', apiKey: k.trim() })
                });
                const result = await res.json();
                if (result.status === 'error') throw new Error(result.message);
                onSave(u.trim(), k.trim(), result.data);
            } catch(error) {
                setErrMsg("Connection Failed: Incorrect URL or Secret Key.");
                setLoading(false);
            }
        };

        return (
            <div className="fixed inset-0 z-[300] flex items-center justify-center bg-brand-bgLight dark:bg-brand-bgDark p-4 transition-colors duration-300">
                <div className="modern-card max-w-sm w-full p-8 animate-slide-up border border-slate-200 dark:border-slate-800 shadow-2xl">
                    <div className="flex justify-center mb-6"><div className="w-16 h-16 bg-brand-teal rounded-2xl flex items-center justify-center text-white shadow-sm"><IndianRupee c="w-8 h-8"/></div></div>
                    <h2 className="text-2xl font-black text-slate-800 dark:text-white text-center mb-2">FinTrack Setup</h2>
                    <p className="text-xs font-bold text-slate-500 dark:text-slate-400 text-center mb-6">Link your secure Google Sheet to this device.</p>
                    {errMsg && <div className="mb-4 p-3 bg-rose-50 text-brand-expense rounded-full text-xs font-bold text-center border border-rose-100">{errMsg}</div>}
                    <form onSubmit={handle} className="space-y-4">
                        <div><label className="block text-[10px] font-bold text-slate-700 dark:text-slate-300 uppercase tracking-widest mb-1.5">Web App URL</label><input type="url" required value={u} onChange={e=>setU(e.target.value)} placeholder="https://script.google.com/..." className="w-full bg-slate-50 dark:bg-brand-bgDark border border-slate-200 dark:border-slate-700 rounded-full px-4 py-3 text-sm font-bold outline-none focus:ring-1 focus:border-brand-teal dark:text-white" /></div>
                        <div><label className="block text-[10px] font-bold text-slate-700 dark:text-slate-300 uppercase tracking-widest mb-1.5">Secret Key</label><input type="password" required value={k} onChange={e=>setK(e.target.value)} placeholder="Enter your secret key" className="w-full bg-slate-50 dark:bg-brand-bgDark border border-slate-200 dark:border-slate-700 rounded-full px-4 py-3 text-sm font-bold outline-none focus:ring-1 focus:border-brand-teal dark:text-white tracking-widest" /></div>
                        <button type="submit" disabled={loading} className="w-full py-3.5 rounded-full font-black text-white bg-brand-teal hover:bg-brand-tealHover shadow-sm transition-colors mt-2">{loading ? 'Verifying...' : 'Connect Device'}</button>
                    </form>
                </div>
            </div>
        );
    }

    function LockScreen({ correctPin, onUnlock }) {
      const [input, setInput] = useState('');
      const [error, setError] = useState(false);
      const handlePress = (n) => { setInput(prev => { if (error || prev.length >= correctPin.length) return prev; const newVal = prev + n; if (newVal === correctPin) setTimeout(() => onUnlock(), 150); else if (newVal.length === correctPin.length) { setError(true); setTimeout(() => { setInput(''); setError(false); }, 400); } return newVal; }); };
      const handleBackspace = () => setInput(p => error || p.length===0 ? p : p.slice(0, -1));
      useEffect(() => { const hk = (e) => { if (error) return; if(e.key>='0'&&e.key<='9') handlePress(e.key); else if(e.key==='Backspace'||e.key==='Delete') handleBackspace(); }; window.addEventListener('keydown', hk); return () => window.removeEventListener('keydown', hk); }, [error, correctPin]);
      return (
          <div className="fixed inset-0 z-[200] flex flex-col items-center justify-center bg-brand-bgLight dark:bg-brand-bgDark transition-colors duration-300">
              <div className="flex flex-col items-center mb-12 animate-slide-up"><div className="w-16 h-16 bg-brand-teal rounded-2xl flex items-center justify-center text-white mb-6 shadow-md"><Shield c="w-8 h-8"/></div><h2 className="text-xl font-black text-slate-800 dark:text-white mb-2">App Locked</h2><p className="text-sm font-bold text-slate-500 dark:text-slate-400">Enter your PIN to continue</p></div>
              <div className="flex gap-4 mb-12 min-h-[1.5rem]">{Array.from({ length: correctPin.length }).map((_, i) => (<div key={i} className={`w-4 h-4 rounded-full transition-all ${i < input.length ? 'bg-brand-teal scale-110' : 'bg-slate-200 dark:bg-slate-800'} ${error ? 'animate-pulse bg-brand-expense' : ''}`} />))}</div>
              <div className="grid grid-cols-3 gap-4 sm:gap-6 max-w-[320px] w-full px-4">{[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => <button key={n} onClick={()=>handlePress(String(n))} className="w-[84px] h-[84px] sm:w-[90px] sm:h-[90px] flex items-center justify-center text-3xl font-black text-slate-800 dark:text-white bg-white dark:bg-brand-cardDark rounded-full shadow-sm border border-slate-100 dark:border-slate-800 active:scale-90 mx-auto">{n}</button>)}<div className="w-[84px] h-[84px] sm:w-[90px] sm:h-[90px]"></div><button onClick={()=>handlePress('0')} className="w-[84px] h-[84px] sm:w-[90px] sm:h-[90px] flex items-center justify-center text-3xl font-black text-slate-800 dark:text-white bg-white dark:bg-brand-cardDark rounded-full shadow-sm border border-slate-100 dark:border-slate-800 active:scale-90 mx-auto">0</button><button onClick={handleBackspace} className="w-[84px] h-[84px] sm:w-[90px] sm:h-[90px] flex items-center justify-center text-slate-500 dark:text-slate-400 bg-white dark:bg-brand-cardDark rounded-full shadow-sm border border-slate-100 dark:border-slate-800 active:scale-90 mx-auto"><DeleteIcon c="w-8 h-8"/></button></div>
          </div>
      );
    }

    function SearchableSelect({ options, value, onChange, placeholder, compact = false }) {
      const [isOpen, setIsOpen] = useState(false);
      const [search, setSearch] = useState('');
      const [openUpwards, setOpenUpwards] = useState(false);
      const wrapperRef = useRef(null);

      useEffect(() => { 
        function h(e) { if (wrapperRef.current && !wrapperRef.current.contains(e.target)) { setIsOpen(false); setSearch(''); } } 
        document.addEventListener("mousedown", h); 
        return () => document.removeEventListener("mousedown", h); 
      }, []);

      const handleOpen = () => {
         if (wrapperRef.current) {
             const rect = wrapperRef.current.getBoundingClientRect();
             setOpenUpwards(window.innerHeight - rect.bottom < 220);
         }
         setIsOpen(true);
      };

      const filtered = (options||[]).filter(o => String(o).toLowerCase().includes(String(search).toLowerCase()));
      return (
        <div className="relative w-full" ref={wrapperRef}>
          <div className={`relative flex items-center w-full bg-white dark:bg-brand-bgDark border ${isOpen ? 'border-brand-teal ring-1 ring-brand-teal' : 'border-slate-200 dark:border-slate-700'} ${compact ? 'rounded-full px-4 py-2.5 text-xs shadow-sm cursor-pointer' : 'rounded-full px-4 py-3.5 text-sm shadow-sm cursor-text'} font-bold transition-all`} onClick={handleOpen}>
             {isOpen && !compact ? ( <input autoFocus type="text" autoComplete="new-password" spellCheck="false" autoCorrect="off" name={`search_${Math.random()}`} value={search} onChange={e=>setSearch(e.target.value)} placeholder="Type to search..." className="w-full bg-transparent outline-none text-slate-900 dark:text-white" /> ) : ( <div className={`w-full flex items-center justify-between ${value ? 'text-slate-900 dark:text-white' : 'text-slate-400 dark:text-slate-500'}`}><span className="truncate pr-3">{value || placeholder}</span><ChevronDown c={`w-4 h-4 shrink-0 transition-transform ${isOpen ? 'rotate-180 text-brand-teal' : 'text-slate-400'}`} /></div> )}
          </div>
          {isOpen && (
            <div className={`absolute z-[150] w-full ${openUpwards ? 'bottom-full mb-2' : 'top-full mt-2'} bg-white dark:bg-brand-cardDark border border-slate-200 dark:border-slate-700 rounded-2xl shadow-xl max-h-48 overflow-y-auto hide-scrollbar`}>
              {compact && <div className="sticky top-0 bg-white dark:bg-brand-cardDark border-b border-slate-100 dark:border-slate-800 p-2 z-10"><input type="text" autoFocus autoComplete="new-password" spellCheck="false" autoCorrect="off" name={`search_${Math.random()}`} value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search..." className="w-full bg-slate-50 dark:bg-brand-bgDark border border-slate-200 dark:border-slate-700 rounded-full px-3 py-2 text-xs font-semibold outline-none text-slate-900 dark:text-white" /></div>}
              {filtered.length > 0 ? filtered.map(o => ( <div key={o} onClick={(e) => { e.stopPropagation(); onChange(o); setIsOpen(false); setSearch(''); }} className="px-4 py-3 border-b border-slate-50 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer text-sm font-bold text-slate-700 dark:text-slate-300 transition-colors last:border-0">{o}</div> )) : <div className="px-4 py-3 text-sm text-slate-400 font-medium text-center">No matches found</div>}

    function AreaChart({ data, height = 180, isDark, isPrivacy }) {
      const [hoverIndex, setHoverIndex] = useState(null);
      const isScrollable = data.length > 12;
      const width = isScrollable ? Math.max(600, data.length * 52) : 600;
      const pad = { t: 15, r: 15, b: 25, l: 45 }; 
      const gW = width - pad.l - pad.r; 
      const gH = height - pad.t - pad.b;
      
      let min = 0, max = 0; 
      data.forEach(d => { 
        if(d.in>max)max=d.in; 
        if(d.out>max)max=d.out; 
        if(d.avail>max)max=d.avail; 
        if(d.inv>max)max=d.inv; 
        if(d.avail<min)min=d.avail; 
        if(d.inv<min)min=d.inv; 
      }); 
      if(max===0) max=10000; 
      const range = max - min;
      
      const getX = (i) => pad.l + (i / Math.max(data.length - 1, 1)) * gW; 
      const getY = (v) => pad.t + gH - ((v - min) / range) * gH;
      const makePath = (k) => data.map((d, i) => (i===0?'M':'L') + ' ' + getX(i) + ' ' + getY(d[k])).join(' ');
      const makeArea = (k) => makePath(k) + ' L ' + getX(data.length-1) + ' ' + getY(0) + ' L ' + getX(0) + ' ' + getY(0) + ' Z';
      let toolX = hoverIndex !== null ? getX(hoverIndex) : 0;
      
      return (
        <div className="w-full overflow-x-auto hide-scrollbar">
          <div className="flex justify-end gap-3 sm:gap-5 text-[9px] sm:text-[10px] font-extrabold tracking-widest mb-4 uppercase"><span className="text-slate-500 dark:text-slate-400 flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-brand-income"></span> Income</span><span className="text-slate-500 dark:text-slate-400 flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-brand-expense"></span> Spend</span><span className="text-slate-500 dark:text-slate-400 flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-[#f59e0b]"></span> Invested</span><span className="text-slate-500 dark:text-slate-400 flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-[#e06c53]"></span> Availability</span></div>
          <svg viewBox={`0 0 ${width} ${height}`} style={{ minWidth: isScrollable ? `${width}px` : '100%' }} className="w-full h-auto font-sans relative">
            <defs><linearGradient id="gIN" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#10b981" stopOpacity="0.05"/><stop offset="100%" stopColor="#10b981" stopOpacity="0"/></linearGradient><linearGradient id="gOUT" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#f43f5e" stopOpacity="0.05"/><stop offset="100%" stopColor="#f43f5e" stopOpacity="0"/></linearGradient></defs>
            {[0, 0.5, 1].map(pct => { const y = pad.t + gH * (1 - pct); const val = min + range * pct; return ( <g key={pct}><line x1={pad.l} y1={y} x2={width - pad.r} y2={y} stroke={isDark ? '#27272a' : '#e2e8f0'} strokeDasharray="5 5" /><text x={pad.l - 10} y={y + 4} textAnchor="end" className="text-[10px] fill-slate-400 font-bold blur-money">{formatCompact(val, isPrivacy)}</text></g> ); })}
            {min < 0 && <line x1={pad.l} y1={getY(0)} x2={width - pad.r} y2={getY(0)} stroke={isDark ? '#3f3f46' : '#cbd5e1'} strokeDasharray="5 5" strokeWidth="1" />}
            <path d={makeArea('in')} fill="url(#gIN)" pointerEvents="none" /><path d={makePath('in')} fill="none" stroke="#10b981" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" pointerEvents="none" />
            <path d={makeArea('out')} fill="url(#gOUT)" pointerEvents="none" /><path d={makePath('out')} fill="none" stroke="#f43f5e" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" pointerEvents="none" />
            <path d={makePath('inv')} fill="none" stroke="#f59e0b" strokeWidth="2.5" strokeLinecap="round" pointerEvents="none" />
            <path d={makePath('avail')} fill="none" stroke="#e06c53" strokeWidth="2.5" strokeDasharray="6 4" strokeLinecap="round" pointerEvents="none" />
            {data.map((d, i) => ( <g key={i} pointerEvents="none"><text x={getX(i)} y={height - 5} textAnchor="middle" className="text-[10px] fill-slate-500 font-extrabold tracking-wide">{d.label}</text><circle cx={getX(i)} cy={getY(d.in)} r="5" fill={isDark ? '#121e1f' : '#fff'} stroke="#10b981" strokeWidth="2.5" /><circle cx={getX(i)} cy={getY(d.out)} r="5" fill={isDark ? '#121e1f' : '#fff'} stroke="#f43f5e" strokeWidth="2.5" /><circle cx={getX(i)} cy={getY(d.inv)} r="5" fill={isDark ? '#121e1f' : '#fff'} stroke="#f59e0b" strokeWidth="2.5" /><circle cx={getX(i)} cy={getY(d.avail)} r="5" fill={isDark ? '#121e1f' : '#fff'} stroke="#e06c53" strokeWidth="2.5" /></g> ))}
            {hoverIndex !== null && <line x1={getX(hoverIndex)} y1={pad.t} x2={getX(hoverIndex)} y2={height - pad.b} stroke={isDark ? '#3f3f46' : '#94a3b8'} strokeWidth="1.5" strokeDasharray="4 4" pointerEvents="none" />}
            {data.map((d, i) => <rect key={`h-${i}`} x={getX(i)-(gW/Math.max(data.length-1,1))/2} y={0} width={gW/Math.max(data.length-1,1)} height={height} fill="transparent" onMouseEnter={()=>setHoverIndex(i)} onMouseLeave={()=>setHoverIndex(null)} onTouchStart={()=>setHoverIndex(i)} className="cursor-crosshair outline-none" /> )}
            {hoverIndex !== null && (() => {
               const bX = toolX > width / 2 ? -160 : 10;
               return (
                   <g transform={`translate(${toolX}, 5)`} pointerEvents="none" className="animate-fade-in z-50">
                      <rect x={bX} y="0" width="150" height="96" rx="16" fill={isDark ? '#1a2e2f' : '#122b2c'} opacity="0.98" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.15))" />
                      <text x={bX+75} y="20" textAnchor="middle" fill="#ffffff" fontSize="12" fontWeight="800" tracking="wider">{data[hoverIndex].label}</text>
                      <line x1={bX+15} y1="26" x2={bX+135} y2="26" stroke={isDark ? '#274041' : '#1a3d3e'} strokeWidth="1" />
                      <text x={bX+15} y="42" fill="#94a3b8" fontSize="10" fontWeight="700">Inc:</text><text x={bX+135} y="42" textAnchor="end" fill="#10b981" fontSize="11" fontWeight="900" className="blur-money">{formatCompact(data[hoverIndex].in, isPrivacy)}</text>
                      <text x={bX+15} y="58" fill="#94a3b8" fontSize="10" fontWeight="700">Exp:</text><text x={bX+135} y="58" textAnchor="end" fill="#f43f5e" fontSize="11" fontWeight="900" className="blur-money">{formatCompact(data[hoverIndex].out, isPrivacy)}</text>
                      <text x={bX+15} y="74" fill="#94a3b8" fontSize="10" fontWeight="700">Inv:</text><text x={bX+135} y="74" textAnchor="end" fill="#f59e0b" fontSize="11" fontWeight="900" className="blur-money">{formatCompact(data[hoverIndex].inv, isPrivacy)}</text>
                      <text x={bX+15} y="90" fill="#94a3b8" fontSize="10" fontWeight="700">Avail:</text><text x={bX+135} y="90" textAnchor="end" fill="#e06c53" fontSize="11" fontWeight="900" className="blur-money">{formatCompact(data[hoverIndex].avail, isPrivacy)}</text>
                   </g>
               );
            })()}
          </svg>
        </div>
      );
    }

    function TopExpensesList({ data, totalExpense, isPrivacy }) {
      if (!data || data.length === 0) return <p className="text-xs text-slate-500 font-bold p-4">No expenses logged.</p>;
      const maxVal = data.length > 0 && data[0].total > 0 ? data[0].total : 1;
      return (
        <div className="space-y-4">
          {data.map((item, i) => {
            const pct = totalExpense > 0 ? (item.total / totalExpense) * 100 : 0;
            return (
              <div key={i} className="flex flex-col gap-2">
                <div className="flex justify-between items-center">
                  <div className="flex items-center gap-3 min-w-0 pr-4"><div className="w-8 h-8 rounded-full bg-slate-100 dark:bg-brand-bgDark border border-slate-200 dark:border-slate-800 flex items-center justify-center shrink-0 text-slate-500 dark:text-slate-400 font-black text-[10px] uppercase">{String(item.name || 'NA').substring(0, 2)}</div><div className="min-w-0"><p className="text-sm font-extrabold text-slate-800 dark:text-white truncate">{String(item.name || 'Unknown')}</p><p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest truncate mt-0.5">{String(item.cat || 'Uncategorized')}</p></div></div>
                  <div className="text-right shrink-0"><p className="text-sm font-black text-slate-900 dark:text-white blur-money">{formatINR(item.total, isPrivacy)}</p><p className="text-[10px] font-bold text-slate-400 blur-money">{isPrivacy ? '......' : pct.toFixed(1) + '% of total'}</p></div>
                </div>
                <div className="w-full h-1.5 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden"><div className="h-full bg-brand-teal rounded-full transition-all duration-500" style={{ width: `${(item.total/maxVal)*100}%` }}></div></div>
              </div>
            );
          })}
        </div>
      );
    }

    function DonutChart({ data, total, selectedCategory, onSelectCategory, isPrivacy }) {
      const activeSlice = selectedCategory !== 'All Categories' ? data.find(d => d.name === selectedCategory) : null;
      const size = 180; const radius = 75; const hole = 50; const center = size / 2; let curA = 0;
      const slices = data.map(item => {
        const a = total > 0 ? (item.value / total) * 360 : 0; const sA = curA; curA += a; const eA = curA; const sR = (sA - 90) * (Math.PI / 180); const eR = (eA - 90) * (Math.PI / 180); const lA = a > 180 ? 1 : 0;
        const x1 = center + radius * Math.cos(sR); const y1 = center + radius * Math.sin(sR); const x2 = center + radius * Math.cos(eR); const y2 = center + radius * Math.sin(eR);
        const x1_in = center + hole * Math.cos(sR); const y1_in = center + hole * Math.sin(sR); const x2_in = center + hole * Math.cos(eR); const y2_in = center + hole * Math.sin(eR);
        const d = a >= 359.9 ? ` M ${center - radius} ${center} A ${radius} ${radius} 0 1 0 ${center + radius} ${center} A ${radius} ${radius} 0 1 0 ${center - radius} ${center} M ${center - hole} ${center} A ${hole} ${hole} 0 1 1 ${center + hole} ${center} A ${hole} ${hole} 0 1 1 ${center - hole} ${center} Z ` : ` M ${x1} ${y1} A ${radius} ${radius} 0 ${lA} 1 ${x2} ${y2} L ${x2_in} ${y2_in} A ${hole} ${hole} 0 ${lA} 0 ${x1_in} ${y1_in} Z `;
        return { ...item, d };
      });
      return (
        <div className="relative w-[180px] h-[180px] shrink-0 mx-auto">
          <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
            {slices.map((s, i) => ( <path key={i} d={s.d} fill={s.color} opacity={activeSlice?(activeSlice.name===s.name?1:0.2):1} style={{ transform: activeSlice&&activeSlice.name===s.name ? 'scale(1.05)' : 'scale(1)', transformOrigin: `${center}px ${center}px`, transition: 'all 0.3s' }} className="cursor-pointer hover:opacity-80" onClick={() => onSelectCategory && onSelectCategory(selectedCategory === s.name ? 'All Categories' : s.name)} /> ))}
          </svg>
          <div className="absolute inset-0 flex flex-col items-center justify-center text-center pointer-events-none p-2">
            {activeSlice ? ( <><span className="text-[10px] font-bold uppercase tracking-widest text-slate-400 truncate max-w-[90px]">{activeSlice.name}</span><span className="text-xs font-black text-slate-800 dark:text-slate-100 mt-1 blur-money">{formatINR(activeSlice.value, isPrivacy)}</span></> ) : ( <><span className="text-[10px] font-bold uppercase tracking-widest text-slate-400">Total</span><span className="text-sm font-black text-slate-800 dark:text-slate-100 mt-1 blur-money">{formatINR(total, isPrivacy)}</span></> )}
          </div>
        </div>
      );
    }

    function ConfirmDialog({ isOpen, onConfirm, onCancel, title, message }) {
      if (!isOpen) return null;

        <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in sm:pb-4 pb-24">
           <div className="bg-white dark:bg-brand-cardDark rounded-[2rem] w-full max-w-[320px] mx-auto overflow-hidden shadow-2xl animate-slide-up p-6 text-center border border-slate-100 dark:border-slate-800">
              <div className="w-14 h-14 bg-rose-50 dark:bg-rose-500/10 text-brand-expense rounded-full flex items-center justify-center mx-auto mb-4"><Trash2 c="w-7 h-7"/></div>
              <h2 className="text-lg font-black text-slate-800 dark:text-white mb-2">{title}</h2>
              <p className="text-xs text-slate-500 dark:text-slate-400 font-bold mb-6">{message}</p>
              <div className="flex gap-3"><button onClick={onCancel} className="flex-1 py-3 rounded-full font-bold text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">Cancel</button><button onClick={onConfirm} className="flex-1 py-3 rounded-full font-bold text-white bg-brand-expense hover:bg-rose-700 transition-colors shadow-sm">Delete</button></div>
           </div>

        let borderClass = "border-t-slate-800 dark:border-t-slate-200", bgClass = "modern-card p-4 sm:p-5 flex flex-col justify-center bg-brand-cardLight dark:bg-brand-cardDark border-t-4 ", textClass = "text-slate-800 dark:text-white";
