                  </div>
                  <div className="mt-2"><div className="flex items-center justify-between cursor-pointer group px-2 py-1" onClick={() => setTagsExpanded(!tagsExpanded)}><span className="text-[11px] font-bold text-slate-500 uppercase tracking-widest flex items-center gap-2"><TagIcon c="w-3.5 h-3.5" /> Tags Filter{ledgerTagFilter && <span className="bg-brand-teal/10 text-brand-teal border border-brand-teal/20 px-2 py-0.5 rounded-md normal-case tracking-normal shadow-sm">{ledgerTagFilter}</span>}</span><ChevronDown c={`w-4 h-4 text-slate-400 transition-transform ${tagsExpanded ? 'rotate-180' : ''}`} /></div>{tagsExpanded && (<div className="animate-fade-in flex flex-wrap items-center gap-2 pt-3 pb-1 px-1"><button onClick={() => setLedgerTagFilter(null)} className={`px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-colors border shadow-sm ${!ledgerTagFilter ? 'bg-brand-teal/10 text-brand-teal border-brand-teal/30' : 'bg-white dark:bg-brand-cardDark text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800'}`}>All Tags</button>{allAvailableTags.map(tag => (<button key={tag} onClick={() => setLedgerTagFilter(tag === ledgerTagFilter ? null : tag)} className={`px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-colors border shadow-sm ${tag === ledgerTagFilter ? 'bg-brand-teal/10 text-brand-teal border-brand-teal/30' : 'bg-white dark:bg-brand-cardDark text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800'}`}>{tag}</button>))}</div>)}</div>
                  
                  {groupedLedger.length > 0 && (
                    <div className="hidden lg:grid grid-cols-[2.5rem_6rem_12rem_8rem_1fr_10rem_5rem] gap-4 px-6 py-3 mt-6 items-center text-[10px] font-extrabold text-slate-400 dark:text-slate-500 uppercase tracking-widest border-b border-slate-200 dark:border-slate-800"><div className="flex items-center justify-center nav-item relative group"><input type="checkbox" checked={selectedRows.length > 0 && selectedRows.length === ledgerFiltered.length} onChange={handleSelectAll} className="custom-check" /><span className="nav-tooltip-bottom">Select All</span></div><div className="shrink-0 cursor-pointer hover:text-brand-teal flex items-center gap-1 select-none" onClick={() => handleSort('date')}>Date <SortIcon colKey="date"/></div><div className="shrink-0 cursor-pointer hover:text-brand-teal flex items-center gap-1 select-none" onClick={() => handleSort('category')}>Category <SortIcon colKey="category"/></div><div className="shrink-0 cursor-pointer hover:text-brand-teal flex items-center justify-end gap-1 select-none" onClick={() => handleSort('amount')}><SortIcon colKey="amount"/> Amount</div><div className="min-w-0 px-4 cursor-pointer hover:text-brand-teal flex items-center gap-1 select-none" onClick={() => handleSort('description')}>Description <SortIcon colKey="description"/></div><div className="shrink-0 cursor-pointer hover:text-brand-teal flex items-center gap-1 select-none" onClick={() => handleSort('account')}>Account <SortIcon colKey="account"/></div><div className="flex items-center justify-end nav-item relative group"><button onClick={toggleExpandCollapseAll} className="p-1.5 text-slate-400 hover:text-brand-teal transition-colors"><ChevronsUpDown c="w-4 h-4"/></button><span className="nav-tooltip-bottom">{isAllCollapsed || Object.values(expandedGroups).filter(v=>v).length === 0 ? 'Expand All' : 'Collapse All'}</span></div></div>
                  )}

                  {groupedLedger.length > 0 && (
                    <div className="lg:hidden flex items-center px-4 py-2.5 mt-4 border-b border-slate-200 dark:border-slate-800 gap-2"><div className="flex items-center justify-center shrink-0"><input type="checkbox" checked={selectedRows.length > 0 && selectedRows.length === ledgerFiltered.length} onChange={handleSelectAll} className="custom-check" /></div><div className="flex-1 flex items-center justify-between text-[9px] font-extrabold text-slate-400 dark:text-slate-500 uppercase tracking-wide px-1"><div className="shrink-0 cursor-pointer flex items-center gap-0.5 hover:text-brand-teal select-none" onClick={() => handleSort('date')}>Date <SortIcon colKey="date"/></div><div className="shrink-0 cursor-pointer flex items-center gap-0.5 hover:text-brand-teal select-none" onClick={() => handleSort('category')}>Cat <SortIcon colKey="category"/></div><div className="shrink-0 cursor-pointer flex items-center gap-0.5 hover:text-brand-teal select-none" onClick={() => handleSort('amount')}>Amt <SortIcon colKey="amount"/></div><div className="shrink-0 cursor-pointer flex items-center gap-0.5 hover:text-brand-teal select-none" onClick={() => handleSort('description')}>Desc <SortIcon colKey="description"/></div><div className="shrink-0 cursor-pointer flex items-center gap-0.5 hover:text-brand-teal select-none" onClick={() => handleSort('account')}>Acc <SortIcon colKey="account"/></div></div><button onClick={toggleExpandCollapseAll} className="p-1.5 text-slate-400 hover:text-brand-teal transition-colors shrink-0 bg-slate-50 dark:bg-slate-800 rounded-lg"><ChevronsUpDown c="w-4 h-4"/></button></div>
                  )}

                  {groupedLedger.length === 0 ? <div className="modern-card p-12 text-center text-slate-400 font-bold text-sm mt-4 border border-slate-200 dark:border-slate-800">No transactions found.</div> : (
                    <div className="space-y-4 pb-12">
                      {groupedLedger.map(g => {
                         const isExpanded = !!expandedGroups[g.label];
                         return (
                           <div key={g.label} className="modern-card overflow-hidden border border-slate-200 dark:border-slate-800 shadow-sm">
                              <div className="flex flex-col sm:flex-row sm:items-center justify-between bg-white dark:bg-brand-cardDark px-4 py-4 sm:px-6 sm:py-5 cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors gap-3 sm:gap-4 border-b border-slate-100 dark:border-slate-800 last:border-0" onClick={() => toggleGroup(g.label)}><div className="flex items-center gap-3 min-w-0"><ChevronDown c={`w-5 h-5 text-slate-400 transition-transform shrink-0 ${isExpanded ? 'rotate-180' : ''}`} /><span className="font-extrabold text-base sm:text-lg tracking-tight truncate">{g.label}</span>{g.isCurrentMonth && <span className="bg-brand-teal/20 text-brand-teal text-[10px] font-black px-2 py-1 rounded-lg uppercase tracking-wider shrink-0 hidden sm:inline-block">This Month</span>}</div><div className="flex items-center gap-3 shrink-0 pl-8 sm:pl-0"><div className="flex items-center text-[11px] sm:text-xs font-bold text-slate-500 dark:text-slate-400 bg-brand-bgLight dark:bg-brand-bgDark px-3 py-1.5 rounded-xl whitespace-nowrap shadow-sm border border-slate-100 dark:border-slate-800">{g.count} entries <span className="mx-2 text-slate-300 dark:text-slate-600">|</span> <span className="text-slate-800 dark:text-slate-200 font-black blur-money">-{formatCompact(g.spent, isPrivacyMode)}</span></div>{g.invested > 0 && <span className="flex items-center text-[11px] sm:text-xs font-bold text-amber-600 dark:text-amber-500 bg-amber-50 dark:bg-amber-500/10 px-3 py-1.5 rounded-xl whitespace-nowrap blur-money">+Inv {formatCompact(g.invested, isPrivacyMode)}</span>}</div></div>
                              {isExpanded && (
                                 <div className="divide-y divide-slate-100 dark:divide-slate-800/50 bg-white dark:bg-brand-cardDark">
                                   {g.entries.map(t => {
                                      const isExcluded = (appData.excludedCats || []).includes(t.category); const isIN = t.rawType === 'INCOME'; const isTRF = t.rawType === 'TRANSFER';
                                      const IconComp = isIN ? ArrowDownRight : isTRF ? Repeat : ArrowUpRight;
                                      const colorClass = isIN ? 'text-brand-income bg-emerald-50 dark:bg-emerald-500/10 border-emerald-100 dark:border-emerald-500/20' : isTRF ? 'text-slate-500 bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700' : 'text-brand-expense bg-rose-50 dark:bg-rose-500/10 border-rose-100 dark:border-rose-500/20';
                                      const badgeClass = isIN ? 'text-brand-income bg-emerald-50 dark:bg-emerald-500/10 border border-emerald-100 dark:border-emerald-500/20' : isTRF ? 'text-brand-transfer bg-blue-50 dark:bg-blue-900/20 border border-blue-100 dark:border-blue-800/30' : 'text-brand-expense bg-rose-50 dark:bg-rose-500/10 border border-rose-100 dark:border-rose-500/20';
                                      const amtColor = isIN ? 'text-brand-income' : isTRF ? 'text-slate-600 dark:text-slate-400' : 'text-slate-900 dark:text-white';
                                      const sign = isIN ? '+' : isTRF ? '' : '-'; const txTags = extractTags(t.tags);
                                      return (
                                        <div key={t.id} className={`group ${isExcluded ? 'opacity-40 grayscale' : ''}`}>
                                           <div className="flex lg:hidden px-4 py-3 sm:px-6 sm:py-4 items-start gap-3 sm:gap-4 hover:bg-slate-50 dark:hover:bg-slate-800/30 transition-colors"><div className="flex items-center justify-center shrink-0 pt-0.5"><input type="checkbox" checked={selectedRows.includes(t.row_index)} onChange={() => handleSelectRow(t.row_index)} className="custom-check" /></div><div className={`hidden sm:flex w-[40px] h-[40px] rounded-xl items-center justify-center shrink-0 shadow-sm border ${colorClass}`}><IconComp c="w-5 h-5"/></div><div className="flex-1 min-w-0 flex flex-col justify-start"><div className="flex justify-between items-start gap-2 sm:mb-1"><p className={`text-sm sm:text-base font-extrabold break-words text-wrap leading-tight pr-2 ${isExcluded ? 'line-through text-slate-400' : ''}`}>{t.description}</p><p className={`text-base font-black blur-money ${amtColor} shrink-0 text-right mt-[-2px]`}>{sign}{formatINR(t.amount, isPrivacyMode)}</p></div><div className="flex flex-wrap items-center gap-1.5 min-w-0 text-[9px] sm:text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wide mt-1.5"><span className="shrink-0">{formatDateShort(t.date)}</span><span className="w-1 h-1 rounded-full bg-slate-300 dark:bg-slate-600 shrink-0"></span><span className="truncate max-w-[140px]">{isTRF ? `${t.account} ➔ ${t.transfer_to}` : t.account}</span>{t.category && <span className={`px-1.5 py-0.5 rounded-md truncate max-w-[120px] shrink-0 ${badgeClass}`}>{t.category}</span>}</div>{t.notes && <p className="text-[11px] text-slate-500 dark:text-slate-400 font-medium break-words text-wrap leading-snug mt-1.5 pr-2">{t.notes}</p>}{txTags.length > 0 && (<div className="flex flex-wrap gap-1.5 mt-2">{txTags.map((tag, idx) => <span key={idx} className="text-[9px] font-extrabold text-brand-teal bg-brand-teal/10 border border-brand-teal/20 px-1.5 py-0.5 rounded-md">{tag}</span>)}</div>)}</div><div className="flex flex-col items-end shrink-0 gap-2 ml-1"><div className="flex items-center gap-1"><button onClick={() => handleOpenEditTxn(t)} className="p-1.5 text-slate-400 hover:text-brand-teal bg-slate-100 dark:bg-slate-800 rounded-lg transition-colors"><EditPencil c="w-3.5 h-3.5" /></button><button onClick={() => setDeleteModalId(t.row_index)} className="p-1.5 text-slate-400 hover:text-brand-expense bg-slate-100 dark:bg-slate-800 rounded-lg transition-colors"><Trash2 c="w-3.5 h-3.5" /></button></div></div></div>
                                           <div className="hidden lg:grid grid-cols-[2.5rem_6rem_12rem_8rem_1fr_10rem_5rem] gap-4 px-6 py-4 items-center hover:bg-slate-50 dark:hover:bg-slate-800/30 transition-colors"><div className="flex items-center justify-center"><input type="checkbox" checked={selectedRows.includes(t.row_index)} onChange={() => handleSelectRow(t.row_index)} className="custom-check" /></div><div className="text-xs font-bold text-slate-500 dark:text-slate-400">{formatDateStr(t.date)}</div><div className="flex flex-col items-start justify-center min-w-0 pr-2">{t.category && <span className={`text-[10px] font-bold px-2 py-1 rounded-lg truncate max-w-full ${badgeClass}`}>{t.category}</span>}</div><div className={`text-right text-sm font-black blur-money ${amtColor}`}>{sign}{formatINR(t.amount, isPrivacyMode)}</div><div className="flex flex-col min-w-0 px-4"><span className="text-sm font-extrabold truncate">{t.description}</span>{t.notes && <span className="text-[10px] text-slate-500 dark:text-slate-400 font-medium truncate mt-0.5">{t.notes}</span>}{txTags.length > 0 && <span className="text-[10px] text-brand-teal font-bold truncate mt-0.5">{txTags.join(' ')}</span>}</div><div className="text-xs font-bold text-slate-600 dark:text-slate-400 truncate flex items-center gap-1.5">{isTRF ? <Repeat c="w-3 h-3 text-slate-400 shrink-0"/> : <Wallet c="w-3 h-3 text-slate-400 shrink-0"/>}<span className="truncate">{isTRF ? `${t.account} ➔ ${t.transfer_to}` : t.account}</span></div><div className="flex items-center justify-end gap-2 opacity-0 group-hover:opacity-100 transition-opacity"><button onClick={() => handleOpenEditTxn(t)} className="p-1.5 text-slate-400 hover:text-brand-teal bg-white dark:bg-brand-bgDark border border-slate-200 dark:border-slate-700 shadow-sm hover:bg-slate-50 dark:hover:bg-slate-800 rounded-lg"><EditPencil c="w-3.5 h-3.5" /></button><button onClick={() => setDeleteModalId(t.row_index)} className="p-1.5 text-slate-400 hover:text-brand-expense bg-white dark:bg-brand-bgDark border border-slate-200 dark:border-slate-700 shadow-sm hover:bg-rose-50 dark:hover:bg-rose-500/10 rounded-lg"><Trash2 c="w-3.5 h-3.5" /></button></div></div>
                                        </div>
                                      );
                                   })}
                                 </div>
                              )}
                           </div>
                         );
                      })}
                    </div>
                  )}
                </div>
              )}

              {activeTab === 'settings' && <SettingsView appData={appData} onSave={setAppData} appPin={appData.appPin} autoLockTime={appData.autoLockTime} setIsBackgroundSyncing={setIsBackgroundSyncing} />}

            </div>
          </main>

          {/* Centered Bulk Edit Bar */}
          {selectedRows.length > 0 && activeTab === 'ledger' && (
             <div className="fixed bottom-[88px] md:bottom-8 left-4 right-4 md:left-1/2 md:right-auto md:-translate-x-1/2 md:w-max z-50 animate-slide-up mx-auto">
                <div className="bg-white dark:bg-brand-sidebar shadow-[0_8px_30px_rgba(0,0,0,0.2)] dark:shadow-[0_20px_40px_rgba(0,0,0,0.5)] rounded-2xl border border-slate-200 dark:border-slate-700/50 flex flex-row items-center p-2 relative">
                   <div className="flex items-center gap-3 px-3 py-1.5 md:py-2 border-r border-slate-200 dark:border-slate-700/50"><span className="text-xs font-bold text-slate-700 dark:text-slate-300 whitespace-nowrap">{selectedRows.length} selected</span><span className="text-slate-900 dark:text-white font-black text-sm blur-money">{formatINR(Math.abs(selectedSum), isPrivacyMode)}</span></div>
                   <div className="flex md:hidden items-center gap-1 pl-2"><button onClick={() => setIsActionsMenuOpen(!isActionsMenuOpen)} className="px-3 py-2 text-xs font-bold text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg flex items-center gap-1.5"><span className="text-[10px]">•••</span> Actions</button><button onClick={() => setBulkModal({isOpen: true, action: 'DELETE'})} className="p-2 text-brand-expense hover:bg-rose-50 dark:hover:bg-rose-500/10 rounded-lg"><Trash2 c="w-4 h-4"/></button></div>
                   <div className="hidden md:flex items-center gap-1 pl-2 pr-2">
                       <button disabled={!canRecategorize} onClick={() => {if(canRecategorize) setBulkModal({isOpen: true, action: 'CATEGORY'});}} className={`px-3 py-2 text-xs font-bold rounded-lg flex items-center gap-1.5 ${!canRecategorize ? 'text-slate-400 opacity-40 cursor-not-allowed' : 'text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'}`}><TagIcon c="w-3.5 h-3.5"/> Re-categorize</button>
                       <button onClick={() => setBulkModal({isOpen: true, action: 'TAGS'})} className="px-3 py-2 text-xs font-bold text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg flex items-center gap-1.5"><TagIcon c="w-3.5 h-3.5"/> Add Tags</button>
                       <button onClick={() => setBulkModal({isOpen: true, action: 'DESC'})} className="px-3 py-2 text-xs font-bold text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg flex items-center gap-1.5"><EditPencil c="w-3.5 h-3.5"/> Description</button>
                       <button onClick={() => setBulkModal({isOpen: true, action: 'DELETE'})} className="px-3 py-2 text-xs font-bold text-brand-expense hover:bg-rose-50 dark:hover:bg-rose-500/10 rounded-lg flex items-center gap-1.5"><Trash2 c="w-3.5 h-3.5"/> Delete</button>
                   </div>
                   <button onClick={() => setSelectedRows([])} className="ml-auto md:ml-2 p-1.5 text-slate-400 hover:text-slate-700 dark:hover:text-white rounded-full shrink-0"><X c="w-4 h-4"/></button>
                   {isActionsMenuOpen && ( <div className="absolute bottom-[110%] right-10 w-48 bg-white dark:bg-brand-sidebar border border-slate-200 dark:border-slate-700 rounded-xl shadow-2xl overflow-hidden py-1 z-50 animate-fade-in md:hidden"><button disabled={!canRecategorize} onClick={() => { if(canRecategorize) { setIsActionsMenuOpen(false); setBulkModal({isOpen: true, action: 'CATEGORY'}); } }} className={`w-full text-left px-4 py-3 text-xs font-bold flex items-center gap-2 ${!canRecategorize ? 'text-slate-400 opacity-40 cursor-not-allowed' : 'text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800'}`}><TagIcon c="w-4 h-4"/> Re-categorize</button><button onClick={() => { setIsActionsMenuOpen(false); setBulkModal({isOpen: true, action: 'TAGS'}); }} className="w-full text-left px-4 py-3 text-xs font-bold text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 flex items-center gap-2"><TagIcon c="w-4 h-4"/> Add Tags</button><button onClick={() => { setIsActionsMenuOpen(false); setBulkModal({isOpen: true, action: 'DESC'}); }} className="w-full text-left px-4 py-3 text-xs font-bold text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 flex items-center gap-2"><EditPencil c="w-4 h-4"/> Description</button></div> )}
                </div>
             </div>
          )}

          <TransactionModal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} onSave={setAppData} settings={appData.settings} editData={editTxn} allAvailableTags={allAvailableTags} excludedCats={appData.excludedCats || []} setIsBackgroundSyncing={setIsBackgroundSyncing} />
          <BulkActionModal isOpen={bulkModal.isOpen} action={bulkModal.action} count={selectedRows.length} onClose={() => setBulkModal({isOpen: false, action: null})} onConfirm={executeBulkAction} bulkCategoryOptions={bulkCategoryOptions} excludedCats={appData.excludedCats || []} />
          <ConfirmDialog isOpen={deleteModalId !== null} onCancel={() => setDeleteModalId(null)} onConfirm={executeDeleteSingle} title="Delete Transaction" message="Are you sure you want to delete this transaction permanently? This cannot be undone." />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
