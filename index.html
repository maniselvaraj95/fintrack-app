    function InsightsView({ analyticsFiltered, allUniqueCategories, isPrivacy }) {
        const [insightsCategoryFilter, setInsightsCategoryFilter] = useState('All');
        const insightsData = useMemo(() => insightsCategoryFilter === 'All' ? analyticsFiltered : analyticsFiltered.filter(r => r.category === insightsCategoryFilter), [analyticsFiltered, insightsCategoryFilter]);
        const topTags = useMemo(() => { const map = {}; insightsData.forEach(r => { if (r.rawType !== 'EXPENSE') return; extractTags(r.tags).forEach(t => { map[t] = (map[t]||0) + r.amount; }); }); return Object.entries(map).map(([name, total]) => ({name, total})).sort((a,b) => b.total - a.total).slice(0, 10); }, [insightsData]);
        const largestTxns = useMemo(() => [...insightsData].filter(r => r.rawType === 'EXPENSE').sort((a,b) => b.amount - a.amount).slice(0, 5), [insightsData]);
        const frequentPayees = useMemo(() => { const map = {}; insightsData.filter(r => r.rawType === 'EXPENSE').forEach(r => { const desc = String(r.description || 'Unknown'); if (!map[desc]) map[desc] = { name: desc, count: 0, total: 0 }; map[desc].count += 1; map[desc].total += r.amount; }); return Object.values(map).sort((a,b) => b.count - a.count).slice(0, 5); }, [insightsData]);
        const incomeSplitData = useMemo(() => { const map = {}; insightsData.filter(r => r.rawType === 'INCOME').forEach(r => { const cat = String(r.category || 'Uncategorized'); map[cat] = (map[cat]||0) + r.amount; }); const colors = ['#1d8b4e', '#e06c53', '#047857', '#059669', '#10b981']; return Object.entries(map).map(([name, value], idx) => ({ name, value, color: colors[idx % colors.length] })).sort((a,b) => b.value - a.value); }, [insightsData]);
        const expenseTxns = insightsData.filter(r => r.rawType === 'EXPENSE'); const totalExpense = expenseTxns.reduce((a,b) => a + b.amount, 0); const avgExpense = expenseTxns.length > 0 ? totalExpense / expenseTxns.length : 0; const totalIncome = insightsData.filter(r => r.rawType === 'INCOME').reduce((a,b) => a + b.amount, 0);

        return (
            <div className="animate-fade-in space-y-4 sm:space-y-6 max-w-4xl mx-auto pb-8">
                <div className="modern-card p-3 flex flex-col sm:flex-row items-center justify-between gap-3 border border-slate-200 dark:border-slate-800"><span className="text-xs font-extrabold text-slate-800 dark:text-slate-200 pl-3 uppercase tracking-widest">Filter Insights</span><div className="w-full sm:w-64"><SearchableSelect options={['All Categories', ...allUniqueCategories]} value={insightsCategoryFilter === 'All' ? 'All Categories' : insightsCategoryFilter} onChange={(val) => setInsightsCategoryFilter(val === 'All Categories' ? 'All' : val)} placeholder="Search category..." compact={true} /></div></div>
                <div className="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4"><MetricCard title="Transactions" value={isPrivacy ? '......' : insightsData.length} icon={List} type="default" /><MetricCard title="Avg. Expense" value={formatINR(avgExpense, isPrivacy)} icon={Activity} type="expense" /><MetricCard title="Total Income" value={formatINR(totalIncome, isPrivacy)} type="income" /><MetricCard title="Net Change" value={formatINR(totalIncome - totalExpense, isPrivacy)} type="default" /></div>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
                    <div className="modern-card p-6 sm:p-8"><h3 className="text-sm font-black text-slate-800 dark:text-white flex items-center gap-2 mb-6"><TagIcon c="w-5 h-5 text-brand-teal" /> Spending by Tags</h3>{topTags.length === 0 ? <p className="text-xs text-slate-500 font-medium">No tags used.</p> : (<div className="space-y-5">{topTags.map((tag) => { const pct = (tag.total / totalExpense) * 100; return (<div key={tag.name}><div className="flex justify-between items-center mb-1.5"><span className="text-xs font-extrabold text-brand-teal dark:text-teal-300 bg-teal-50 dark:bg-teal-900/30 border border-teal-100 dark:border-teal-800 px-2 py-0.5 rounded-md">{tag.name}</span><div className="text-right"><span className="text-xs font-black text-slate-900 dark:text-white blur-money">{formatINR(tag.total, isPrivacy)}</span></div></div><div className="w-full h-1.5 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden"><div className="h-full bg-brand-teal rounded-full" style={{width: `${(tag.total / topTags[0].total) * 100}%`}}></div></div></div>) })}</div>)}</div>
                    <div className="modern-card p-6 sm:p-8"><h3 className="text-sm font-black text-slate-800 dark:text-white flex items-center gap-2 mb-6"><Repeat c="w-5 h-5 text-[#f59e0b]" /> Most Frequent Payees</h3><div className="divide-y divide-slate-50 dark:divide-slate-800">{frequentPayees.length === 0 ? <p className="text-xs text-slate-500 font-medium">No payees found.</p> : (frequentPayees.map((t, idx) => { return(<div key={idx} className="py-3.5 flex justify-between items-center"><div className="min-w-0 pr-4"><p className="text-sm font-extrabold text-slate-800 dark:text-slate-100 truncate">{t.name}</p></div><div className="text-right shrink-0"><p className="text-xs font-black text-slate-800 dark:text-slate-200 blur-money">{isPrivacy ? '......' : t.count + 'x'}</p><p className="text-[10px] font-bold text-slate-400 blur-money">{formatINR(t.total, isPrivacy)} total</p></div></div>) }))}</div></div>
                    <div className="modern-card p-6 sm:p-8"><h3 className="text-sm font-black text-slate-800 dark:text-white flex items-center gap-2 mb-6"><ArrowUpRight c="w-5 h-5 text-brand-expense"/> Largest Single Expenses</h3><div className="divide-y divide-slate-50 dark:divide-slate-800">{largestTxns.length === 0 ? <p className="text-xs text-slate-500 font-medium">No expenses found.</p> : (largestTxns.map((t, idx) => { return(<div key={idx} className="py-3.5 flex justify-between items-center"><div className="min-w-0 pr-4"><p className="text-sm font-extrabold text-slate-800 dark:text-slate-100 truncate mb-1">{t.description}</p><div className="flex items-center gap-2 text-[10px] font-bold text-slate-400 uppercase tracking-widest"><span>{formatDateStr(t.date)}</span></div></div><div className="text-right shrink-0"><p className="text-sm font-black text-brand-expense blur-money">-{formatINR(t.amount, isPrivacy)}</p></div></div>) }))}</div></div>
                    <div className="modern-card p-6 sm:p-8"><h3 className="text-sm font-black text-slate-800 dark:text-white flex items-center gap-2 mb-6"><ArrowDownRight c="w-5 h-5 text-brand-income"/> Income Sources</h3>{incomeSplitData.length === 0 ? <p className="text-xs text-slate-500 font-medium">No income found.</p> : (<div className="space-y-5">{incomeSplitData.map((inc) => { const pct = (inc.value / totalIncome) * 100; return (<div key={inc.name}><div className="flex justify-between items-center mb-1.5"><div className="flex items-center gap-2"><div className="w-2.5 h-2.5 rounded-sm" style={{backgroundColor: inc.color}}></div><span className="text-xs font-bold text-slate-700 dark:text-slate-300">{inc.name}</span></div><div className="text-right"><span className="text-xs font-black text-slate-900 dark:text-white blur-money">{formatINR(inc.value, isPrivacy)}</span></div></div><div className="w-full h-1.5 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden"><div className="h-full bg-brand-income rounded-full" style={{width: `${pct}%`, backgroundColor: inc.color}}></div></div></div>) })}</div>)}</div>
                </div>
            </div>
        );
    }

    function TransactionModal({ isOpen, onClose, onSave, settings, editData, allAvailableTags, setIsBackgroundSyncing }) {
      const [type, setType] = useState('EXPENSE');
      const [date, setDate] = useState('');
      const [amount, setAmount] = useState('');
      const [description, setDescription] = useState('');
      const [category, setCategory] = useState('');
      const [account, setAccount] = useState('');
      const [transferTo, setTransferTo] = useState('');
      const [tags, setTags] = useState('');
      const [notes, setNotes] = useState('');
      const [errorMsg, setErrorMsg] = useState('');

      const safeIncomeCats = settings?.incomeCats||[];
      const safeExpenseCats = settings?.expenseCats||[];
      const safeAccounts = settings?.accounts||[];

      useEffect(() => {
        if (editData) {
          setType(editData.rawType||'EXPENSE');
          setDate(editData.date||new Date().toISOString().split('T')[0]);
          setAmount(editData.amount||'');
          setDescription(editData.description?String(editData.description):'');
          setCategory(editData.category||'');
          setAccount(editData.account||'');
          setTransferTo(editData.transfer_to||'');
          setTags(editData.tags||'');
          setNotes(editData.notes||'');
        } else {
          setType('EXPENSE');
          setDate(new Date().toISOString().split('T')[0]);
          setAmount('');
          setDescription('');
          setCategory('');
          setAccount('');
          setTransferTo('');
          setTags('');
          setNotes('');
        }
        setErrorMsg('');
      }, [editData, isOpen, settings]);

      if (!isOpen) return null;

      const handleSubmit = (e) => {
        e.preventDefault(); 
        if (!String(description).trim()) return setErrorMsg("Please enter a description.");
        if (!amount || parseFloat(amount) <= 0) return setErrorMsg("Please enter a valid amount.");
        if (!category) return setErrorMsg("Please select a Category.");
        if (!account) return setErrorMsg("Please select an Account.");
        if (type === 'TRANSFER' && (!transferTo || account === transferTo)) return setErrorMsg("Please select a valid Transfer Target.");
        setErrorMsg(""); 

        const payload = { row_index: editData ? editData.row_index : null, date, type, amount, description, category, account, transfer_to: transferTo, tags, notes };
        onSave(prev => {
            const newTxns = [...prev.transactions]; const fakeId = editData ? editData.row_index : 'temp_' + Date.now();
            const opt = { ...payload, row_index: fakeId, amount: parseFloat(amount) };
            if (editData) { const idx = newTxns.findIndex(t => t.row_index === editData.row_index); if (idx > -1) newTxns[idx] = opt; } else { newTxns.unshift(opt); }
            return { ...prev, transactions: newTxns };
        });
        
        setIsBackgroundSyncing(true);
        onClose();
        apiCall('SAVE_TRANSACTION', { data: payload }).then(res => {
            onSave(res);
            setIsBackgroundSyncing(false);
        }).catch(e => {
            console.error(e);
            setIsBackgroundSyncing(false);
            alert("Save failed: " + e.message);
        });
      };

      const appendTag = (t) => { const cur = extractTags(tags); if(!cur.includes(t)) setTags([...cur, t].join(', ')); };
      const catOptions = type === 'INCOME' ? safeIncomeCats : (type === 'EXPENSE' ? safeExpenseCats : ['TRANSFER']);

      return (
        <div className="fixed inset-0 z-[70] flex items-end sm:items-center justify-center p-0 sm:p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">
          <div className="bg-white dark:bg-brand-cardDark rounded-t-[2rem] sm:rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl animate-slide-up flex flex-col max-h-[90vh] border border-slate-100 dark:border-slate-800">
            <div className="flex items-center justify-between p-5 border-b border-slate-100 dark:border-slate-800"><h2 className="text-lg font-black text-slate-800 dark:text-white">{editData ? 'Edit Transaction' : 'Add transaction'}</h2><button onClick={onClose} className="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"><X c="w-4 h-4"/></button></div>
            <div className="p-5 overflow-y-auto hide-scrollbar">
              <div className="flex p-1 mb-6 bg-[#f0f2f5] dark:bg-slate-800 rounded-full shadow-sm"><button onClick={()=>setType('EXPENSE')} className={`flex-1 py-2.5 text-xs font-bold rounded-full transition-all ${type==='EXPENSE'?'bg-brand-expense text-white':'text-slate-500'}`}>Expense</button><button onClick={()=>setType('INCOME')} className={`flex-1 py-2.5 text-xs font-bold rounded-full transition-all ${type==='INCOME'?'bg-brand-income text-white':'text-slate-500'}`}>Income</button><button onClick={()=>setType('TRANSFER')} className={`flex-1 py-2.5 text-xs font-bold rounded-full transition-all ${type==='TRANSFER'?'bg-brand-transfer text-white':'text-slate-500'}`}>Transfer</button></div>
              {errorMsg && <div className="mb-6 p-3 bg-brand-expense/10 text-brand-expense rounded-full flex items-center gap-3 text-xs font-bold"><div className="w-5 h-5 rounded-full bg-brand-expense text-white flex items-center justify-center shrink-0">!</div>{errorMsg}</div>}
              <form id="txnForm" onSubmit={handleSubmit} className="space-y-4">
                <div><label className="block text-[10px] font-bold text-slate-800 dark:text-slate-200 mb-1.5">Description</label><input type="text" placeholder="Example: Daily Food" value={description} onChange={e=>setDescription(e.target.value)} autoComplete="new-password" spellCheck="false" autoCorrect="off" className="w-full bg-white dark:bg-brand-bgDark border border-slate-200 dark:border-slate-700 rounded-full px-4 py-2.5 text-sm font-bold outline-none dark:text-white" /></div>
                <div className="flex gap-4"><div className="flex-1"><label className="block text-[10px] font-bold text-slate-800 dark:text-slate-200 mb-1.5">Amount</label><input type="number" step="0.01" value={amount} onChange={e=>setAmount(e.target.value)} className="w-full bg-white dark:bg-brand-bgDark border border-slate-200 dark:border-slate-700 rounded-full px-4 py-2.5 text-sm font-bold outline-none dark:text-white" /></div><div className="flex-1"><label className="block text-[10px] font-bold text-slate-800 dark:text-slate-200 mb-1.5">Date</label><input type="date" value={date} onChange={e=>setDate(e.target.value)} className="w-full bg-white dark:bg-brand-bgDark border border-slate-200 dark:border-slate-700 rounded-full px-4 py-2.5 text-sm font-bold outline-none dark:text-white" /></div></div>
                <div className="flex gap-4"><div className="flex-1"><label className="block text-[10px] font-bold text-slate-800 dark:text-slate-200 mb-1.5">Category</label><SearchableSelect options={catOptions} value={category} onChange={setCategory} placeholder="Select..." compact={true} /></div><div className="flex-1"><label className="block text-[10px] font-bold text-slate-800 dark:text-slate-200 mb-1.5">{type==='INCOME'?'To Account':'Account'}</label><SearchableSelect options={safeAccounts} value={account} onChange={setAccount} placeholder="Select..." compact={true} /></div></div>
                {type === 'TRANSFER' && <div className="animate-fade-in"><label className="block text-[10px] font-bold text-slate-800 dark:text-slate-200 mb-1.5">Transfer To</label><SearchableSelect options={safeAccounts} value={transferTo} onChange={setTransferTo} placeholder="Select target..." compact={true} /></div>}
                <div>
                  <label className="block text-[10px] font-bold text-slate-800 dark:text-slate-200 mb-1.5">Tags</label><input type="text" placeholder="#paycheck" value={tags} onChange={e=>setTags(e.target.value)} autoComplete="new-password" spellCheck="false" autoCorrect="off" className="w-full bg-white dark:bg-brand-bgDark border border-slate-200 dark:border-slate-700 rounded-full px-4 py-2.5 text-sm font-bold outline-none dark:text-white mb-1" />
                  {allAvailableTags.length > 0 && <div className="flex flex-wrap gap-2 mt-2">{allAvailableTags.map(t => <button key={t} type="button" onClick={()=>appendTag(t)} className="px-3 py-1.5 bg-slate-100 dark:bg-slate-800 rounded-full text-[10px] font-bold">{t}</button>)}</div>}
                  <label className="block text-[10px] font-bold text-slate-800 dark:text-slate-200 mb-1.5 mt-5">Notes</label><textarea placeholder="Optional note" value={notes} onChange={e=>setNotes(e.target.value)} autoComplete="new-password" spellCheck="false" autoCorrect="off" className="w-full h-20 bg-white dark:bg-brand-bgDark border border-slate-200 dark:border-slate-700 rounded-2xl px-4 py-3 text-sm font-bold outline-none dark:text-white resize-none"></textarea>
                </div>
              </form>
            </div>
            <div className="p-4 sm:p-5 border-t border-slate-100 dark:border-slate-800 flex gap-3 justify-end"><button onClick={onClose} className="px-6 py-2.5 rounded-full font-bold text-sm bg-white dark:bg-brand-cardDark border border-slate-200 dark:border-slate-700">Cancel</button><button form="txnForm" type="submit" className="px-6 py-2.5 rounded-full font-bold text-sm text-white bg-brand-teal">{editData ? 'Update' : 'Save'}</button></div>
          </div>
        </div>
      );
    }

    function SettingsView({ appData, onSave, appPin, autoLockTime, setIsBackgroundSyncing }) {
      const safeIncomeCats = appData?.settings?.incomeCats||[];
      const safeExpenseCats = appData?.settings?.expenseCats||[];
      const safeAccounts = appData?.settings?.accounts||[];
      const [exCats, setExCats] = useState(appData.excludedCats||[]);
      const [bals, setBals] = useState(appData.balances||[]);
      const [incCats, setIncCats] = useState(safeIncomeCats);
      const [expCats, setExpCats] = useState(safeExpenseCats);
      const [pin, setPin] = useState(appPin||'');
      const [showPin, setShowPin] = useState(false);
      const [lockTime, setLockTime] = useState(autoLockTime||'0');
      const [saving, setSaving] = useState(false);
      const [saveError, setSaveError] = useState('');

      const [snapshotDate, setSnapshotDate] = useState(() => {
         if (appData.balances && appData.balances.length > 0) {
             const latest = [...appData.balances].sort((a,b) => parseDateLocal(b.date) - parseDateLocal(a.date))[0];
             if (latest && latest.date) return latest.date;
         }
         return new Date().toISOString().split('T')[0];
      });

      useEffect(() => {
        setIncCats(appData?.settings?.incomeCats||[]);
        setExpCats(appData?.settings?.expenseCats||[]);
        setExCats(appData.excludedCats||[]);
        setBals(appData.balances||[]);
      }, [appData]);

      const handleSave = () => {
         if (pin.length > 0 && (pin.length < 4 || pin.length > 8)) {
             setSaveError("PIN must be between 4 and 8 digits.");
             return;
         }
         setSaveError('');
         setSaving(true);
         setIsBackgroundSyncing(true);
         
         const renames = [];
         incCats.forEach((nC, i) => { const oC = safeIncomeCats[i]; if(oC && oC!==nC && nC.trim()!=='') renames.push({old:oC, new:nC}); });
         expCats.forEach((nC, i) => { const oC = safeExpenseCats[i]; if(oC && oC!==nC && nC.trim()!=='') renames.push({old:oC, new:nC}); });
         
         const payload = { excludedCats: exCats, balances: bals, incomeCats: incCats.filter(c=>c.trim()!==''), expenseCats: expCats.filter(c=>c.trim()!==''), categoryRenames: renames, appPin: pin, autoLockTime: lockTime };
         
         // Optimistic Update - Do not overwrite with stale API response
         onSave(prev => {
             let updatedTxns = [...prev.transactions];
             renames.forEach(r => {
                 updatedTxns = updatedTxns.map(t => t.category === r.old ? { ...t, category: r.new } : t);
             });
             return {
                 ...prev,
                 transactions: updatedTxns,
                 settings: {
                     ...prev.settings,
                     incomeCats: payload.incomeCats,
                     expenseCats: payload.expenseCats
                 },
                 balances: payload.balances,
                 excludedCats: payload.excludedCats,
                 appPin: payload.appPin,
                 autoLockTime: payload.autoLockTime
             };
         });

         apiCall('SAVE_SETTINGS', { payload }).then(() => {
             setSaving(false);
             setIsBackgroundSyncing(false);
         }).catch(e => {
             console.error(e);
             setSaving(false);
             setIsBackgroundSyncing(false);
             alert("Settings save failed. Please check your connection.");
         });
      };

      return (
         <div className="animate-fade-in space-y-6 max-w-4xl mx-auto pb-8">
            <div className="modern-card p-6 sm:p-8">
               <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-4 mb-6 border-b border-slate-100 dark:border-slate-800 pb-5"><div><h3 className="text-xl font-extrabold">System Settings</h3></div><button onClick={handleSave} disabled={saving} className="bg-brand-teal text-white font-bold py-2.5 px-6 rounded-full text-sm shadow-sm">{saving ? 'Saving...' : 'Save Configuration'}</button></div>
               {saveError && <div className="mb-6 p-3 bg-rose-50 text-brand-expense rounded-full text-xs font-bold text-center border border-rose-100">{saveError}</div>}
               <h4 className="text-sm font-bold mb-4">Account Snapshots</h4>
               <div className="mb-6 bg-slate-50 dark:bg-brand-bgDark border border-slate-100 dark:border-slate-800 p-5 rounded-3xl"><label className="block text-[11px] font-bold mb-1">Global Snapshot Date</label><input type="date" value={snapshotDate} onChange={e=>setSnapshotDate(e.target.value)} className="w-full sm:w-64 bg-white dark:bg-brand-cardDark border border-slate-200 dark:border-slate-700 rounded-full px-4 py-2.5 text-sm font-semibold outline-none" /></div>
               <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-10">{safeAccounts.map(acc => { 
                   const ex = bals.find(b => b.account === acc && b.date === snapshotDate) || { balance: '' }; 
                   return (
                     <div key={acc} className="p-5 bg-slate-50 dark:bg-brand-bgDark rounded-3xl border border-slate-100 dark:border-slate-800"><h4 className="font-bold text-sm mb-3 truncate">{acc}</h4><input type="number" step="0.01" value={ex.balance} onChange={e => {
                         const val = parseFloat(e.target.value);
                         const isNaNVal = isNaN(val);
                         setBals(prev => {
                             const existing = prev.find(b => b.account === acc && b.date === snapshotDate);
                             if (existing) {
                                 return prev.map(b => (b.account === acc && b.date === snapshotDate) ? { ...b, balance: isNaNVal ? '' : val } : b);
                             } else {
                                 return [...prev, { account: acc, date: snapshotDate, balance: isNaNVal ? '' : val }];
                             }
                         });
                     }} className="w-full bg-white dark:bg-brand-cardDark border border-slate-200 dark:border-slate-700 rounded-full px-4 py-2.5 text-sm font-bold outline-none" /></div>
                   ) 
               })}</div>
               
               <div className="border-t border-slate-100 dark:border-slate-800 pt-6 mt-8">
                   <h3 className="text-xl font-extrabold mb-4">Security</h3>
                   <div className="grid grid-cols-1 md:grid-cols-2 gap-8 mb-10">
                       <div className="bg-slate-50 dark:bg-brand-bgDark rounded-3xl p-5 border border-slate-100 dark:border-slate-800"><label className="block text-[11px] font-bold mb-2">App Access PIN</label><div className="flex gap-3"><input type="text" inputMode="numeric" pattern="[0-9]*" maxLength="8" placeholder="Leave blank to disable" value={pin} onChange={(e)=>setPin(e.target.value.replace(/[^0-9]/g,''))} autoComplete="new-password" spellCheck="false" autoCorrect="off" className={`flex-1 bg-white dark:bg-brand-cardDark border border-slate-200 dark:border-slate-700 rounded-full px-4 py-2.5 text-sm font-bold tracking-widest outline-none ${!showPin && pin ? 'pin-input' : ''}`}/><button onClick={()=>setShowPin(!showPin)} className="p-3 bg-white dark:bg-brand-cardDark border border-slate-200 dark:border-slate-700 rounded-full aspect-square flex items-center justify-center">{showPin?<EyeOff c="w-4 h-4"/>:<Eye c="w-4 h-4"/>}</button></div></div>
                       <div className="bg-slate-50 dark:bg-brand-bgDark rounded-3xl p-5 border border-slate-100 dark:border-slate-800"><label className="block text-[11px] font-bold mb-2">Auto-Lock Timer</label><select value={lockTime} onChange={(e)=>setLockTime(e.target.value)} className="w-full bg-white dark:bg-brand-cardDark border border-slate-200 dark:border-slate-700 rounded-full px-4 py-3 text-sm font-bold outline-none"><option value="0">Never</option><option value="1">1 minute</option><option value="5">5 minutes</option><option value="15">15 minutes</option><option value="30">30 minutes</option></select></div>
                   </div>
               </div>

               <div className="border-t border-slate-100 dark:border-slate-800 pt-6">
                   <h3 className="text-xl font-extrabold mb-4">Categories</h3>
                   <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                      <div className="bg-slate-50 dark:bg-brand-bgDark rounded-3xl p-5 border border-slate-100 dark:border-slate-800"><h4 className="text-xs font-bold mb-4 uppercase tracking-widest">Income Categories</h4><div className="space-y-2">{incCats.map((c, i) => { const isEx = exCats.includes(c); return (<div key={i} className="flex justify-between items-center p-1.5 pl-4 bg-white dark:bg-brand-cardDark rounded-full shadow-sm border border-slate-100 dark:border-slate-700"><input value={c} onChange={(e)=>{const n=[...incCats];n[i]=e.target.value;setIncCats(n);}} autoComplete="new-password" spellCheck="false" autoCorrect="off" className={`flex-1 min-w-0 bg-transparent outline-none text-sm font-bold px-2 ${isEx?'line-through opacity-50':''}`} /><div className="flex gap-3"><div onClick={()=>setExCats(isEx?exCats.filter(x=>x!==c):[...exCats,c])} className={`w-11 h-6 flex items-center rounded-full p-1 cursor-pointer transition-colors ${!isEx?'bg-brand-teal':'bg-slate-300 dark:bg-slate-700'}`}><div className={`bg-white w-4 h-4 rounded-full transition-transform ${!isEx?'translate-x-5':''}`}></div></div><button onClick={()=>setIncCats(incCats.filter((_,x)=>x!==i))} className="text-slate-300 hover:text-brand-expense p-1"><Trash2 c="w-4 h-4"/></button></div></div>) })}</div><button onClick={()=>setIncCats([...incCats,'New Income'])} className="w-full mt-4 text-brand-teal font-bold py-2.5 rounded-full text-xs uppercase border border-slate-200 dark:border-slate-700 bg-white dark:bg-brand-cardDark hover:bg-slate-50">Add Income Category</button></div>
                      <div className="bg-slate-50 dark:bg-brand-bgDark rounded-3xl p-5 border border-slate-100 dark:border-slate-800"><h4 className="text-xs font-bold mb-4 uppercase tracking-widest">Expense Categories</h4><div className="space-y-2">{expCats.map((c, i) => { const isEx = exCats.includes(c); return (<div key={i} className="flex justify-between items-center p-1.5 pl-4 bg-white dark:bg-brand-cardDark rounded-full shadow-sm border border-slate-100 dark:border-slate-700"><input value={c} onChange={(e)=>{const n=[...expCats];n[i]=e.target.value;setExpCats(n);}} autoComplete="new-password" spellCheck="false" autoCorrect="off" className={`flex-1 min-w-0 bg-transparent outline-none text-sm font-bold px-2 ${isEx?'line-through opacity-50':''}`} /><div className="flex gap-3"><div onClick={()=>setExCats(isEx?exCats.filter(x=>x!==c):[...exCats,c])} className={`w-11 h-6 flex items-center rounded-full p-1 cursor-pointer transition-colors ${!isEx?'bg-brand-teal':'bg-slate-300 dark:bg-slate-700'}`}><div className={`bg-white w-4 h-4 rounded-full transition-transform ${!isEx?'translate-x-5':''}`}></div></div><button onClick={()=>setExpCats(expCats.filter((_,x)=>x!==i))} className="text-slate-300 hover:text-brand-expense p-1"><Trash2 c="w-4 h-4"/></button></div></div>) })}</div><button onClick={()=>setExpCats([...expCats,'New Expense'])} className="w-full mt-4 text-brand-teal font-bold py-2.5 rounded-full text-xs uppercase border border-slate-200 dark:border-slate-700 bg-white dark:bg-brand-cardDark hover:bg-slate-50">Add Expense Category</button></div>
                   </div>
               </div>

               <div className="border-t border-slate-100 dark:border-slate-800 pt-6 mt-8"><h3 className="text-xl font-extrabold mb-4 text-rose-600 dark:text-rose-500">Danger Zone</h3><div className="bg-rose-50 dark:bg-rose-500/10 rounded-3xl p-5 border border-rose-100 dark:border-rose-500/20 flex flex-col sm:flex-row justify-between sm:items-center gap-4"><div><h4 className="text-[11px] font-bold text-rose-800 dark:text-rose-200 uppercase tracking-wider mb-1">Disconnect App</h4><p className="text-xs text-rose-600 dark:text-rose-300 font-medium">Remove API keys and clear local cache from this device.</p></div><button onClick={()=>{if(window.confirm("Disconnect and clear all local data?")){try{localStorage.removeItem('API_URL');localStorage.removeItem('API_KEY');localStorage.removeItem('finTrackerCache');}catch(e){}window.location.reload();}}} className="bg-white dark:bg-brand-cardDark text-brand-expense font-bold py-2.5 px-6 rounded-full text-sm border border-rose-200 dark:border-rose-800 shadow-sm whitespace-nowrap">Disconnect</button></div></div>

            </div>
         </div>
      );
    }

    function BulkActionModal({ isOpen, action, count, onClose, onConfirm, allCategories }) {
      const [val, setVal] = useState('');
      
      useEffect(() => {
        if (!isOpen) setVal('');
      }, [isOpen]);

      if (!isOpen) return null;

      const handleSubmit = (e) => {
        e.preventDefault();
        if (action === 'CATEGORY' && !val) return alert("Select Category");
        let up = {};
        if (action === 'CATEGORY') up.category = val;
        if (action === 'TAGS') up.tags = val;
        if (action === 'DESC') up.description = val;
        onConfirm(up);
      };

      let t = "", l = "", inp = null;
      if (action === 'CATEGORY') {
        t = "Recategorise"; l = "Select new category:";
        inp = <SearchableSelect options={allCategories} value={val} onChange={setVal} placeholder="Select..." />;
      } else if (action === 'TAGS') {
        t = "Overwrite Tags"; l = "Enter new tags:";
        inp = <input type="text" placeholder="#vacation" value={val} onChange={e=>setVal(e.target.value)} autoComplete="new-password" spellCheck="false" autoCorrect="off" className="w-full bg-white dark:bg-brand-bgDark border border-slate-200 dark:border-slate-700 rounded-full px-4 py-2.5 text-sm font-bold outline-none" />;
      } else if (action === 'DESC') {
        t = "Redescribe"; l = "Enter description:";
        inp = <input type="text" placeholder="e.g. Swiggy" value={val} onChange={e=>setVal(e.target.value)} autoComplete="new-password" spellCheck="false" autoCorrect="off" className="w-full bg-white dark:bg-brand-bgDark border border-slate-200 dark:border-slate-700 rounded-full px-4 py-2.5 text-sm font-bold outline-none" />;
      }

      return (
        <div className="fixed inset-0 z-[80] flex items-end sm:items-center justify-center p-0 sm:p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">
           <div className="bg-white dark:bg-brand-cardDark rounded-t-[2rem] sm:rounded-[2rem] w-full max-w-sm overflow-hidden shadow-xl animate-slide-up pb-6 sm:pb-0 border border-slate-100 dark:border-slate-800">
              <div className="p-5 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center"><h2 className="text-base font-black">{t}</h2><button onClick={onClose} className="p-1.5 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800"><X c="w-5 h-5 text-slate-500"/></button></div>
              <form onSubmit={handleSubmit} className="p-6 bg-slate-50 dark:bg-brand-bgDark">
                 <p className="text-[11px] text-slate-500 font-bold mb-4 uppercase tracking-widest">{l}</p>{inp}
                 <div className="mt-8 flex gap-3"><button type="button" onClick={onClose} className="flex-1 py-3 rounded-full font-bold bg-white dark:bg-brand-cardDark border border-slate-200 dark:border-slate-700">Cancel</button><button type="submit" className="flex-1 py-3 rounded-full font-black text-white bg-brand-teal">Apply</button></div>
              </form>
           </div>
        </div>
      );
    }

    function App() {
      const [appData, setAppData] = useState({ transactions: [], settings: { incomeCats: [], expenseCats: [], accounts: [] }, balances: [], excludedCats: [], appPin: '', autoLockTime: '0' });
      const [isLoading, setIsLoading] = useState(true);
      const [isBackgroundSyncing, setIsBackgroundSyncing] = useState(false);
      const [activeTab, setActiveTab] = useState('overview');
      const [period, setPeriod] = useState('This Month');
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editTxn, setEditTxn] = useState(null); 
      const [searchQ, setSearchQ] = useState('');
      const [ledgerCategoryFilter, setLedgerCategoryFilter] = useState('All');
      const [ledgerAccountFilter, setLedgerAccountFilter] = useState('All');
      const [ledgerTagFilter, setLedgerTagFilter] = useState(null);
      const [ledgerTypeFilter, setLedgerTypeFilter] = useState('ALL'); 
      const [analyticsCategory, setAnalyticsCategory] = useState('All Categories');
      const [selectedRows, setSelectedRows] = useState([]);
      const [bulkModal, setBulkModal] = useState({ isOpen: false, action: null });
      const [deleteModalId, setDeleteModalId] = useState(null); 
      const [balancesExpanded, setBalancesExpanded] = useState(false);
      const [customFrom, setCustomFrom] = useState('');
      const [customTo, setCustomTo] = useState('');
      const [expandedGroups, setExpandedGroups] = useState({});
      const [isActionsMenuOpen, setIsActionsMenuOpen] = useState(false);
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [sortConfig, setSortConfig] = useState({ key: 'date', direction: 'desc' });
      const [isSetupComplete, setIsSetupComplete] = useState(!!(GLOBAL_API_URL && GLOBAL_API_KEY));
      
      const [isDarkMode, setIsDarkMode] = useState(() => { try { return localStorage.getItem('theme') === 'dark'; } catch(e) { return false; } });
      const [isPrivacyMode, setIsPrivacyMode] = useState(() => { try { const s = localStorage.getItem('privacyMode'); return s !== null ? s === 'true' : true; } catch(e) { return true; } });

      // Mobile Delayed Tooltip System with Screen Clamp
      const [mobileTooltip, setMobileTooltip] = useState({ text: '', x: 0, y: 0, visible: false, pos: 'top' });
      const touchShowTimer = useRef(null);
      const touchHideTimer = useRef(null);

      const handleTouchStart = (text, e, pos = 'top') => {
        if (touchHideTimer.current) clearTimeout(touchHideTimer.current);
        const touch = e.touches[0];
        let clampX = touch.clientX;
        if (clampX < 60) clampX = 60;
        if (clampX > window.innerWidth - 60) clampX = window.innerWidth - 60;
        
        touchShowTimer.current = setTimeout(() => {
          setMobileTooltip({ text, x: clampX, y: pos === 'top' ? touch.clientY - 55 : touch.clientY + 45, visible: true, pos });
        }, 400);
      };

      const handleTouchEnd = () => {
        if (touchShowTimer.current) {
          clearTimeout(touchShowTimer.current);
          touchShowTimer.current = null;
        }
        touchHideTimer.current = setTimeout(() => {
          setMobileTooltip(prev => ({ ...prev, visible: false }));
        }, 1000);
      };

      useEffect(() => {
        let aT;
        const rT = () => {
          if (aT) clearTimeout(aT);
          if (appData.autoLockTime && appData.autoLockTime !== '0' && isAuthenticated) {
            aT = setTimeout(() => { setIsAuthenticated(false); }, parseInt(appData.autoLockTime) * 60000);
          }
        };
        const hA = () => rT();
        ['mousemove','keydown','touchstart','scroll','click'].forEach(e => window.addEventListener(e, hA));
        rT();
        return () => {
          ['mousemove','keydown','touchstart','scroll','click'].forEach(e => window.removeEventListener(e, hA));
          if (aT) clearTimeout(aT);
        };
      }, [appData.autoLockTime, isAuthenticated]);
      
      useEffect(() => { 
          if (!isSetupComplete) return;
          try {
            const c = localStorage.getItem('finTrackerCache');
            if (c) { setAppData(JSON.parse(c)); setIsLoading(false); setIsBackgroundSyncing(true); }
          } catch(e) {} 
          apiCall('GET_DATA').then(res => {
            setAppData(res);
            try { localStorage.setItem('finTrackerCache', JSON.stringify(res)); } catch(e) {}
            setIsLoading(false);
            setIsBackgroundSyncing(false);
          }).catch(e => {
            console.error(e);
            setIsLoading(false);
            setIsBackgroundSyncing(false);
          }); 
      }, [isSetupComplete]);

      useEffect(() => {
        if (appData.transactions.length > 0) {
          try { localStorage.setItem('finTrackerCache', JSON.stringify(appData)); } catch(e) {}
        }
      }, [appData]);

      useEffect(() => {
        const m = document.getElementById("theme-color-meta");
        if (isDarkMode) {
          document.documentElement.classList.add('dark');
          try { localStorage.setItem('theme','dark'); } catch(e) {}
          if (m) m.setAttribute("content","#1c1917");
        } else {
          document.documentElement.classList.remove('dark');
          try { localStorage.setItem('theme','light'); } catch(e) {}
          if (m) m.setAttribute("content","#e06c53");
        }
      }, [isDarkMode]);

      useEffect(() => {
        if (isPrivacyMode) {
          document.body.classList.add('privacy-active');
          try { localStorage.setItem('privacyMode','true'); } catch(e) {}
        } else {
          document.body.classList.remove('privacy-active');
          try { localStorage.setItem('privacyMode','false'); } catch(e) {}
        }
      }, [isPrivacyMode]);

      const handleManualRefresh = () => {
        setIsBackgroundSyncing(true);
        apiCall('GET_DATA').then(res => {
          setAppData(res);
          try { localStorage.setItem('finTrackerCache', JSON.stringify(res)); } catch(e) {}
          setIsBackgroundSyncing(false);
        }).catch(e => {
          console.error(e);
          setTimeout(() => setIsBackgroundSyncing(false), 800);
        });
      };

      const handleSort = (k) => setSortConfig(p => ({ key: k, direction: p.key===k && p.direction==='desc' ? 'asc' : 'desc' }));
      const SortIcon = ({ colKey }) => sortConfig.key !== colKey ? <div className="w-3 h-3 opacity-0"></div> : (sortConfig.direction === 'asc' ? <ChevronUp c="w-3 h-3 text-brand-teal" /> : <ChevronDown c="w-3 h-3 text-brand-teal" />);

      const parsedData = useMemo(() => appData.transactions.map((r, i) => { const d = new Date(r.date); return { ...r, id: i, amount: parseAmt(r.amount), monthIdx: isNaN(d.getMonth()) ? -1 : d.getMonth(), year: isNaN(d.getFullYear()) ? -1 : d.getFullYear(), rawType: String(r.type||'').toUpperCase() }; }).filter(r => r.amount > 0 && r.year !== -1).sort((a,b) => new Date(b.date) - new Date(a.date)), [appData.transactions]);
      const activeData = useMemo(() => { const ex = appData.excludedCats || []; return parsedData.filter(t => !ex.includes(t.category)); }, [parsedData, appData.excludedCats]);
      const allAvailableTags = useMemo(() => { const s = new Set(); parsedData.forEach(t => extractTags(t.tags).forEach(tag => s.add(tag))); return Array.from(s).sort(); }, [parsedData]);
      const allUniqueCategories = useMemo(() => Array.from(new Set(parsedData.map(d => d.category))).filter(Boolean).sort(), [parsedData]);
      const latestInfo = useMemo(() => activeData.length ? { year: activeData[0].year, monthIdx: activeData[0].monthIdx } : { year: new Date().getFullYear(), monthIdx: new Date().getMonth() }, [activeData]);
      
      const monthlyAggsForAllTime = useMemo(() => {
          const aggs = {};
          activeData.forEach(r => {
            const k = `${r.year}-${String(r.monthIdx).padStart(2,'0')}`;
            if (!aggs[k]) aggs[k] = { year: r.year, monthIdx: r.monthIdx, label: MONTH_NAMES[r.monthIdx], in: 0, out: 0, inv: 0 };
            if (r.rawType === 'INCOME') aggs[k].in += r.amount;
            else if (r.category && String(r.category).toLowerCase() === 'investment') aggs[k].inv += r.amount;
            else if (r.rawType === 'EXPENSE') aggs[k].out += r.amount;
          });
          let run = 0;
          return Object.keys(aggs).sort().map(k => {
            const m = aggs[k];
            const avail = run + m.in;
            run += (m.in - m.out - m.inv);
            return { ...m, avail, key: k };
          });
      }, [activeData]);

      const filterByPeriod = (dStr, y, mIdx) => {
          const d = parseDateLocal(dStr);
          const { year, monthIdx } = latestInfo;
          if (period === 'This Month') return y === year && mIdx === monthIdx;
          if (period === 'Last Month') return y === (monthIdx === 0 ? year-1 : year) && mIdx === (monthIdx === 0 ? 11 : monthIdx-1);
          if (period === '3M') return d >= new Date(year, monthIdx - 2, 1) && d <= new Date(year, monthIdx + 1, 0);
          if (period === '6M') return d >= new Date(year, monthIdx - 5, 1) && d <= new Date(year, monthIdx + 1, 0);
          if (period === 'YTD') return y === year && mIdx <= monthIdx;
          if (period === '12M') return d >= new Date(year, monthIdx - 11, 1) && d <= new Date(year, monthIdx + 1, 0);
          if (period === 'Custom') {
            if (customFrom && d < parseDateLocal(customFrom)) return false;
            if (customTo && d > parseDateLocal(customTo)) return false;
            return true;
          }
          return true;
      };

      const analyticsFiltered = useMemo(() => activeData.filter(r => filterByPeriod(r.date, r.year, r.monthIdx)), [activeData, period, latestInfo, customFrom, customTo]);
      
      const ledgerFiltered = useMemo(() => {
        let f = parsedData; 
        if (ledgerTypeFilter !== 'ALL') f = f.filter(r => r.rawType === ledgerTypeFilter);
        if (ledgerCategoryFilter !== 'All') f = f.filter(r => r.category === ledgerCategoryFilter);
        if (ledgerAccountFilter !== 'All') f = f.filter(r => r.account === ledgerAccountFilter || r.transfer_to === ledgerAccountFilter);
        if (ledgerTagFilter) f = f.filter(r => extractTags(r.tags).includes(ledgerTagFilter));
        if (searchQ) {
          const q = searchQ.toLowerCase();
          f = f.filter(r => `${String(r.description||'')} ${String(r.category||'')} ${String(r.tags||'')} ${String(r.notes||'')} ${String(r.account||'')} ${String(r.transfer_to||'')}`.toLowerCase().includes(q));
        }
        return f;
      }, [parsedData, searchQ, ledgerCategoryFilter, ledgerTagFilter, ledgerTypeFilter, ledgerAccountFilter]);

      const selectedSum = useMemo(() => ledgerFiltered.filter(t => selectedRows.includes(t.row_index)).reduce((s, t) => {
        if (t.rawType === 'TRANSFER') return s;
        return s + (t.rawType === 'INCOME' ? t.amount : -t.amount);
      }, 0), [selectedRows, ledgerFiltered]);

      const groupedLedger = useMemo(() => {
          const grps = {};
          const cy = new Date().getFullYear()*100 + new Date().getMonth();
          ledgerFiltered.forEach(t => {
            const d = parseDateLocal(t.date);
            const y = isNaN(d.getTime()) ? '' : d.getFullYear();
            const lbl = isNaN(d.getTime()) ? 'Unknown' : `${MONTH_NAMES_FULL[d.getMonth()]} ${y}`;
            const sK = isNaN(d.getTime()) ? 0 : y*100+d.getMonth();
            if (!grps[lbl]) grps[lbl] = { label: lbl, sortKey: sK, isCurrentMonth: sK===cy, entries: [], count: 0, spent: 0, invested: 0 };
            grps[lbl].entries.push(t);
            grps[lbl].count++;
            if (t.rawType==='EXPENSE') {
              if (t.category && String(t.category).toLowerCase()==='investment') grps[lbl].invested += t.amount;
              else grps[lbl].spent += t.amount;
            }
          });
          const arr = Object.values(grps).sort((a,b) => b.sortKey - a.sortKey);
          arr.forEach(g => g.entries.sort((a,b) => {
            let vA = a[sortConfig.key];
            let vB = b[sortConfig.key];
            if (sortConfig.key==='amount') { vA = parseFloat(vA)||0; vB = parseFloat(vB)||0; }
            else if (sortConfig.key==='date') { vA = new Date(vA).getTime(); vB = new Date(vB).getTime(); }
            else { vA = String(vA||'').toLowerCase(); vB = String(vB||'').toLowerCase(); }
            if (vA < vB) return sortConfig.direction==='asc' ? -1 : 1;
            if (vA > vB) return sortConfig.direction==='asc' ? 1 : -1;
            return 0;
          }));
          return arr;
      }, [ledgerFiltered, sortConfig]);

      useEffect(() => {
        if (groupedLedger.length > 0 && Object.keys(expandedGroups).length === 0) {
          setExpandedGroups({ [groupedLedger[0].label]: true });
        }
      }, [groupedLedger]);

      const toggleGroup = (label) => { setExpandedGroups(prev => ({ ...prev, [label]: !prev[label] })); };

      const isAllCollapsed = groupedLedger.length > 0 && groupedLedger.every(g => !expandedGroups[g.label]);
      const toggleExpandCollapseAll = () => {
        if (isAllCollapsed || Object.values(expandedGroups).filter(v=>v).length === 0) {
          const allExpanded = {};
          groupedLedger.forEach(g => allExpanded[g.label] = true);
          setExpandedGroups(allExpanded);
        } else {
          setExpandedGroups({});
        }
      };

      const mIN = analyticsFiltered.filter(r => r.rawType === 'INCOME').reduce((a,b) => a + b.amount, 0);
      const mINV = analyticsFiltered.filter(r => r.category && String(r.category).toLowerCase() === 'investment').reduce((a,b) => a + b.amount, 0);
      const mOUT = analyticsFiltered.filter(r => r.rawType === 'EXPENSE' && (!r.category || String(r.category).toLowerCase() !== 'investment')).reduce((a,b) => a + b.amount, 0);
      const savRate = mIN > 0 ? (((mIN - mOUT) / mIN) * 100).toFixed(1) : 0;

      // Chronological Snapshot Math
      const accountBalances = useMemo(() => {
        const balsObj = {};
        const safeAccounts = appData?.settings?.accounts||[];
        
        safeAccounts.forEach(a => {
            const snaps = (appData.balances || []).filter(b => b.account === a);
            snaps.sort((x, y) => parseDateLocal(y.date) - parseDateLocal(x.date));
            const latest = snaps[0];
            balsObj[a] = {
                current: latest && latest.balance !== '' ? parseFloat(latest.balance) : 0,
                startDate: latest ? parseDateLocal(latest.date) : new Date('1970-01-01')
            };
        });

        activeData.forEach(t => {
            const d = parseDateLocal(t.date);
            if (balsObj[t.account] && d >= balsObj[t.account].startDate) {
                if (t.rawType === 'INCOME') balsObj[t.account].current += t.amount;
                else if (t.rawType === 'EXPENSE' || t.rawType === 'TRANSFER') balsObj[t.account].current -= t.amount;
            }
            if (t.rawType === 'TRANSFER' && balsObj[t.transfer_to] && d >= balsObj[t.transfer_to].startDate) {
                balsObj[t.transfer_to].current += t.amount;
            }
        });
        return balsObj;
      }, [activeData, appData.balances, appData.settings]);

      const totalBalance = Object.values(accountBalances).reduce((s, a) => s + a.current, 0);
      const chartData = useMemo(() => monthlyAggsForAllTime.filter(r => filterByPeriod(new Date(r.year, r.monthIdx, 1), r.year, r.monthIdx)), [monthlyAggsForAllTime, period, latestInfo, customFrom, customTo]);
      const topMerchants = useMemo(() => {
        const m = {};
        analyticsFiltered.filter(r => r.rawType === 'EXPENSE' && (!r.category || String(r.category).toLowerCase() !== 'investment')).forEach(r => {
          const d = String(r.description || 'Unknown');
          if (!m[d]) m[d] = { name: d, cat: r.category, total: 0 };
          m[d].total += r.amount;
        });
        return Object.values(m).sort((a,b) => b.total - a.total).slice(0,8);
      }, [analyticsFiltered]);

      const categorySplitData = useMemo(() => {
        const map = {};
        analyticsFiltered.filter(r => r.rawType === 'EXPENSE' && (!r.category || String(r.category).toLowerCase() !== 'investment')).forEach(r => { 
            const cat = String(r.category || 'Uncategorized'); if (!map[cat]) map[cat] = 0; map[cat] += r.amount; 
        });
        const colors = ['#e06c53', '#cb5a42', '#1d8b4e', '#f59e0b', '#2563eb', '#ec4899', '#8b5cf6', '#14b8a6'];
        return Object.entries(map).map(([name, value], idx) => ({ name, value, color: colors[idx % colors.length] })).sort((a, b) => b.value - a.value);
      }, [analyticsFiltered]);

      const accountSplitData = useMemo(() => {
        const map = {};
        analyticsFiltered.filter(r => r.rawType === 'EXPENSE' && (!r.category || String(r.category).toLowerCase() !== 'investment')).forEach(r => { 
            const acc = String(r.account || 'Cash/Other'); if (!map[acc]) map[acc] = 0; map[acc] += r.amount; 
        });
        return Object.entries(map).map(([acc, total]) => ({ acc, total })).sort((a, b) => b.total - a.total);
      }, [analyticsFiltered]);

      const heatmapData = useMemo(() => {
        let expenses = analyticsFiltered.filter(r => r.rawType === 'EXPENSE' && (!r.category || String(r.category).toLowerCase() !== 'investment'));
        if (analyticsCategory !== 'All Categories') expenses = expenses.filter(r => String(r.category || 'Uncategorized') === analyticsCategory);
        if (!expenses.length) return { topCategories: [], monthCols: [], matrix: {}, maxVal: 0 };
        
        const catTotals = {}; const catMonthMatrix = {};
        expenses.forEach(row => {
          const cat = String(row.category || 'Uncategorized');
          if (!catTotals[cat]) { catTotals[cat] = 0; catMonthMatrix[cat] = {}; }
          catTotals[cat] += row.amount; const mKey = MONTH_NAMES[row.monthIdx];
          if (!catMonthMatrix[cat][mKey]) catMonthMatrix[cat][mKey] = 0; catMonthMatrix[cat][mKey] += row.amount;
        });
        
        const topCategories = Object.keys(catTotals).sort((a, b) => catTotals[b] - catTotals[a]).slice(0, 10);
        const activeMonthIndices = Array.from(new Set(expenses.map(r => r.monthIdx))).sort((a,b) => a - b);
        const monthCols = activeMonthIndices.map(mIdx => ({ index: mIdx, key: MONTH_NAMES[mIdx], label: MONTH_NAMES[mIdx] }));
        
        let maxVal = 0;
        topCategories.forEach(cat => { monthCols.forEach(m => { const val = (catMonthMatrix[cat] && catMonthMatrix[cat][m.key]) || 0; if (val > maxVal) maxVal = val; }); });
        return { topCategories, monthCols, matrix: catMonthMatrix, maxVal };
      }, [analyticsFiltered, analyticsCategory]);

      const handleOpenNewTxn = () => { setEditTxn(null); setIsModalOpen(true); };
      const handleOpenEditTxn = (txn) => { setEditTxn(txn); setIsModalOpen(true); };
      const handleSelectRow = (rI) => setSelectedRows(p => p.includes(rI) ? p.filter(r=>r!==rI) : [...p, rI]);
      const handleSelectAll = (e) => setSelectedRows(e.target.checked ? ledgerFiltered.map(t=>t.row_index) : []);

      const executeBulkAction = (updates) => {
        setIsBackgroundSyncing(true);
        const isDel = bulkModal.action === 'DELETE';
        setAppData(p => {
          let n = [...p.transactions];
          if (isDel) n = n.filter(t => !selectedRows.includes(t.row_index));
          else n = n.map(t => selectedRows.includes(t.row_index) ? { ...t, ...updates } : t);
          return { ...p, transactions: n };
        });
        setBulkModal({ isOpen: false, action: null });
        setSelectedRows([]);
        setIsActionsMenuOpen(false);
        apiCall('BULK_ACTION', { actionType: isDel ? 'DELETE' : 'UPDATE', rowIndices: selectedRows, updates: updates || {} })
          .then(res => { setAppData(res); setIsBackgroundSyncing(false); })
          .catch(e => setIsBackgroundSyncing(false));
      };

      const executeDeleteSingle = () => {
         if (!deleteModalId) return;
         setIsBackgroundSyncing(true);
         const id = deleteModalId;
         setAppData(p => ({ ...p, transactions: p.transactions.filter(t => t.row_index !== id) }));
         setSelectedRows(p => p.filter(r => r !== id));
         setDeleteModalId(null);
         apiCall('BULK_ACTION', { actionType: 'DELETE', rowIndices: [id], updates: {} })
          .then(res => { setAppData(res); setIsBackgroundSyncing(false); })
          .catch(e => setIsBackgroundSyncing(false));
      };

      const allCatArray = useMemo(() => Array.from(new Set([...(appData?.settings?.incomeCats||[]), ...(appData?.settings?.expenseCats||[]), 'TRANSFER'])).sort(), [appData]);
      const safeAccountsList = appData?.settings?.accounts||[];

      if (!isSetupComplete) return <SetupScreen onSave={(u, k, data) => { GLOBAL_API_URL=u; GLOBAL_API_KEY=k; try{localStorage.setItem('API_URL',u);localStorage.setItem('API_KEY',k); if(data)localStorage.setItem('finTrackerCache',JSON.stringify(data));}catch(e){} if(data)setAppData(data); setIsSetupComplete(true); }} />;
      if (isLoading) return ( <div className="h-screen w-full flex flex-col items-center justify-center bg-brand-bgLight dark:bg-brand-bgDark transition-colors duration-300"><div className="w-10 h-10 border-4 border-slate-200 dark:border-slate-800 border-t-brand-teal rounded-full animate-spin"></div><p className="mt-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest animate-pulse">Initializing...</p></div> );
      if (appData.appPin && !isAuthenticated) return <LockScreen correctPin={appData.appPin} onUnlock={() => setIsAuthenticated(true)} />;

                     </div>
                  </div>
                  
                  <div className="flex flex-wrap items-center gap-2 pb-1 px-1"><button onClick={() => setLedgerTagFilter(null)} className={`px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-colors border shadow-sm ${!ledgerTagFilter ? 'bg-brand-teal/10 text-brand-teal border-brand-teal/30' : 'bg-white dark:bg-brand-cardDark text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800'}`}>All Tags</button>{allAvailableTags.map(tag => (<button key={tag} onClick={() => setLedgerTagFilter(tag === ledgerTagFilter ? null : tag)} className={`px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-colors border shadow-sm ${tag === ledgerTagFilter ? 'bg-brand-teal/10 text-brand-teal border-brand-teal/30' : 'bg-white dark:bg-brand-cardDark text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800'}`}>{tag}</button>))}</div>
                  
                  {/* Desktop Ledger Header */}
                  {groupedLedger.length > 0 && (
                    <div className="hidden lg:grid grid-cols-[2.5rem_6rem_12rem_8rem_1fr_10rem_5rem] gap-4 px-6 py-3 mt-6 items-center text-[10px] font-extrabold text-slate-400 dark:text-slate-500 uppercase tracking-widest border-b border-slate-200 dark:border-slate-800">
                      <div className="flex items-center justify-center nav-item relative group">
                        <input type="checkbox" checked={selectedRows.length > 0 && selectedRows.length === ledgerFiltered.length} onChange={handleSelectAll} className="custom-check" />
                        <span className="nav-tooltip-bottom">Select All</span>
                      </div>
                      <div className="shrink-0 cursor-pointer hover:text-brand-teal flex items-center gap-1 select-none" onClick={() => handleSort('date')}>Date <SortIcon colKey="date"/></div>
                      <div className="shrink-0 cursor-pointer hover:text-brand-teal flex items-center gap-1 select-none" onClick={() => handleSort('category')}>Category <SortIcon colKey="category"/></div>
                      <div className="shrink-0 cursor-pointer hover:text-brand-teal flex items-center justify-end gap-1 select-none" onClick={() => handleSort('amount')}><SortIcon colKey="amount"/> Amount</div>
                      <div className="min-w-0 px-4 cursor-pointer hover:text-brand-teal flex items-center gap-1 select-none" onClick={() => handleSort('description')}>Description <SortIcon colKey="description"/></div>
                      <div className="shrink-0 cursor-pointer hover:text-brand-teal flex items-center gap-1 select-none" onClick={() => handleSort('account')}>Account <SortIcon colKey="account"/></div>
                      <div className="flex items-center justify-end nav-item relative group">
                        <button onClick={toggleExpandCollapseAll} className="p-1.5 text-slate-400 hover:text-brand-teal transition-colors">
                          <ChevronsUpDown c="w-4 h-4"/>
                        </button>
                        <span className="nav-tooltip-bottom">{isAllCollapsed || Object.values(expandedGroups).filter(v=>v).length === 0 ? 'Expand All' : 'Collapse All'}</span>
                      </div>
                    </div>
                  )}

                  {/* Mobile Compact Ledger Header With Even Spacing */}
                  {groupedLedger.length > 0 && (
                    <div className="lg:hidden flex items-center px-4 py-2.5 mt-4 border-b border-slate-200 dark:border-slate-800 gap-2">
                       <div className="flex items-center justify-center shrink-0">
                          <input type="checkbox" checked={selectedRows.length > 0 && selectedRows.length === ledgerFiltered.length} onChange={handleSelectAll} className="custom-check" />
                       </div>
                       
                       <div className="flex-1 flex items-center justify-between text-[9px] font-extrabold text-slate-400 dark:text-slate-500 uppercase tracking-wide px-1">
                          <div className="shrink-0 cursor-pointer flex items-center gap-0.5 hover:text-brand-teal select-none" onClick={() => handleSort('date')}>Date <SortIcon colKey="date"/></div>
                          <div className="shrink-0 cursor-pointer flex items-center gap-0.5 hover:text-brand-teal select-none" onClick={() => handleSort('category')}>Cat <SortIcon colKey="category"/></div>
                          <div className="shrink-0 cursor-pointer flex items-center gap-0.5 hover:text-brand-teal select-none" onClick={() => handleSort('amount')}>Amt <SortIcon colKey="amount"/></div>
                          <div className="shrink-0 cursor-pointer flex items-center gap-0.5 hover:text-brand-teal select-none" onClick={() => handleSort('description')}>Desc <SortIcon colKey="description"/></div>
                          <div className="shrink-0 cursor-pointer flex items-center gap-0.5 hover:text-brand-teal select-none" onClick={() => handleSort('account')}>Acc <SortIcon colKey="account"/></div>
                       </div>

                       <button onClick={toggleExpandCollapseAll} onTouchStart={(e) => handleTouchStart(isAllCollapsed || Object.values(expandedGroups).filter(v=>v).length === 0 ? 'Expand All' : 'Collapse All', e, 'bottom')} onTouchEnd={handleTouchEnd} onTouchCancel={handleTouchEnd} className="p-1.5 text-slate-400 hover:text-brand-teal transition-colors shrink-0 bg-slate-50 dark:bg-slate-800 rounded-lg">
                          <ChevronsUpDown c="w-4 h-4"/>
                       </button>
                    </div>
                  )}

                  {groupedLedger.length === 0 ? <div className="modern-card p-12 text-center text-slate-400 font-bold text-sm mt-4 border border-slate-200 dark:border-slate-800">No transactions found.</div> : (
                    <div className="space-y-4 pb-12">
                      {groupedLedger.map(g => {
                         const isExpanded = !!expandedGroups[g.label];
                         return (
                           <div key={g.label} className="modern-card overflow-hidden border border-slate-200 dark:border-slate-800 shadow-sm">
                              <div className="flex flex-col sm:flex-row sm:items-center justify-between bg-white dark:bg-brand-cardDark px-4 py-4 sm:px-6 sm:py-5 cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors gap-3 sm:gap-4 border-b border-slate-100 dark:border-slate-800 last:border-0" onClick={() => toggleGroup(g.label)}>
                                 <div className="flex items-center gap-3 min-w-0"><ChevronDown c={`w-5 h-5 text-slate-400 transition-transform shrink-0 ${isExpanded ? 'rotate-180' : ''}`} /><span className="font-extrabold text-base sm:text-lg tracking-tight truncate">{g.label}</span>{g.isCurrentMonth && <span className="bg-brand-teal/20 text-brand-teal text-[10px] font-black px-2 py-1 rounded-lg uppercase tracking-wider shrink-0 hidden sm:inline-block">This Month</span>}</div>
                                 <div className="flex items-center gap-3 shrink-0 pl-8 sm:pl-0"><div className="flex items-center text-[11px] sm:text-xs font-bold text-slate-500 dark:text-slate-400 bg-brand-bgLight dark:bg-brand-bgDark px-3 py-1.5 rounded-xl whitespace-nowrap shadow-sm border border-slate-100 dark:border-slate-800">{g.count} entries <span className="mx-2 text-slate-300 dark:text-slate-600">|</span> <span className="text-slate-800 dark:text-slate-200 font-black blur-money">-{formatCompact(g.spent, isPrivacyMode)}</span></div>{g.invested > 0 && <span className="flex items-center text-[11px] sm:text-xs font-bold text-amber-600 dark:text-amber-500 bg-amber-50 dark:bg-amber-500/10 px-3 py-1.5 rounded-xl whitespace-nowrap blur-money">+Inv {formatCompact(g.invested, isPrivacyMode)}</span>}</div>
                              </div>
                              {isExpanded && (
                                 <div className="divide-y divide-slate-100 dark:divide-slate-800/50 bg-white dark:bg-brand-cardDark">
                                   {g.entries.map(t => {
                                      const isExcluded = (appData.excludedCats || []).includes(t.category);
                                      const isIN = t.rawType === 'INCOME'; const isTRF = t.rawType === 'TRANSFER';
                                      const IconComp = isIN ? ArrowDownRight : isTRF ? Repeat : ArrowUpRight;
                                      const colorClass = isIN ? 'text-brand-income bg-emerald-50 dark:bg-emerald-500/10 border-emerald-100 dark:border-emerald-500/20' : isTRF ? 'text-slate-500 bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700' : 'text-brand-expense bg-rose-50 dark:bg-rose-500/10 border-rose-100 dark:border-rose-500/20';
                                      const badgeClass = isIN ? 'text-brand-income bg-emerald-50 dark:bg-emerald-500/10 border border-emerald-100 dark:border-emerald-500/20' : isTRF ? 'text-brand-transfer bg-blue-50 dark:bg-blue-900/20 border border-blue-100 dark:border-blue-800/30' : 'text-brand-expense bg-rose-50 dark:bg-rose-500/10 border border-rose-100 dark:border-rose-500/20';
                                      const amtColor = isIN ? 'text-brand-income' : isTRF ? 'text-slate-600 dark:text-slate-400' : 'text-slate-900 dark:text-white';
                                      const sign = isIN ? '+' : isTRF ? '' : '-'; const txTags = extractTags(t.tags);
                                      return (
                                        <div key={t.id} className={`group ${isExcluded ? 'opacity-40 grayscale' : ''}`}>
                                           <div className="flex lg:hidden px-4 py-3 sm:px-6 sm:py-4 items-center gap-3 sm:gap-4 hover:bg-slate-50 dark:hover:bg-slate-800/30 transition-colors">
                                              <div className="flex items-center justify-center shrink-0">
                                                <input type="checkbox" checked={selectedRows.includes(t.row_index)} onChange={() => handleSelectRow(t.row_index)} className="custom-check" />
                                              </div>
                                              <div className={`hidden sm:flex w-[40px] h-[40px] rounded-xl items-center justify-center shrink-0 shadow-sm border ${colorClass}`}><IconComp c="w-5 h-5"/></div><div className="flex-1 min-w-0 flex flex-col justify-center"><div className="flex justify-between items-start sm:mb-1"><p className={`text-sm sm:text-base font-extrabold truncate pr-2 ${isExcluded ? 'line-through text-slate-400' : ''}`}>{t.description}</p></div>{t.notes && <p className="text-[10px] text-slate-500 dark:text-slate-400 font-medium truncate mt-0.5 pr-2">{t.notes}</p>}<div className="flex items-center gap-2 min-w-0 text-[10px] sm:text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wide mt-1.5"><span className="shrink-0 text-slate-500 dark:text-slate-400">{formatDateShort(t.date)}</span><span className="w-1 h-1 rounded-full bg-slate-300 dark:bg-slate-600 shrink-0"></span><span className="truncate text-slate-500 dark:text-slate-400">{isTRF ? `${t.account} ➔ ${t.transfer_to}` : t.account}</span>{t.category && <span className={`sm:hidden px-2 py-0.5 rounded-md ml-1 truncate max-w-[120px] shrink-0 ${badgeClass}`}>{t.category}</span>}</div></div><div className="flex flex-col items-end shrink-0 gap-1.5 ml-2"><p className={`text-base font-black blur-money ${amtColor} shrink-0`}>{sign}{formatINR(t.amount, isPrivacyMode)}</p><div className="flex items-center gap-1"><button onClick={() => handleOpenEditTxn(t)} className="p-1.5 text-slate-400 hover:text-brand-teal bg-slate-100 dark:bg-slate-800 rounded-lg transition-colors"><EditPencil c="w-3.5 h-3.5" /></button><button onClick={() => setDeleteModalId(t.row_index)} className="p-1.5 text-slate-400 hover:text-brand-expense bg-slate-100 dark:bg-slate-800 rounded-lg transition-colors"><Trash2 c="w-3.5 h-3.5" /></button></div></div>
                                           </div>
                                           <div className="hidden lg:grid grid-cols-[2.5rem_6rem_12rem_8rem_1fr_10rem_5rem] gap-4 px-6 py-4 items-center hover:bg-slate-50 dark:hover:bg-slate-800/30 transition-colors">
                                              <div className="flex items-center justify-center">
                                                <input type="checkbox" checked={selectedRows.includes(t.row_index)} onChange={() => handleSelectRow(t.row_index)} className="custom-check" />
                                              </div>
                                              <div className="text-xs font-bold text-slate-500 dark:text-slate-400">{formatDateStr(t.date)}</div><div className="flex flex-col items-start justify-center min-w-0 pr-2">{t.category && <span className={`text-[10px] font-bold px-2 py-1 rounded-lg truncate max-w-full ${badgeClass}`}>{t.category}</span>}</div><div className={`text-right text-sm font-black blur-money ${amtColor}`}>{sign}{formatINR(t.amount, isPrivacyMode)}</div><div className="flex flex-col min-w-0 px-4"><span className="text-sm font-extrabold truncate">{t.description}</span>{t.notes && <span className="text-[10px] text-slate-500 dark:text-slate-400 font-medium truncate mt-0.5">{t.notes}</span>}{txTags.length > 0 && <span className="text-[10px] text-brand-teal font-bold truncate mt-0.5">{txTags.join(' ')}</span>}</div><div className="text-xs font-bold text-slate-600 dark:text-slate-400 truncate flex items-center gap-1.5">{isTRF ? <Repeat c="w-3 h-3 text-slate-400 shrink-0"/> : <Wallet c="w-3 h-3 text-slate-400 shrink-0"/>}<span className="truncate">{isTRF ? `${t.account} ➔ ${t.transfer_to}` : t.account}</span></div><div className="flex items-center justify-end gap-2 opacity-0 group-hover:opacity-100 transition-opacity"><button onClick={() => handleOpenEditTxn(t)} className="p-1.5 text-slate-400 hover:text-brand-teal bg-white dark:bg-brand-bgDark border border-slate-200 dark:border-slate-700 shadow-sm hover:bg-slate-50 dark:hover:bg-slate-800 rounded-lg"><EditPencil c="w-3.5 h-3.5" /></button><button onClick={() => setDeleteModalId(t.row_index)} className="p-1.5 text-slate-400 hover:text-brand-expense bg-white dark:bg-brand-bgDark border border-slate-200 dark:border-slate-700 shadow-sm hover:bg-rose-50 dark:hover:bg-rose-500/10 rounded-lg"><Trash2 c="w-3.5 h-3.5" /></button></div>
                                           </div>
                                        </div>
                                      );
                                   })}
                                 </div>
                              )}
                           </div>
                         );
                      })}
                    </div>
                  )}
                </div>
              )}

              {activeTab === 'settings' && <SettingsView appData={appData} onSave={setAppData} appPin={appData.appPin} autoLockTime={appData.autoLockTime} setIsBackgroundSyncing={setIsBackgroundSyncing} />}

            </div>
          </main>

          {/* Centered Bulk Edit Bar */}
          {selectedRows.length > 0 && activeTab === 'ledger' && (
             <div className="fixed bottom-[88px] md:bottom-8 left-4 right-4 md:left-1/2 md:right-auto md:-translate-x-1/2 md:w-max z-50 animate-slide-up mx-auto">
                <div className="bg-white dark:bg-brand-sidebar shadow-[0_8px_30px_rgba(0,0,0,0.2)] dark:shadow-[0_20px_40px_rgba(0,0,0,0.5)] rounded-2xl border border-slate-200 dark:border-slate-700/50 flex flex-row items-center p-2 relative">
                   <div className="flex items-center gap-3 px-3 py-1.5 md:py-2 border-r border-slate-200 dark:border-slate-700/50"><span className="text-xs font-bold text-slate-700 dark:text-slate-300 whitespace-nowrap">{selectedRows.length} selected</span><span className="text-slate-900 dark:text-white font-black text-sm blur-money">{formatINR(Math.abs(selectedSum), isPrivacyMode)}</span></div>
                   <div className="flex md:hidden items-center gap-1 pl-2"><button onClick={() => setIsActionsMenuOpen(!isActionsMenuOpen)} className="px-3 py-2 text-xs font-bold text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg flex items-center gap-1.5"><span className="text-[10px]">•••</span> Actions</button><button onClick={() => setBulkModal({isOpen: true, action: 'DELETE'})} className="p-2 text-brand-expense hover:bg-rose-50 dark:hover:bg-rose-500/10 rounded-lg"><Trash2 c="w-4 h-4"/></button></div>
                   <div className="hidden md:flex items-center gap-1 pl-2 pr-2"><button onClick={() => setBulkModal({isOpen: true, action: 'CATEGORY'})} className="px-3 py-2 text-xs font-bold text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg flex items-center gap-1.5"><TagIcon c="w-3.5 h-3.5"/> Re-categorize</button><button onClick={() => setBulkModal({isOpen: true, action: 'TAGS'})} className="px-3 py-2 text-xs font-bold text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg flex items-center gap-1.5"><TagIcon c="w-3.5 h-3.5"/> Add Tags</button><button onClick={() => setBulkModal({isOpen: true, action: 'DESC'})} className="px-3 py-2 text-xs font-bold text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg flex items-center gap-1.5"><EditPencil c="w-3.5 h-3.5"/> Description</button><button onClick={() => setBulkModal({isOpen: true, action: 'DELETE'})} className="px-3 py-2 text-xs font-bold text-brand-expense hover:bg-rose-50 dark:hover:bg-rose-500/10 rounded-lg flex items-center gap-1.5"><Trash2 c="w-3.5 h-3.5"/> Delete</button></div>
                   <button onClick={() => setSelectedRows([])} className="ml-auto md:ml-2 p-1.5 text-slate-400 hover:text-slate-700 dark:hover:text-white rounded-full shrink-0"><X c="w-4 h-4"/></button>
                   {isActionsMenuOpen && ( <div className="absolute bottom-[110%] right-10 w-48 bg-white dark:bg-brand-sidebar border border-slate-200 dark:border-slate-700 rounded-xl shadow-2xl overflow-hidden py-1 z-50 animate-fade-in md:hidden"><button onClick={() => { setIsActionsMenuOpen(false); setBulkModal({isOpen: true, action: 'CATEGORY'}); }} className="w-full text-left px-4 py-3 text-xs font-bold text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 flex items-center gap-2"><TagIcon c="w-4 h-4"/> Re-categorize</button><button onClick={() => { setIsActionsMenuOpen(false); setBulkModal({isOpen: true, action: 'TAGS'}); }} className="w-full text-left px-4 py-3 text-xs font-bold text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 flex items-center gap-2"><TagIcon c="w-4 h-4"/> Add Tags</button><button onClick={() => { setIsActionsMenuOpen(false); setBulkModal({isOpen: true, action: 'DESC'}); }} className="w-full text-left px-4 py-3 text-xs font-bold text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 flex items-center gap-2"><EditPencil c="w-4 h-4"/> Description</button></div> )}
                </div>
             </div>
          )}

          <TransactionModal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} onSave={setAppData} settings={appData.settings} editData={editTxn} allAvailableTags={allAvailableTags} setIsBackgroundSyncing={setIsBackgroundSyncing} />
          <BulkActionModal isOpen={bulkModal.isOpen} action={bulkModal.action} count={selectedRows.length} onClose={() => setBulkModal({isOpen: false, action: null})} onConfirm={executeBulkAction} allCategories={allCatArray} />
          <ConfirmDialog isOpen={deleteModalId !== null} onCancel={() => setDeleteModalId(null)} onConfirm={executeDeleteSingle} title="Delete Transaction" message="Are you sure you want to delete this transaction permanently? This cannot be undone." />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
