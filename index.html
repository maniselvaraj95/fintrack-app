<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FinTrack">
  <meta name="theme-color" content="#e06c53" id="theme-color-meta">
  <link rel="manifest" href="manifest.json">
  <title>FinTrack</title>
  
  <!-- Favicon / Touch Icons (Matches exact Git filename Icon-192.png) -->
  <link rel="icon" type="image/png" href="Icon-192.png">
  <link rel="apple-touch-icon" href="Icon-192.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              teal: '#e06c53',         // Primary Terracotta accent
              'teal-dark': '#c8563f',
              surface: '#fbf9f5',
              sidebar: '#1c1917',
              darkbg: '#121212',
              darkcard: '#1e1e1e'
            }
          }
        }
      }
    }
  </script>

  <!-- React, ReactDOM, Babel, Recharts, Lucide Icons -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/lucide-react@latest"></script>
  <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* Custom Desktop Hover Tooltips - Strictly :hover, eliminating sticky :focus */
    @media (hover: hover) and (pointer: fine) {
      .tooltip-trigger:hover .custom-tooltip {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }
    }

    .custom-tooltip {
      opacity: 0;
      visibility: hidden;
      transform: translateY(4px);
      transition: opacity 0.15s ease, transform 0.15s ease, visibility 0.15s;
      pointer-events: none;
    }

    .modern-card {
      background: white;
      border: 1px solid #e7e5e4;
      border-radius: 1rem;
      transition: all 0.2s ease;
    }
    .dark .modern-card {
      background: #1c1917;
      border-color: #292524;
    }

    /* Custom Scrollbar for smooth touch & desktop lists */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #d6d3d1;
      border-radius: 9999px;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: #44403c;
    }
  </style>
</head>
<body class="bg-brand-surface dark:bg-stone-950 text-stone-900 dark:text-stone-100 antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;
    const { 
      RefreshCw, Lock, Eye, EyeOff, Moon, Sun, Settings, Plus,
      TrendingUp, TrendingDown, Wallet, ArrowRightLeft,
      ChevronDown, ChevronUp, ChevronsUpDown, Check,
      Tag, Edit3, Trash2, X, MoreHorizontal, Calendar, PieChart
    } = lucideReact;
    const { AreaChart, Area, XAxis, YAxis, Tooltip, ResponsiveContainer } = Recharts;

    // --- Format Helpers ---
    const formatCurrency = (amt, isPrivate = false) => {
      if (isPrivate) return '₹ ••••••';
      const num = Number(amt);
      return (num < 0 ? '-' : '') + '₹' + Math.abs(num).toLocaleString('en-IN');
    };

    const formatDateShort = (dStr) => {
      if (!dStr) return '';
      const d = new Date(dStr);
      if (isNaN(d)) return dStr;
      return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
    };

    // --- Mock Initial Ledger Data ---
    const INITIAL_TRANSACTIONS = [
      { id: '1', date: '2026-08-01', type: 'INCOME', category: 'Salary', amount: 119965, description: 'Aug Salary', tag: '#paycheck', account: 'HDFC' },
      { id: '2', date: '2026-08-07', type: 'EXPENSE', category: 'EMI & Loans', amount: 50000, description: 'Gold Loan principle', tag: '#goldloan', account: 'HDFC' },
      { id: '3', date: '2026-08-12', type: 'TRANSFER', category: 'Transfer', amount: 10000, description: 'For kite investment', tag: '#invest', account: 'HDFC → SBI' },
      { id: '4', date: '2026-08-12', type: 'EXPENSE', category: 'Investment', amount: 10000, description: 'Kite equity purchase', tag: '#invest', account: 'SBI' },
      { id: '5', date: '2026-08-14', type: 'EXPENSE', category: 'Healthcare', amount: 3500, description: 'Iniyaal Vaccine', tag: '#iniyaal', account: 'Cash' },
      { id: '6', date: '2026-08-15', type: 'EXPENSE', category: 'Childcare', amount: 2200, description: 'iniyaal daiper', tag: '#iniyaal', account: 'HDFC' },
      { id: '7', date: '2026-08-17', type: 'EXPENSE', category: 'Beverages', amount: 180, description: 'Coffe with colleagues', tag: '#ofctea', account: 'HDFC' },
      { id: '8', date: '2026-08-18', type: 'EXPENSE', category: 'Beverages', amount: 120, description: 'Tea', tag: '#ofctea', account: 'HDFC' },
      { id: '9', date: '2026-07-25', type: 'EXPENSE', category: 'Utilities', amount: 1450, description: 'Broadband Bill', tag: '#wifi', account: 'HDFC' },
      { id: '10', date: '2026-07-01', type: 'INCOME', category: 'Salary', amount: 119965, description: 'Jul Salary', tag: '#paycheck', account: 'HDFC' }
    ];

    function App() {
      const [transactions, setTransactions] = useState(INITIAL_TRANSACTIONS);
      const [currentTab, setCurrentTab] = useState('transactions'); // overview, analytics, transactions
      const [typeFilter, setTypeFilter] = useState('ALL');
      const [selectedTag, setSelectedTag] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');
      const [isPrivate, setIsPrivate] = useState(false);
      const [isDark, setIsDark] = useState(false);
      const [selectedIds, setSelectedIds] = useState(new Set());
      const [collapsedMonths, setCollapsedMonths] = useState(new Set());

      // Long-Press Tooltip State for Mobile
      const [mobileTooltip, setMobileTooltip] = useState({ text: '', x: 0, y: 0, visible: false });
      const touchTimerRef = useRef(null);

      // Dark Mode Synchronizer
      useEffect(() => {
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [isDark]);

      // --- Mobile Long-Press Handlers ---
      const handleTouchStart = (text, e) => {
        const touch = e.touches[0];
        const clientX = touch.clientX;
        const clientY = touch.clientY;
        touchTimerRef.current = setTimeout(() => {
          setMobileTooltip({ text, x: clientX, y: clientY - 45, visible: true });
        }, 400); // 400ms threshold for press-and-hold
      };

      const handleTouchEnd = () => {
        if (touchTimerRef.current) {
          clearTimeout(touchTimerRef.current);
          touchTimerRef.current = null;
        }
        setMobileTooltip(prev => ({ ...prev, visible: false }));
      };

      // --- Filtered & Grouped Transactions ---
      const filteredTransactions = useMemo(() => {
        return transactions.filter(t => {
          const matchType = typeFilter === 'ALL' || t.type === typeFilter;
          const matchTag = selectedTag === 'ALL' || t.tag === selectedTag;
          const matchQuery = !searchQuery || 
            t.description.toLowerCase().includes(searchQuery.toLowerCase()) ||
            t.category.toLowerCase().includes(searchQuery.toLowerCase()) ||
            t.account.toLowerCase().includes(searchQuery.toLowerCase());
          return matchType && matchTag && matchQuery;
        });
      }, [transactions, typeFilter, selectedTag, searchQuery]);

      // Group by Month (e.g., "August 2026")
      const groupedMonths = useMemo(() => {
        const groups = {};
        filteredTransactions.forEach(t => {
          const d = new Date(t.date);
          const monthKey = d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
          if (!groups[monthKey]) groups[monthKey] = [];
          groups[monthKey].push(t);
        });
        return groups;
      }, [filteredTransactions]);

      const allMonthKeys = useMemo(() => Object.keys(groupedMonths), [groupedMonths]);
      const isAllCollapsed = allMonthKeys.length > 0 && allMonthKeys.every(k => collapsedMonths.has(k));

      // Global Toggle for Expand / Collapse All
      const toggleExpandCollapseAll = () => {
        if (isAllCollapsed || collapsedMonths.size > 0) {
          setCollapsedMonths(new Set()); // Expand all
        } else {
          setCollapsedMonths(new Set(allMonthKeys)); // Collapse all
        }
      };

      const toggleMonthCollapse = (monthKey) => {
        setCollapsedMonths(prev => {
          const next = new Set(prev);
          if (next.has(monthKey)) next.delete(monthKey);
          else next.add(monthKey);
          return next;
        });
      };

      // --- Selection Logic ---
      const isAllSelected = filteredTransactions.length > 0 && selectedIds.size === filteredTransactions.length;

      const toggleSelectAll = () => {
        if (isAllSelected) {
          setSelectedIds(new Set());
        } else {
          setSelectedIds(new Set(filteredTransactions.map(t => t.id)));
        }
      };

      const toggleSelectRow = (id) => {
        setSelectedIds(prev => {
          const next = new Set(prev);
          if (next.has(id)) next.delete(id);
          else next.add(id);
          return next;
        });
      };

      // --- Selected Net Calculation (Excludes TRANSFER / Net 0) ---
      const selectedNetSum = useMemo(() => {
        const selectedList = transactions.filter(t => selectedIds.has(t.id));
        return selectedList.reduce((acc, t) => {
          if (t.type === 'TRANSFER') return acc; // Exclude internal transfers
          if (t.type === 'INCOME') return acc + Number(t.amount);
          if (t.type === 'EXPENSE') return acc - Number(t.amount);
          return acc;
        }, 0);
      }, [transactions, selectedIds]);

      // Unique Tags
      const uniqueTags = useMemo(() => {
        const tags = new Set(transactions.map(t => t.tag).filter(Boolean));
        return Array.from(tags);
      }, [transactions]);

      return (
        <div className="flex min-h-screen">
          {/* Mobile Floating Press-and-Hold Tooltip Bubble */}
          {mobileTooltip.visible && (
            <div 
              className="fixed z-50 px-2.5 py-1 bg-stone-900 text-white text-[11px] font-bold tracking-wider uppercase rounded-md shadow-lg pointer-events-none -translate-x-1/2"
              style={{ left: `${mobileTooltip.x}px`, top: `${mobileTooltip.y}px` }}
            >
              {mobileTooltip.text}
            </div>
          )}

          {/* 1. Adaptive Desktop Sidebar Navigation */}
          <aside className="hidden md:flex flex-col items-center justify-between w-20 py-6 bg-white dark:bg-brand-sidebar border-r border-stone-200 dark:border-stone-800 shrink-0 select-none">
            <div className="flex flex-col items-center gap-8 w-full">
              {/* App Brand Icon */}
              <div className="w-11 h-11 bg-brand-teal text-white rounded-2xl flex items-center justify-center font-bold text-xl shadow-md shadow-brand-teal/20">
                ₹
              </div>

              {/* Sidebar Tabs */}
              <nav className="flex flex-col gap-3 w-full px-3">
                {[
                  { id: 'overview', label: 'Overview', icon: TrendingUp },
                  { id: 'analytics', label: 'Analytics', icon: PieChart },
                  { id: 'transactions', label: 'Transactions', icon: Wallet }
                ].map(tab => {
                  const Icon = tab.icon;
                  const isActive = currentTab === tab.id;
                  return (
                    <div key={tab.id} className="relative group flex justify-center tooltip-trigger">
                      <button
                        onClick={() => setCurrentTab(tab.id)}
                        className={`w-12 h-12 rounded-xl flex items-center justify-center transition-all ${
                          isActive 
                            ? 'bg-brand-teal/10 text-brand-teal border border-brand-teal/30 font-semibold' 
                            : 'text-stone-400 hover:text-stone-700 dark:hover:text-stone-200 hover:bg-stone-100 dark:hover:bg-stone-800'
                        }`}
                      >
                        <Icon size={20} />
                      </button>

                      {/* Desktop Hover Tooltip */}
                      <div className="custom-tooltip absolute left-14 top-2.5 z-50 bg-stone-900 text-white text-[11px] font-bold uppercase tracking-wider px-2.5 py-1 rounded shadow-md whitespace-nowrap">
                        {tab.label}
                      </div>
                    </div>
                  );
                })}
              </nav>
            </div>
          </aside>

          {/* 2. Main Content Area */}
          <div className="flex-1 flex flex-col min-w-0 pb-28 md:pb-12">
            {/* Header Toolbar */}
            <header className="px-5 md:px-8 py-5 flex items-center justify-between bg-brand-surface dark:bg-stone-950 border-b border-stone-200/60 dark:border-stone-800/60">
              <h1 className="text-2xl md:text-3xl font-extrabold tracking-tight capitalize text-stone-900 dark:text-white">
                {currentTab}
              </h1>

              {/* Header Action Buttons with Unified Hover Tooltips */}
              <div className="flex items-center gap-2">
                {[
                  { id: 'refresh', label: 'Refresh Data', icon: RefreshCw, action: () => {} },
                  { id: 'lock', label: 'Lock App', icon: Lock, action: () => {} },
                  { id: 'privacy', label: isPrivate ? 'Show Amounts' : 'Privacy Mode', icon: isPrivate ? EyeOff : Eye, action: () => setIsPrivate(!isPrivate) },
                  { id: 'theme', label: isDark ? 'Light Mode' : 'Dark Mode', icon: isDark ? Sun : Moon, action: () => setIsDark(!isDark) },
                  { id: 'settings', label: 'Settings', icon: Settings, action: () => {} }
                ].map(btn => {
                  const Icon = btn.icon;
                  return (
                    <div key={btn.id} className="relative group tooltip-trigger">
                      <button
                        onClick={btn.action}
                        onTouchStart={(e) => handleTouchStart(btn.label, e)}
                        onTouchEnd={handleTouchEnd}
                        onTouchCancel={handleTouchEnd}
                        className="w-10 h-10 rounded-full border border-stone-200 dark:border-stone-700 bg-white dark:bg-stone-900 flex items-center justify-center text-stone-600 dark:text-stone-300 hover:text-brand-teal dark:hover:text-brand-teal hover:border-brand-teal/40 transition-all shadow-sm"
                      >
                        <Icon size={18} />
                      </button>

                      {/* Unified Desktop Tooltip */}
                      <div className="custom-tooltip absolute top-12 left-1/2 -translate-x-1/2 z-50 bg-stone-900 text-white text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 rounded shadow-md whitespace-nowrap">
                        {btn.label}
                      </div>
                    </div>
                  );
                })}

                {/* Add Entry Action Button */}
                <button className="flex items-center gap-2 bg-brand-teal hover:bg-brand-teal-dark text-white px-4 py-2 rounded-xl font-bold text-sm shadow-md shadow-brand-teal/20 transition-all ml-1">
                  <Plus size={18} />
                  <span className="hidden sm:inline">Add entry</span>
                </button>
              </div>
            </header>

            <main className="p-4 md:p-8 max-w-7xl w-full mx-auto space-y-6">
              {/* Metric Cards (Standardized Balance Card Design) */}
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div className="modern-card p-5 border-t-4 border-t-brand-teal">
                  <span className="text-xs font-semibold uppercase tracking-wider text-stone-500 dark:text-stone-400">Total Balance</span>
                  <div className="text-2xl font-black mt-1 text-stone-900 dark:text-white">
                    {formatCurrency(542600, isPrivate)}
                  </div>
                </div>

                <div className="modern-card p-5 border-t-4 border-t-emerald-500">
                  <span className="text-xs font-semibold uppercase tracking-wider text-stone-500 dark:text-stone-400">August Income</span>
                  <div className="text-2xl font-black mt-1 text-emerald-600 dark:text-emerald-400">
                    {formatCurrency(119965, isPrivate)}
                  </div>
                </div>

                <div className="modern-card p-5 border-t-4 border-t-rose-500">
                  <span className="text-xs font-semibold uppercase tracking-wider text-stone-500 dark:text-stone-400">August Expenses</span>
                  <div className="text-2xl font-black mt-1 text-rose-600 dark:text-rose-400">
                    {formatCurrency(67680, isPrivate)}
                  </div>
                </div>
              </div>

              {/* 3. Type Filters (Standardized Terracotta Active Toggles) */}
              <div className="flex flex-wrap items-center gap-2">
                {['ALL', 'EXPENSE', 'INCOME', 'TRANSFER'].map(type => {
                  const isSelected = typeFilter === type;
                  return (
                    <button
                      key={type}
                      onClick={() => setTypeFilter(type)}
                      className={`px-4 py-1.5 rounded-full text-xs font-bold transition-all shadow-sm ${
                        isSelected
                          ? 'bg-brand-teal/10 text-brand-teal border border-brand-teal/30'
                          : 'bg-white dark:bg-stone-900 text-stone-600 dark:text-stone-400 border border-stone-200 dark:border-stone-800 hover:border-stone-300 dark:hover:border-stone-700'
                      }`}
                    >
                      {type}
                    </button>
                  );
                })}
              </div>

              {/* Search & Category Filter Bar */}
              <div className="modern-card p-2 flex flex-col sm:flex-row items-center gap-3">
                <input
                  type="text"
                  placeholder="Search transactions..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="w-full bg-transparent px-3 py-2 text-sm focus:outline-none text-stone-800 dark:text-stone-100 placeholder-stone-400"
                />
              </div>

              {/* 4. Tag Filters (Standardized Terracotta Active Toggles) */}
              <div className="flex flex-wrap items-center gap-2">
                <button
                  onClick={() => setSelectedTag('ALL')}
                  className={`px-3 py-1 rounded-full text-xs font-bold transition-all shadow-sm ${
                    selectedTag === 'ALL'
                      ? 'bg-brand-teal/10 text-brand-teal border border-brand-teal/30'
                      : 'bg-white dark:bg-stone-900 text-stone-600 dark:text-stone-400 border border-stone-200 dark:border-stone-800 hover:border-stone-300'
                  }`}
                >
                  All Tags
                </button>
                {uniqueTags.map(tag => {
                  const isSelected = selectedTag === tag;
                  return (
                    <button
                      key={tag}
                      onClick={() => setSelectedTag(isSelected ? 'ALL' : tag)}
                      className={`px-3 py-1 rounded-full text-xs font-bold transition-all shadow-sm ${
                        isSelected
                          ? 'bg-brand-teal/10 text-brand-teal border border-brand-teal/30'
                          : 'bg-white dark:bg-stone-900 text-stone-600 dark:text-stone-400 border border-stone-200 dark:border-stone-800 hover:border-stone-300'
                      }`}
                    >
                      {tag}
                    </button>
                  );
                })}
              </div>

              {/* 5. Restyled Select All Banner with Master Expand / Collapse Toggle */}
              <div className="modern-card px-4 py-3 flex items-center justify-between shadow-sm bg-white dark:bg-stone-900 border-stone-200 dark:border-stone-800">
                {/* Left: Select All Checkbox */}
                <label className="flex items-center gap-3 cursor-pointer select-none">
                  <div className={`w-5 h-5 rounded-md border flex items-center justify-center transition-all ${
                    isAllSelected 
                      ? 'bg-brand-teal border-brand-teal text-white' 
                      : 'border-stone-300 dark:border-stone-600 bg-stone-50 dark:bg-stone-800'
                  }`}>
                    {isAllSelected && <Check size={14} strokeWidth={3} />}
                  </div>
                  <input
                    type="checkbox"
                    checked={isAllSelected}
                    onChange={toggleSelectAll}
                    className="hidden"
                  />
                  <span className="text-xs font-bold tracking-wider uppercase text-stone-700 dark:text-stone-200">
                    SELECT ALL ({filteredTransactions.length})
                  </span>
                </label>

                {/* Right: Master Expand/Collapse All Action */}
                <button
                  onClick={toggleExpandCollapseAll}
                  className="flex items-center gap-1.5 px-3 py-1 rounded-lg text-xs font-bold text-stone-600 dark:text-stone-300 hover:text-brand-teal dark:hover:text-brand-teal hover:bg-stone-100 dark:hover:bg-stone-800 transition-all border border-stone-200 dark:border-stone-700"
                >
                  <ChevronsUpDown size={14} />
                  <span>{isAllCollapsed ? 'Expand All' : 'Collapse All'}</span>
                </button>
              </div>

              {/* 6. Grouped Ledger Transactions */}
              <div className="space-y-4">
                {Object.entries(groupedMonths).map(([monthKey, monthItems]) => {
                  const isCollapsed = collapsedMonths.has(monthKey);
                  
                  // Strict Outflow Calculations (Excluding internal transfers)
                  const monthlyOutflow = monthItems
                    .filter(t => t.type === 'EXPENSE' && t.category !== 'Investment')
                    .reduce((sum, t) => sum + Number(t.amount), 0);

                  const monthlyInvestment = monthItems
                    .filter(t => t.category === 'Investment')
                    .reduce((sum, t) => sum + Number(t.amount), 0);

                  return (
                    <div key={monthKey} className="modern-card overflow-hidden shadow-sm">
                      {/* Month Header Banner */}
                      <div 
                        onClick={() => toggleMonthCollapse(monthKey)}
                        className="px-4 py-3.5 flex items-center justify-between cursor-pointer hover:bg-stone-50/60 dark:hover:bg-stone-800/40 transition-colors select-none"
                      >
                        <div className="flex items-center gap-3">
                          {isCollapsed ? <ChevronDown size={18} className="text-stone-400" /> : <ChevronUp size={18} className="text-stone-400" />}
                          <h2 className="text-base font-bold text-stone-900 dark:text-white">
                            {monthKey}
                          </h2>
                          {monthKey.includes('August') && (
                            <span className="bg-brand-teal/10 text-brand-teal text-[10px] font-extrabold px-2 py-0.5 rounded uppercase">
                              This Month
                            </span>
                          )}
                        </div>

                        {/* Month Aggregate Badges */}
                        <div className="flex items-center gap-2">
                          <span className="hidden sm:inline text-xs text-stone-400 font-medium">{monthItems.length} entries</span>
                          <span className="text-xs font-bold px-2.5 py-1 rounded bg-stone-100 dark:bg-stone-800 text-stone-700 dark:text-stone-300">
                            -{formatCurrency(monthlyOutflow, isPrivate)}
                          </span>
                          {monthlyInvestment > 0 && (
                            <span className="text-xs font-bold px-2.5 py-1 rounded bg-amber-50 dark:bg-amber-950/40 text-amber-600 dark:text-amber-400 border border-amber-200/40 dark:border-amber-800/40">
                              +Inv {formatCurrency(monthlyInvestment, isPrivate)}
                            </span>
                          )}
                        </div>
                      </div>

                      {/* Transaction Rows */}
                      {!isCollapsed && (
                        <div className="divide-y divide-stone-100 dark:divide-stone-800/60 border-t border-stone-100 dark:border-stone-800">
                          {monthItems.map(row => {
                            const isSelected = selectedIds.has(row.id);
                            return (
                              <div 
                                key={row.id} 
                                className={`px-4 py-3 flex items-center justify-between gap-3 transition-colors ${
                                  isSelected ? 'bg-brand-teal/[0.03] dark:bg-brand-teal/[0.05]' : 'hover:bg-stone-50/50 dark:hover:bg-stone-800/30'
                                }`}
                              >
                                {/* Checkbox & Date */}
                                <div className="flex items-center gap-3 shrink-0">
                                  <div 
                                    onClick={() => toggleSelectRow(row.id)}
                                    className={`w-4 h-4 rounded border flex items-center justify-center cursor-pointer transition-all ${
                                      isSelected 
                                        ? 'bg-brand-teal border-brand-teal text-white' 
                                        : 'border-stone-300 dark:border-stone-600 bg-white dark:bg-stone-800'
                                    }`}
                                  >
                                    {isSelected && <Check size={11} strokeWidth={3} />}
                                  </div>
                                  <span className="text-xs font-semibold text-stone-400 w-14 shrink-0">
                                    {formatDateShort(row.date)}
                                  </span>
                                </div>

                                {/* Category Badge - Expanded width to 120px to prevent truncation */}
                                <div className="shrink-0 w-24 sm:w-28 text-left">
                                  <span className="inline-block max-w-[115px] truncate px-2.5 py-0.5 rounded-full text-[10px] font-extrabold uppercase tracking-wider bg-stone-100 dark:bg-stone-800 text-stone-600 dark:text-stone-300 border border-stone-200/60 dark:border-stone-700/60">
                                    {row.category}
                                  </span>
                                </div>

                                {/* Description & Tag */}
                                <div className="flex-1 min-w-0 pr-2">
                                  <p className="text-sm font-bold text-stone-800 dark:text-stone-100 truncate">
                                    {row.description}
                                  </p>
                                  {row.tag && (
                                    <span className="text-xs text-brand-teal font-medium">
                                      {row.tag}
                                    </span>
                                  )}
                                </div>

                                {/* Account */}
                                <div className="hidden sm:block text-xs font-medium text-stone-400 truncate max-w-[120px]">
                                  {row.account}
                                </div>

                                {/* Amount with shrink-0 protection */}
                                <div className="shrink-0 text-right">
                                  <span className={`text-sm font-black whitespace-nowrap ${
                                    row.type === 'INCOME' ? 'text-emerald-600 dark:text-emerald-400' :
                                    row.type === 'TRANSFER' ? 'text-stone-700 dark:text-stone-300' :
                                    'text-stone-900 dark:text-white'
                                  }`}>
                                    {row.type === 'INCOME' && '+'}
                                    {row.type === 'EXPENSE' && '-'}
                                    {formatCurrency(row.amount, isPrivate)}
                                  </span>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </main>

            {/* 7. Floating Bulk Action Toolbar */}
            {selectedIds.size > 0 && (
              <div className="fixed z-40 
                /* Mobile: Preserved pinned at bottom-[88px] */
                bottom-[88px] left-4 right-4 
                /* Desktop: Centered horizontally */
                md:left-1/2 md:-translate-x-1/2 md:right-auto md:bottom-8 md:w-auto md:min-w-[560px]"
              >
                <div className="bg-stone-900 dark:bg-stone-800 text-white rounded-2xl p-3 shadow-2xl flex items-center justify-between gap-4 border border-stone-700">
                  {/* Selected Count & Accurate Net Sum */}
                  <div className="flex items-center gap-2 pl-2">
                    <span className="text-xs font-bold text-stone-400">{selectedIds.size} selected</span>
                    <span className="text-sm font-black text-white">
                      {formatCurrency(selectedNetSum, isPrivate)}
                    </span>
                  </div>

                  {/* Desktop Full Actions */}
                  <div className="hidden md:flex items-center gap-2">
                    <button className="px-3 py-1.5 rounded-lg bg-stone-800 hover:bg-stone-700 text-xs font-bold flex items-center gap-1.5 transition-colors">
                      <Tag size={14} /> Re-categorize
                    </button>
                    <button className="px-3 py-1.5 rounded-lg bg-stone-800 hover:bg-stone-700 text-xs font-bold flex items-center gap-1.5 transition-colors">
                      <Plus size={14} /> Add Tags
                    </button>
                    <button className="px-3 py-1.5 rounded-lg bg-stone-800 hover:bg-stone-700 text-xs font-bold flex items-center gap-1.5 transition-colors">
                      <Edit3 size={14} /> Description
                    </button>
                    <button className="px-3 py-1.5 rounded-lg bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 text-xs font-bold flex items-center gap-1.5 transition-colors">
                      <Trash2 size={14} /> Delete
                    </button>
                  </div>

                  {/* Mobile Compact Actions Menu */}
                  <div className="flex md:hidden items-center gap-2">
                    <button className="px-3 py-1.5 rounded-lg bg-stone-800 text-xs font-bold flex items-center gap-1.5">
                      <MoreHorizontal size={15} /> Actions
                    </button>
                  </div>

                  {/* Dismiss */}
                  <button 
                    onClick={() => setSelectedIds(new Set())}
                    className="p-1 rounded-lg text-stone-400 hover:text-white"
                  >
                    <X size={18} />
                  </button>
                </div>
              </div>
            )}

            {/* 8. Mobile Bottom Navigation Bar with Press-and-Hold Tooltips */}
            <nav className="md:hidden fixed bottom-0 left-0 right-0 h-16 bg-white dark:bg-stone-900 border-t border-stone-200 dark:border-stone-800 flex items-center justify-around z-30 px-4">
              {[
                { id: 'overview', label: 'Overview', icon: TrendingUp },
                { id: 'analytics', label: 'Analytics', icon: PieChart },
                { id: 'transactions', label: 'Transactions', icon: Wallet }
              ].map(tab => {
                const Icon = tab.icon;
                const isActive = currentTab === tab.id;
                return (
                  <button
                    key={tab.id}
                    onClick={() => setCurrentTab(tab.id)}
                    onTouchStart={(e) => handleTouchStart(tab.label, e)}
                    onTouchEnd={handleTouchEnd}
                    onTouchCancel={handleTouchEnd}
                    className={`flex flex-col items-center justify-center w-16 h-full transition-all ${
                      isActive ? 'text-brand-teal font-bold' : 'text-stone-400 hover:text-stone-600'
                    }`}
                  >
                    <Icon size={20} />
                    <span className="text-[10px] mt-1 capitalize">{tab.label}</span>
                  </button>
                );
              })}
            </nav>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
